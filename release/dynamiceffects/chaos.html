<!DOCTYPE html>
<html lang="zh">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no">
<title>🌀 混沌摆-槐序Lab-槐序实验室</title>
<link rel="icon" type="image/png" href="../tx.png">
<link href="https://cdn.jsdelivr.net/gh/webfontworld/misans/MiSans.css" rel="stylesheet">
<style>
  * { margin:0; padding:0; box-sizing:border-box; font-family:'MiSans', 'Segoe UI', system-ui, sans-serif; }
  body {
    background: #f5f7f5;
    background: linear-gradient(145deg, #f0f4f0 0%, #e8eee8 50%, #f5f7f5 100%);
    overflow:hidden;
    display:flex;
    justify-content:center;
    align-items:center;
    height:100vh;
    position:relative;
  }
  canvas {
    display:block;
    width:100vw;
    height:100vh;
    background: transparent;
  }

  /* ===== 加载动画 ===== */
  #loader {
    position:fixed;
    top:0; left:0; right:0; bottom:0;
    background: #f5f7f5;
    display:flex;
    flex-direction:column;
    justify-content:center;
    align-items:center;
    z-index:9999;
    transition:opacity 0.6s ease-out;
  }
  #loader.hide { opacity:0; pointer-events:none; }
  #loader .logo { font-size:5.5rem; animation: loaderPulse 1.2s ease-in-out infinite; margin-bottom:14px; }
  #loader .loader-text { color:rgba(0,0,0,0.3); font-size:1.6rem; letter-spacing:4px; font-weight:400; margin-bottom:20px; }
  #loader .loader-text span { color:#40C463; font-weight:600; }
  #loader .loading-status { color:rgba(0,0,0,0.15); font-size:1rem; letter-spacing:2px; margin-bottom:16px; animation: loadingDot 1.6s ease-in-out infinite; }
  @keyframes loadingDot { 0%,100% { opacity:0.3; } 50% { opacity:1; } }
  #loader .loader-bar { width:200px; height:4px; background:rgba(0,0,0,0.06); border-radius:4px; overflow:hidden; position:relative; }
  #loader .loader-bar .fill { position:absolute; left:0; top:0; height:100%; width:0%; background:linear-gradient(90deg, #216E39, #40C463, #9BE9A8); border-radius:4px; animation: loaderFill 2.5s ease-in-out forwards; }
  @keyframes loaderPulse { 0%,100% { transform:scale(1); } 50% { transform:scale(1.08); } }
  @keyframes loaderFill { 0% { width:0%; } 30% { width:40%; } 60% { width:75%; } 100% { width:100%; } }

  /* ===== 页眉 ===== */
  .header {
    position:fixed;
    top:0;
    left:0;
    right:0;
    z-index:10;
    padding:0 20px;
    height:56px;
    display:flex;
    align-items:center;
    justify-content:space-between;
    background:rgba(255,255,255,0.85);
    backdrop-filter:blur(16px);
    -webkit-backdrop-filter:blur(16px);
    border-bottom:1px solid rgba(0,0,0,0.04);
  }
  .header .brand {
    display:flex;
    align-items:center;
    gap:8px;
    text-decoration:none;
    color:#1a1a1a;
    font-weight:700;
    font-size:1.0rem;
  }
  .header .brand .logo-icon { font-size:1.4rem; }
  .header .brand .brand-text {
    background:linear-gradient(135deg, #216E39, #40C463);
    -webkit-background-clip:text;
    -webkit-text-fill-color:transparent;
    background-clip:text;
  }
  .header .nav-link {
    color:rgba(0,0,0,0.45);
    text-decoration:none;
    font-size:0.8rem;
    padding:4px 14px;
    border-radius:20px;
    transition:all 0.3s;
    border:1px solid rgba(0,0,0,0.04);
  }
  .header .nav-link:hover {
    background:rgba(0,0,0,0.04);
    color:#1a1a1a;
    border-color:rgba(0,0,0,0.1);
  }
  .header .nav-link.primary {
    background:linear-gradient(135deg, #40C463, #30A14E);
    border:none;
    color:#fff;
  }
  .header .nav-link.primary:hover { opacity:0.85; }
  .header .title {
    color:#1a1a1a;
    font-size:0.95rem;
    font-weight:500;
    letter-spacing:0.5px;
  }
  .header .title span { color:rgba(0,0,0,0.2); }

  /* ===== 页脚 ===== */
  .footer {
    position:fixed;
    bottom:0;
    left:0;
    right:0;
    z-index:10;
    padding:10px 20px;
    display:flex;
    align-items:center;
    justify-content:center;
    background:rgba(255,255,255,0.70);
    backdrop-filter:blur(12px);
    -webkit-backdrop-filter:blur(12px);
    border-top:1px solid rgba(0,0,0,0.04);
  }
  .footer .text {
    color:rgba(0,0,0,0.25);
    font-size:0.75rem;
    letter-spacing:0.5px;
  }
  .footer .text .love { color:rgba(239,68,68,0.15); }
  .footer .text .highlight { color:#216E39; }

  /* ===== 移动端适配 ===== */
  @media (max-width: 640px) {
    .header { height:48px; padding:0 14px; }
    .header .brand { font-size:0.85rem; }
    .header .brand .logo-icon { font-size:1.1rem; }
    .header .title { font-size:0.75rem; }
    .header .nav-link { font-size:0.7rem; padding:3px 10px; }
    .footer { padding:6px 14px; }
    .footer .text { font-size:0.6rem; }
  }
</style>
</head>
<body>

<div id="loader">
  <div class="logo">🌀</div>
  <div class="loader-text">槐序<span>Lab</span>-槐序实验室</div>
  <div class="loading-status">加载中...</div>
  <div class="loader-bar"><div class="fill"></div></div>
</div>

<!-- ===== 页眉 ===== -->
<header class="header">
  <a href="https://lab.lruriawa.top/" class="brand">
    <span class="logo-icon">🧪</span>
    <span class="brand-text">槐序Lab实验室</span>
  </a>
  <span class="title">🌀 混沌摆 <span>· 物理仿真</span></span>
  <a href="https://lab.lruriawa.top/release/home.html" class="nav-link primary">🏠 首页</a>
</header>

<canvas id="canvas"></canvas>

<!-- ===== 页脚 ===== -->
<footer class="footer">
  <span class="text">
    🧪 槐序Lab实验室 · 混沌摆 · 双摆混沌运动 &nbsp;|&nbsp; <span class="highlight">❤️ Design by DeepSeek</span>
    &nbsp;&nbsp;<span class="love">❤️</span>
  </span>
</footer>

<script>
document.addEventListener('DOMContentLoaded', function() {
  setTimeout(function() { document.getElementById('loader').classList.add('hide'); }, 2500);
});
if (document.readyState !== 'loading') {
  setTimeout(function() { document.getElementById('loader').classList.add('hide'); }, 2500);
}

const canvas = document.getElementById('canvas');
const ctx = canvas.getContext('2d');
let W, H, cx, cy;

function resize() {
  W = canvas.width = window.innerWidth;
  H = canvas.height = window.innerHeight;
  cx = W / 2;
  cy = H / 2;
}
resize();
window.addEventListener('resize', resize);

let theta1 = 2.0, theta2 = 2.0, omega1 = 0, omega2 = 0;
const g = 0.5;
let l1 = Math.min(W, H) * 0.15;
let l2 = Math.min(W, H) * 0.12;
const m1 = 1, m2 = 1, damping = 0.999;
let trail = [], MAX_TRAIL = 800;

function update() {
  const dt = 0.02;
  const num1 = -g * (2 * m1 + m2) * Math.sin(theta1);
  const num2 = -m2 * g * Math.sin(theta1 - 2 * theta2);
  const num3 = -2 * Math.sin(theta1 - theta2) * m2;
  const num4 = omega2 * omega2 * l2 + omega1 * omega1 * l1 * Math.cos(theta1 - theta2);
  const den = l1 * (2 * m1 + m2 - m2 * Math.cos(2 * theta1 - 2 * theta2));
  const alpha1 = (num1 + num2 + num3 * num4) / den;

  const num5 = 2 * Math.sin(theta1 - theta2);
  const num6 = omega1 * omega1 * l1 * (m1 + m2);
  const num7 = g * (m1 + m2) * Math.cos(theta1);
  const num8 = omega2 * omega2 * l2 * m2 * Math.cos(theta1 - theta2);
  const den2 = l2 * (2 * m1 + m2 - m2 * Math.cos(2 * theta1 - 2 * theta2));
  const alpha2 = (num5 * (num6 + num7 + num8)) / den2;

  omega1 += alpha1 * dt;
  omega2 += alpha2 * dt;
  omega1 *= damping;
  omega2 *= damping;
  theta1 += omega1 * dt;
  theta2 += omega2 * dt;

  const x1 = cx + l1 * Math.sin(theta1), y1 = cy + l1 * Math.cos(theta1);
  const x2 = x1 + l2 * Math.sin(theta2), y2 = y1 + l2 * Math.cos(theta2);

  trail.push({ x: x2, y: y2, hue: (theta1 + theta2) * 30 % 360 });
  if (trail.length > MAX_TRAIL) trail.shift();

  return { x1, y1, x2, y2 };
}

function draw() {
  const pos = update();

  // 清空画布
  ctx.clearRect(0, 0, W, H);

  // 背景
  const grad = ctx.createRadialGradient(cx, cy, 0, cx, cy, Math.max(W, H) * 0.7);
  grad.addColorStop(0, 'rgba(255,255,255,0.02)');
  grad.addColorStop(1, 'rgba(0,0,0,0.02)');
  ctx.fillStyle = grad;
  ctx.fillRect(0, 0, W, H);

  // 绘制轨迹
  for (let i = 0; i < trail.length; i++) {
    const t = trail[i];
    const alpha = (i / trail.length) * 0.5 + 0.1;
    ctx.globalAlpha = alpha;
    ctx.shadowBlur = 0;
    const progress = i / trail.length;
    const r = 2 + progress * 2;
    ctx.fillStyle = `hsl(${t.hue}, 60%, 45%)`;
    ctx.beginPath();
    ctx.arc(t.x, t.y, r, 0, Math.PI * 2);
    ctx.fill();
  }

  ctx.globalAlpha = 1;
  ctx.shadowBlur = 0;

  // 摆臂
  ctx.strokeStyle = 'rgba(0,0,0,0.08)';
  ctx.lineWidth = 1.5;
  ctx.beginPath();
  ctx.moveTo(cx, cy);
  ctx.lineTo(pos.x1, pos.y1);
  ctx.lineTo(pos.x2, pos.y2);
  ctx.stroke();

  // 悬挂点
  ctx.fillStyle = 'rgba(0,0,0,0.08)';
  ctx.beginPath();
  ctx.arc(cx, cy, 4, 0, Math.PI * 2);
  ctx.fill();

  // 摆球1
  const grad1 = ctx.createRadialGradient(pos.x1 - 3, pos.y1 - 3, 0, pos.x1, pos.y1, 10);
  grad1.addColorStop(0, '#5BE88A');
  grad1.addColorStop(1, '#30A14E');
  ctx.shadowBlur = 20;
  ctx.shadowColor = 'rgba(64,196,99,0.15)';
  ctx.fillStyle = grad1;
  ctx.beginPath();
  ctx.arc(pos.x1, pos.y1, 8, 0, Math.PI * 2);
  ctx.fill();

  // 摆球2
  const grad2 = ctx.createRadialGradient(pos.x2 - 2, pos.y2 - 2, 0, pos.x2, pos.y2, 7);
  grad2.addColorStop(0, '#6EE89A');
  grad2.addColorStop(1, '#216E39');
  ctx.shadowColor = 'rgba(33,110,57,0.15)';
  ctx.fillStyle = grad2;
  ctx.beginPath();
  ctx.arc(pos.x2, pos.y2, 6, 0, Math.PI * 2);
  ctx.fill();

  ctx.shadowBlur = 0;
  ctx.globalAlpha = 1;

  // 轻微装饰光晕
  ctx.fillStyle = 'rgba(64,196,99,0.02)';
  ctx.beginPath();
  ctx.arc(pos.x2, pos.y2, 40, 0, Math.PI * 2);
  ctx.fill();

  requestAnimationFrame(draw);
}

// 窗口缩放时重新计算摆长
window.addEventListener('resize', function() {
  resize();
  l1 = Math.min(W, H) * 0.15;
  l2 = Math.min(W, H) * 0.12;
});

draw();
</script>
</body>
</html>
