<!DOCTYPE html>
<html lang="zh">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no">
<title>🚀 星空穿越-槐序Lab-槐序实验室</title>
<link rel="icon" type="image/png" href="../tx.png">
<link href="https://cdn.jsdelivr.net/gh/webfontworld/misans/MiSans.css" rel="stylesheet">
<style>
  * { margin:0; padding:0; box-sizing:border-box; font-family:'MiSans', 'Segoe UI', system-ui, sans-serif; }
  body {
    background: #f5f7f5;
    background: linear-gradient(145deg, #f0f4f0 0%, #e8eee8 50%, #f5f7f5 100%);
    overflow:hidden;
    height:100vh;
    width:100vw;
    position:relative;
  }

  /* ===== 加载动画（统一风格） ===== */
  #loader {
    position:fixed;
    top:0; left:0; right:0; bottom:0;
    background: #f5f7f5;
    display:flex;
    flex-direction:column;
    justify-content:center;
    align-items:center;
    z-index:9999;
    transition:opacity 0.6s ease-out;
  }
  #loader.hide { opacity:0; pointer-events:none; }
  #loader .logo { font-size:5.5rem; animation: loaderPulse 1.2s ease-in-out infinite; margin-bottom:14px; }
  #loader .loader-text { color:rgba(0,0,0,0.3); font-size:1.6rem; letter-spacing:4px; font-weight:400; margin-bottom:20px; }
  #loader .loader-text span { color:#40C463; font-weight:600; }
  #loader .loading-status { color:rgba(0,0,0,0.15); font-size:1rem; letter-spacing:2px; margin-bottom:16px; animation: loadingDot 1.6s ease-in-out infinite; }
  @keyframes loadingDot { 0%,100% { opacity:0.3; } 50% { opacity:1; } }
  #loader .loader-bar { width:200px; height:4px; background:rgba(0,0,0,0.06); border-radius:4px; overflow:hidden; position:relative; }
  #loader .loader-bar .fill { position:absolute; left:0; top:0; height:100%; width:0%; background:linear-gradient(90deg, #216E39, #40C463, #9BE9A8); border-radius:4px; animation: loaderFill 2.5s ease-in-out forwards; }
  @keyframes loaderPulse { 0%,100% { transform:scale(1); } 50% { transform:scale(1.08); } }
  @keyframes loaderFill { 0% { width:0%; } 30% { width:40%; } 60% { width:75%; } 100% { width:100%; } }

  /* ===== 全屏 Canvas ===== */
  #canvas {
    display:block;
    position:fixed;
    top:0;
    left:0;
    width:100vw;
    height:100vh;
    z-index:1;
    background:#0a0818; /* 深色星空背景 */
  }

  /* ===== 页眉（毛玻璃） ===== */
  .header {
    position:fixed;
    top:0;
    left:0;
    right:0;
    z-index:10;
    padding:0 20px;
    height:56px;
    display:flex;
    align-items:center;
    justify-content:space-between;
    background:rgba(255,255,255,0.85);
    backdrop-filter:blur(16px);
    -webkit-backdrop-filter:blur(16px);
    border-bottom:1px solid rgba(0,0,0,0.04);
    pointer-events:none; /* 让滚轮事件穿透到 canvas */
  }
  .header .brand {
    display:flex;
    align-items:center;
    gap:8px;
    text-decoration:none;
    color:#1a1a1a;
    font-weight:700;
    font-size:1.0rem;
    pointer-events:auto; /* 链接可点击 */
  }
  .header .brand .logo-icon { font-size:1.4rem; }
  .header .brand .brand-text {
    background:linear-gradient(135deg, #216E39, #40C463);
    -webkit-background-clip:text;
    -webkit-text-fill-color:transparent;
    background-clip:text;
  }
  .header .nav-link {
    color:rgba(0,0,0,0.45);
    text-decoration:none;
    font-size:0.8rem;
    padding:4px 14px;
    border-radius:20px;
    transition:all 0.3s;
    border:1px solid rgba(0,0,0,0.04);
    pointer-events:auto; /* 链接可点击 */
  }
  .header .nav-link:hover {
    background:rgba(0,0,0,0.04);
    color:#1a1a1a;
    border-color:rgba(0,0,0,0.1);
  }
  .header .nav-link.primary {
    background:linear-gradient(135deg, #40C463, #30A14E);
    border:none;
    color:#fff;
  }
  .header .nav-link.primary:hover { opacity:0.85; }
  .header .title {
    color:#1a1a1a;
    font-size:0.95rem;
    font-weight:500;
    letter-spacing:0.5px;
    pointer-events:none;
  }
  .header .title span { color:rgba(0,0,0,0.2); }

  /* ===== 页脚（毛玻璃） ===== */
  .footer {
    position:fixed;
    bottom:0;
    left:0;
    right:0;
    z-index:10;
    padding:10px 20px;
    display:flex;
    align-items:center;
    justify-content:center;
    background:rgba(255,255,255,0.70);
    backdrop-filter:blur(12px);
    -webkit-backdrop-filter:blur(12px);
    border-top:1px solid rgba(0,0,0,0.04);
    pointer-events:none; /* 让点击事件穿透到 canvas */
  }
  .footer .text {
    color:rgba(0,0,0,0.25);
    font-size:0.75rem;
    letter-spacing:0.5px;
    pointer-events:none;
  }
  .footer .text .love { color:rgba(239,68,68,0.15); }
  .footer .text .highlight { color:#216E39; }

  /* ===== 交互提示（浮于 canvas 之上） ===== */
  #tip {
    position:fixed;
    bottom:80px;
    left:0;
    right:0;
    z-index:5;
    text-align:center;
    color:rgba(0,0,0,0.15);
    font-size:0.9rem;
    letter-spacing:2px;
    pointer-events:none;
    font-weight:400;
    transition:color 0.3s;
  }

  /* ===== 移动端适配 ===== */
  @media (max-width: 640px) {
    .header { height:48px; padding:0 14px; }
    .header .brand { font-size:0.85rem; }
    .header .brand .logo-icon { font-size:1.1rem; }
    .header .title { font-size:0.75rem; }
    .header .nav-link { font-size:0.7rem; padding:3px 10px; }
    .footer { padding:6px 14px; }
    .footer .text { font-size:0.6rem; }
    #tip { font-size:0.7rem; bottom:70px; }
  }
</style>
</head>
<body>

<!-- ===== 加载动画 ===== -->
<div id="loader">
  <div class="logo">🚀</div>
  <div class="loader-text">槐序<span>Lab</span>-槐序实验室</div>
  <div class="loading-status">加载中...</div>
  <div class="loader-bar"><div class="fill"></div></div>
</div>

<!-- ===== 全屏 Canvas ===== -->
<canvas id="canvas"></canvas>

<!-- ===== 交互提示 ===== -->
<div id="tip">🚀 滚轮加速 · 点击重置速度</div>

<!-- ===== 页眉 ===== -->
<header class="header">
  <a href="https://lab.lruriawa.top/" class="brand">
    <span class="logo-icon">🧪</span>
    <span class="brand-text">槐序Lab实验室</span>
  </a>
  <span class="title">🚀 星空穿越 <span>· 粒子动画</span></span>
  <a href="https://lab.lruriawa.top/release/home.html" class="nav-link primary">🏠 首页</a>
</header>

<!-- ===== 页脚 ===== -->
<footer class="footer">
  <span class="text">
    🧪 槐序Lab实验室 · 星空穿越 · 粒子动画 &nbsp;|&nbsp; <span class="highlight">❤️ Design by DeepSeek</span>
    &nbsp;&nbsp;<span class="love">❤️</span>
  </span>
</footer>

<script>
// ===== 加载动画隐藏（与原逻辑一致） =====
document.addEventListener('DOMContentLoaded', function() {
  setTimeout(function() { document.getElementById('loader').classList.add('hide'); }, 2000);
});
if (document.readyState !== 'loading') {
  setTimeout(function() { document.getElementById('loader').classList.add('hide'); }, 2000);
}

// ===== 以下为星空穿越核心逻辑，完全保留，一字未改 =====
const canvas = document.getElementById('canvas');
const ctx = canvas.getContext('2d');
let W, H;
function resize() { W = canvas.width = window.innerWidth; H = canvas.height = window.innerHeight; }
resize();
window.addEventListener('resize', resize);

const stars = [],
  COUNT = 600;
for (let i = 0; i < COUNT; i++) {
  const theta = Math.random() * Math.PI * 2;
  const phi = Math.acos(2 * Math.random() - 1);
  const r = Math.random() * 300 + 10;
  stars.push({
    x: r * Math.sin(phi) * Math.cos(theta),
    y: r * Math.cos(phi),
    z: r * Math.sin(phi) * Math.sin(theta),
    speed: 2 + Math.random() * 4,
    hue: 180 + Math.random() * 180,
    size: 0.5 + Math.random() * 2
  });
}

let speed = 8;

function draw() {
  ctx.fillStyle = 'rgba(0,0,0,0.15)';
  ctx.fillRect(0, 0, W, H);
  const cx = W / 2,
    cy = H / 2;
  for (let s of stars) {
    s.z -= s.speed * speed * 0.05;
    if (s.z < 1) {
      s.z = 300 + Math.random() * 100;
      const theta = Math.random() * Math.PI * 2;
      const phi = Math.acos(2 * Math.random() - 1);
      const r = 300 + Math.random() * 100;
      s.x = r * Math.sin(phi) * Math.cos(theta);
      s.y = r * Math.cos(phi);
      s.hue = 180 + Math.random() * 180;
    }
    const scale = 300 / s.z;
    const x = cx + s.x * scale,
      y = cy + s.y * scale;
    const size = s.size * scale * 0.5;
    if (x < -50 || x > W + 50 || y < -50 || y > H + 50) continue;
    const alpha = Math.min(1, 300 / s.z);
    ctx.globalAlpha = alpha * 0.8;
    ctx.shadowBlur = 20;
    ctx.shadowColor = `hsl(${s.hue},80%,60%)`;
    ctx.fillStyle = `hsl(${s.hue},90%,70%)`;
    ctx.beginPath();
    ctx.arc(x, y, Math.max(0.5, size), 0, Math.PI * 2);
    ctx.fill();
    ctx.shadowBlur = 0;
    ctx.globalAlpha = alpha * 0.2;
    ctx.fillStyle = `hsl(${s.hue},80%,50%)`;
    ctx.beginPath();
    ctx.arc(x - s.x * scale * 0.02, y - s.y * scale * 0.02, Math.max(0.3, size * 0.6), 0, Math.PI * 2);
    ctx.fill();
  }
  ctx.shadowBlur = 0;
  ctx.globalAlpha = 1;
  requestAnimationFrame(draw);
}

canvas.addEventListener('wheel', e => {
  e.preventDefault();
  speed = Math.max(2, Math.min(30, speed + (e.deltaY > 0 ? -1 : 1)));
}, { passive: false });

canvas.addEventListener('click', () => {
  speed = 8;
});

draw();
</script>
</body>
</html>
