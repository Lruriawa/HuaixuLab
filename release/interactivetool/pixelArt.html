<!DOCTYPE html>
<html lang="zh">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<title>🎨 像素画板-槐序Lab-槐序实验室</title>
<link rel="icon" type="image/png" href="../tx.png">
<link href="https://cdn.jsdelivr.net/gh/webfontworld/misans/MiSans.css" rel="stylesheet">
<style>
  * { margin:0; padding:0; box-sizing:border-box; touch-action:none; font-family:'MiSans', 'Segoe UI', system-ui, sans-serif; }
  body {
    background: #f5f7f5;
    background: linear-gradient(145deg, #f0f4f0 0%, #e8eee8 50%, #f5f7f5 100%);
    display:flex;
    justify-content:center;
    align-items:center;
    min-height:100vh;
    padding:10px;
    padding-top:70px;
    padding-bottom:70px;
    position:relative;
    overflow:hidden;
  }

  /* ===== 加载动画（统一风格） ===== */
  #loader {
    position:fixed;
    top:0; left:0; right:0; bottom:0;
    background: #f5f7f5;
    display:flex;
    flex-direction:column;
    justify-content:center;
    align-items:center;
    z-index:9999;
    transition:opacity 0.6s ease-out;
  }
  #loader.hide { opacity:0; pointer-events:none; }
  #loader .logo { font-size:5.5rem; animation: loaderPulse 1.2s ease-in-out infinite; margin-bottom:14px; }
  #loader .loader-text { color:rgba(0,0,0,0.3); font-size:1.6rem; letter-spacing:4px; font-weight:400; margin-bottom:20px; }
  #loader .loader-text span { color:#40C463; font-weight:600; }
  #loader .loading-status { color:rgba(0,0,0,0.15); font-size:1rem; letter-spacing:2px; margin-bottom:16px; animation: loadingDot 1.6s ease-in-out infinite; }
  @keyframes loadingDot { 0%,100% { opacity:0.3; } 50% { opacity:1; } }
  #loader .loader-bar { width:200px; height:4px; background:rgba(0,0,0,0.06); border-radius:4px; overflow:hidden; position:relative; }
  #loader .loader-bar .fill { position:absolute; left:0; top:0; height:100%; width:0%; background:linear-gradient(90deg, #216E39, #40C463, #9BE9A8); border-radius:4px; animation: loaderFill 2.5s ease-in-out forwards; }
  @keyframes loaderPulse { 0%,100% { transform:scale(1); } 50% { transform:scale(1.08); } }
  @keyframes loaderFill { 0% { width:0%; } 30% { width:40%; } 60% { width:75%; } 100% { width:100%; } }

  /* ===== 页眉（毛玻璃） ===== */
  .header {
    position:fixed;
    top:0;
    left:0;
    right:0;
    z-index:10;
    padding:0 20px;
    height:56px;
    display:flex;
    align-items:center;
    justify-content:space-between;
    background:rgba(255,255,255,0.85);
    backdrop-filter:blur(16px);
    -webkit-backdrop-filter:blur(16px);
    border-bottom:1px solid rgba(0,0,0,0.04);
  }
  .header .brand {
    display:flex;
    align-items:center;
    gap:8px;
    text-decoration:none;
    color:#1a1a1a;
    font-weight:700;
    font-size:1.0rem;
  }
  .header .brand .logo-icon { font-size:1.4rem; }
  .header .brand .brand-text {
    background:linear-gradient(135deg, #216E39, #40C463);
    -webkit-background-clip:text;
    -webkit-text-fill-color:transparent;
    background-clip:text;
  }
  .header .nav-link {
    color:rgba(0,0,0,0.45);
    text-decoration:none;
    font-size:0.8rem;
    padding:4px 14px;
    border-radius:20px;
    transition:all 0.3s;
    border:1px solid rgba(0,0,0,0.04);
  }
  .header .nav-link:hover {
    background:rgba(0,0,0,0.04);
    color:#1a1a1a;
    border-color:rgba(0,0,0,0.1);
  }
  .header .nav-link.primary {
    background:linear-gradient(135deg, #40C463, #30A14E);
    border:none;
    color:#fff;
  }
  .header .nav-link.primary:hover { opacity:0.85; }
  .header .title {
    color:#1a1a1a;
    font-size:0.95rem;
    font-weight:500;
    letter-spacing:0.5px;
  }
  .header .title span { color:rgba(0,0,0,0.2); }

  /* ===== 页脚（毛玻璃） ===== */
  .footer {
    position:fixed;
    bottom:0;
    left:0;
    right:0;
    z-index:10;
    padding:10px 20px;
    display:flex;
    align-items:center;
    justify-content:center;
    background:rgba(255,255,255,0.70);
    backdrop-filter:blur(12px);
    -webkit-backdrop-filter:blur(12px);
    border-top:1px solid rgba(0,0,0,0.04);
  }
  .footer .text {
    color:rgba(0,0,0,0.25);
    font-size:0.75rem;
    letter-spacing:0.5px;
  }
  .footer .text .love { color:rgba(239,68,68,0.15); }
  .footer .text .highlight { color:#216E39; }

  /* ===== 像素画板容器（毛玻璃卡片） ===== */
  .pixel-wrapper {
    background:rgba(255,255,255,0.85);
    backdrop-filter:blur(8px);
    -webkit-backdrop-filter:blur(8px);
    border-radius:20px;
    padding:16px;
    box-shadow:0 4px 40px rgba(0,0,0,0.04);
    border:1px solid rgba(0,0,0,0.04);
    max-width:600px;
    width:100%;
    position:relative;
  }
  .pixel-wrapper canvas {
    display:block;
    width:100%;
    height:auto;
    aspect-ratio:1/1;
    background:#0d0d1a;
    border-radius:16px;
    box-shadow:inset 0 0 60px rgba(0,0,0,0.2);
    cursor:crosshair;
    image-rendering:pixelated;
    touch-action:none;
  }

  /* ===== 控制栏 ===== */
  .controls {
    margin-top:14px;
    display:flex;
    gap:8px;
    flex-wrap:wrap;
    justify-content:center;
    align-items:center;
  }
  .controls .color-btn {
    width:34px;
    height:34px;
    border-radius:50%;
    border:2px solid rgba(0,0,0,0.06);
    cursor:pointer;
    transition:all 0.2s;
    flex-shrink:0;
  }
  .controls .color-btn:hover { transform:scale(1.08); }
  .controls .color-btn.active {
    border-color:#216E39;
    transform:scale(1.15);
    box-shadow:0 0 0 3px rgba(33,110,57,0.15);
  }
  .controls .color-btn:active { transform:scale(0.92); }
  .controls button {
    padding:8px 20px;
    border:none;
    border-radius:30px;
    background:linear-gradient(135deg, #e74c3c, #c0392b);
    color:#fff;
    font-weight:600;
    cursor:pointer;
    font-size:0.9rem;
    transition:opacity 0.2s;
    font-family:'MiSans', 'Segoe UI', sans-serif;
  }
  .controls button:active { transform:scale(0.95); }
  .controls button:hover { opacity:0.85; }

  /* ===== 移动端适配 ===== */
  @media (max-width: 640px) {
    body { padding-top:60px; padding-bottom:60px; }
    .pixel-wrapper { padding:12px; }
    .controls .color-btn { width:30px; height:30px; }
    .controls button { font-size:0.8rem; padding:6px 16px; }
  }
</style>
</head>
<body>

<!-- ===== 加载动画 ===== -->
<div id="loader">
  <div class="logo">🎨</div>
  <div class="loader-text">槐序<span>Lab</span>-槐序实验室</div>
  <div class="loading-status">加载中...</div>
  <div class="loader-bar"><div class="fill"></div></div>
</div>

<!-- ===== 页眉 ===== -->
<header class="header">
  <a href="https://lab.lruriawa.top/" class="brand">
    <span class="logo-icon">🧪</span>
    <span class="brand-text">槐序Lab实验室</span>
  </a>
  <span class="title">🎨 像素画板</span>
  <a href="https://lab.lruriawa.top/release/home.html" class="nav-link primary">🏠 首页</a>
</header>

<!-- ===== 像素画板主体 ===== -->
<div class="pixel-wrapper">
  <canvas id="canvas"></canvas>
  <div class="controls" id="controls"></div>
</div>

<!-- ===== 页脚 ===== -->
<footer class="footer">
  <span class="text">
    🧪 槐序Lab实验室 · 像素画板 &nbsp;|&nbsp; <span class="highlight">❤️ Design by DeepSeek</span>
    &nbsp;&nbsp;<span class="love">❤️</span>
  </span>
</footer>

<script>
// ===== 加载动画隐藏（2.5秒，与统一风格一致） =====
document.addEventListener('DOMContentLoaded', function() {
    setTimeout(function() { document.getElementById('loader').classList.add('hide'); }, 2500);
});
if (document.readyState !== 'loading') {
    setTimeout(function() { document.getElementById('loader').classList.add('hide'); }, 2500);
}

// ===== 以下为像素画板核心逻辑，完整保留，未作任何修改 =====
const canvas = document.getElementById('canvas');
const ctx = canvas.getContext('2d');
const controls = document.getElementById('controls');

let W, H, size, cols, rows;

function resize() {
  const rect = canvas.parentElement.getBoundingClientRect();
  const containerW = rect.width - 32;
  const containerH = containerW;
  const dim = Math.min(containerW, containerH, 600);
  canvas.width = dim;
  canvas.height = dim;
  canvas.style.width = '100%';
  canvas.style.height = 'auto';
  W = canvas.width;
  H = canvas.height;
  size = Math.floor(W / 20);
  cols = Math.floor(W / size);
  rows = Math.floor(H / size);
  canvas.width = cols * size;
  canvas.height = rows * size;
  W = canvas.width;
  H = canvas.height;
}
resize();
window.addEventListener('resize', resize);

let grid = [];
for (let r = 0; r < rows; r++) {
  grid[r] = [];
  for (let c = 0; c < cols; c++) grid[r][c] = null;
}

const colors = ['#ff6b6b', '#ffa94d', '#ffd93d', '#6bcb77', '#4d96ff', '#9b59b6', '#ff85a1', '#00b894', '#e17055', '#00cec9', '#fd79a8', '#fdcb6e', '#0984e3', '#6c5ce7', '#2d3436', '#ffffff'];
let currentColor = colors[0];

colors.forEach((c, i) => {
  const btn = document.createElement('div');
  btn.className = 'color-btn' + (i === 0 ? ' active' : '');
  btn.style.background = c;
  btn.addEventListener('click', function() {
    document.querySelectorAll('.color-btn').forEach(b => b.classList.remove('active'));
    this.classList.add('active');
    currentColor = c;
  });
  controls.appendChild(btn);
});

const clearBtn = document.createElement('button');
clearBtn.textContent = '🗑️ 清空';
clearBtn.addEventListener('click', function() {
  for (let r = 0; r < rows; r++) for (let c = 0; c < cols; c++) grid[r][c] = null;
  draw();
});
controls.appendChild(clearBtn);

function draw() {
  ctx.clearRect(0, 0, canvas.width, canvas.height);
  for (let r = 0; r < rows; r++) {
    for (let c = 0; c < cols; c++) {
      if (grid[r][c]) {
        ctx.fillStyle = grid[r][c];
        ctx.fillRect(c * size, r * size, size, size);
      }
    }
  }
  ctx.strokeStyle = 'rgba(255,255,255,0.03)';
  ctx.lineWidth = 0.5;
  for (let r = 0; r <= rows; r++) {
    ctx.beginPath();
    ctx.moveTo(0, r * size);
    ctx.lineTo(canvas.width, r * size);
    ctx.stroke();
  }
  for (let c = 0; c <= cols; c++) {
    ctx.beginPath();
    ctx.moveTo(c * size, 0);
    ctx.lineTo(c * size, canvas.height);
    ctx.stroke();
  }
}

function getPos(e) {
  const rect = canvas.getBoundingClientRect();
  const clientX = e.touches ? e.touches[0].clientX : e.clientX;
  const clientY = e.touches ? e.touches[0].clientY : e.clientY;
  const x = (clientX - rect.left) * (canvas.width / rect.width);
  const y = (clientY - rect.top) * (canvas.height / rect.height);
  return { col: Math.floor(x / size), row: Math.floor(y / size) };
}

function paint(e) {
  e.preventDefault();
  const pos = getPos(e);
  if (pos.col >= 0 && pos.col < cols && pos.row >= 0 && pos.row < rows) {
    grid[pos.row][pos.col] = currentColor;
    draw();
  }
}

canvas.addEventListener('mousedown', paint);
canvas.addEventListener('mousemove', function(e) {
  if (e.buttons === 1) paint(e);
});
canvas.addEventListener('touchstart', paint, { passive: false });
canvas.addEventListener('touchmove', paint, { passive: false });

draw();
</script>
</body>
</html>
