<!DOCTYPE html>
<html lang="zh">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no">
<title>🎤 音乐可视化-槐序Lab-槐序实验室</title>
<link rel="icon" type="image/png" href="../tx.png">
<link href="https://cdn.jsdelivr.net/gh/webfontworld/misans/MiSans.css" rel="stylesheet">
<style>
  * { margin:0; padding:0; box-sizing:border-box; font-family:'MiSans', 'Segoe UI', system-ui, sans-serif; }
  body {
    background: #f5f7f5;
    background: linear-gradient(145deg, #f0f4f0 0%, #e8eee8 50%, #f5f7f5 100%);
    display:flex;
    justify-content:center;
    align-items:center;
    min-height:100vh;
    padding:10px;
    padding-top:70px;
    padding-bottom:70px;
    position:relative;
    overflow:hidden;
  }

  /* ===== 加载动画（统一风格） ===== */
  #loader {
    position:fixed;
    top:0; left:0; right:0; bottom:0;
    background: #f5f7f5;
    display:flex;
    flex-direction:column;
    justify-content:center;
    align-items:center;
    z-index:9999;
    transition:opacity 0.6s ease-out;
  }
  #loader.hide { opacity:0; pointer-events:none; }
  #loader .logo { font-size:5.5rem; animation: loaderPulse 1.2s ease-in-out infinite; margin-bottom:14px; }
  #loader .loader-text { color:rgba(0,0,0,0.3); font-size:1.6rem; letter-spacing:4px; font-weight:400; margin-bottom:20px; }
  #loader .loader-text span { color:#40C463; font-weight:600; }
  #loader .loading-status { color:rgba(0,0,0,0.15); font-size:1rem; letter-spacing:2px; margin-bottom:16px; animation: loadingDot 1.6s ease-in-out infinite; }
  @keyframes loadingDot { 0%,100% { opacity:0.3; } 50% { opacity:1; } }
  #loader .loader-bar { width:200px; height:4px; background:rgba(0,0,0,0.06); border-radius:4px; overflow:hidden; position:relative; }
  #loader .loader-bar .fill { position:absolute; left:0; top:0; height:100%; width:0%; background:linear-gradient(90deg, #216E39, #40C463, #9BE9A8); border-radius:4px; animation: loaderFill 2.5s ease-in-out forwards; }
  @keyframes loaderPulse { 0%,100% { transform:scale(1); } 50% { transform:scale(1.08); } }
  @keyframes loaderFill { 0% { width:0%; } 30% { width:40%; } 60% { width:75%; } 100% { width:100%; } }

  /* ===== 页眉（毛玻璃） ===== */
  .header {
    position:fixed;
    top:0;
    left:0;
    right:0;
    z-index:10;
    padding:0 20px;
    height:56px;
    display:flex;
    align-items:center;
    justify-content:space-between;
    background:rgba(255,255,255,0.85);
    backdrop-filter:blur(16px);
    -webkit-backdrop-filter:blur(16px);
    border-bottom:1px solid rgba(0,0,0,0.04);
  }
  .header .brand {
    display:flex;
    align-items:center;
    gap:8px;
    text-decoration:none;
    color:#1a1a1a;
    font-weight:700;
    font-size:1.0rem;
  }
  .header .brand .logo-icon { font-size:1.4rem; }
  .header .brand .brand-text {
    background:linear-gradient(135deg, #216E39, #40C463);
    -webkit-background-clip:text;
    -webkit-text-fill-color:transparent;
    background-clip:text;
  }
  .header .nav-link {
    color:rgba(0,0,0,0.45);
    text-decoration:none;
    font-size:0.8rem;
    padding:4px 14px;
    border-radius:20px;
    transition:all 0.3s;
    border:1px solid rgba(0,0,0,0.04);
  }
  .header .nav-link:hover {
    background:rgba(0,0,0,0.04);
    color:#1a1a1a;
    border-color:rgba(0,0,0,0.1);
  }
  .header .nav-link.primary {
    background:linear-gradient(135deg, #40C463, #30A14E);
    border:none;
    color:#fff;
  }
  .header .nav-link.primary:hover { opacity:0.85; }
  .header .title {
    color:#1a1a1a;
    font-size:0.95rem;
    font-weight:500;
    letter-spacing:0.5px;
  }
  .header .title span { color:rgba(0,0,0,0.2); }

  /* ===== 页脚（毛玻璃） ===== */
  .footer {
    position:fixed;
    bottom:0;
    left:0;
    right:0;
    z-index:10;
    padding:10px 20px;
    display:flex;
    align-items:center;
    justify-content:center;
    background:rgba(255,255,255,0.70);
    backdrop-filter:blur(12px);
    -webkit-backdrop-filter:blur(12px);
    border-top:1px solid rgba(0,0,0,0.04);
  }
  .footer .text {
    color:rgba(0,0,0,0.25);
    font-size:0.75rem;
    letter-spacing:0.5px;
  }
  .footer .text .love { color:rgba(239,68,68,0.15); }
  .footer .text .highlight { color:#216E39; }

  /* ===== 可视化容器（毛玻璃卡片） ===== */
  .music-wrapper {
    background:rgba(255,255,255,0.85);
    backdrop-filter:blur(8px);
    -webkit-backdrop-filter:blur(8px);
    border-radius:20px;
    padding:16px;
    box-shadow:0 4px 40px rgba(0,0,0,0.04);
    border:1px solid rgba(0,0,0,0.04);
    max-width:700px;
    width:100%;
    position:relative;
  }
  .music-wrapper canvas {
    display:block;
    width:100%;
    height:auto;
    aspect-ratio:700/500;
    background:#0a0818;
    border-radius:16px;
    box-shadow:inset 0 0 60px rgba(0,0,0,0.3);
    cursor:pointer;
    touch-action:none;
  }

  /* ===== 提示文字 ===== */
  .music-hint {
    text-align:center;
    margin-top:12px;
    color:rgba(0,0,0,0.3);
    font-size:0.85rem;
    letter-spacing:1px;
    font-weight:400;
  }
  .music-hint span { color:#216E39; font-weight:500; }

  /* ===== 开始按钮（浮在画布上方） ===== */
  #startBtn {
    position:absolute;
    top:50%;
    left:50%;
    transform:translate(-50%, -50%);
    padding:16px 38px;
    background:linear-gradient(135deg, #40C463, #30A14E);
    border:none;
    border-radius:60px;
    color:#fff;
    font-size:1.2rem;
    font-weight:700;
    cursor:pointer;
    box-shadow:0 4px 30px rgba(64,196,99,0.35);
    z-index:10;
    transition:all 0.3s;
    font-family:'MiSans', 'Segoe UI', sans-serif;
    letter-spacing:0.5px;
  }
  #startBtn:active { transform:translate(-50%, -50%) scale(0.94); }
  #startBtn:hover { opacity:0.9; box-shadow:0 6px 40px rgba(64,196,99,0.45); }
  #startBtn.hidden { display:none; }

  /* ===== 状态提示（画布内） ===== */
  .status-tip {
    position:absolute;
    bottom:24px;
    left:50%;
    transform:translateX(-50%);
    color:rgba(255,255,255,0.12);
    font-size:0.75rem;
    letter-spacing:1px;
    pointer-events:none;
    z-index:2;
    text-align:center;
  }
  .status-tip .dot {
    display:inline-block;
    width:6px;
    height:6px;
    border-radius:50%;
    background:#40C463;
    margin-right:6px;
    animation: pulseDot 1.2s ease-in-out infinite;
  }
  @keyframes pulseDot {
    0%,100% { opacity:0.3; transform:scale(0.8); }
    50% { opacity:1; transform:scale(1.2); }
  }

  /* ===== 移动端适配 ===== */
  @media (max-width: 640px) {
    body { padding-top:60px; padding-bottom:60px; }
    .music-wrapper { padding:12px; }
    .music-hint { font-size:0.75rem; margin-top:8px; }
    #startBtn { padding:14px 28px; font-size:1rem; }
  }
</style>
</head>
<body>

<!-- ===== 加载动画 ===== -->
<div id="loader">
  <div class="logo">🎤</div>
  <div class="loader-text">槐序<span>Lab</span>-槐序实验室</div>
  <div class="loading-status">加载中...</div>
  <div class="loader-bar"><div class="fill"></div></div>
</div>

<!-- ===== 页眉 ===== -->
<header class="header">
  <a href="https://lab.lruriawa.top/" class="brand">
    <span class="logo-icon">🧪</span>
    <span class="brand-text">槐序Lab实验室</span>
  </a>
  <span class="title">🎤 音乐可视化</span>
  <a href="https://lab.lruriawa.top/release/home.html" class="nav-link primary">🏠 首页</a>
</header>

<!-- ===== 可视化主体 ===== -->
<div class="music-wrapper">
  <canvas id="canvas"></canvas>

  <!-- 开始按钮 -->
  <button id="startBtn">🎤 开始</button>

  <!-- 状态提示 -->
  <div class="status-tip" id="statusTip">
    <span class="dot"></span> 点击「开始」或点击画布启用麦克风
  </div>

  <div class="music-hint">🎵 允许麦克风权限 · 声音越大波形越高</div>
</div>

<!-- ===== 页脚 ===== -->
<footer class="footer">
  <span class="text">
    🧪 槐序Lab实验室 · 音乐可视化 &nbsp;|&nbsp; <span class="highlight">❤️ Design by DeepSeek</span>
    &nbsp;&nbsp;<span class="love">❤️</span>
  </span>
</footer>

<script>
// ===== 加载动画隐藏（2.5秒，与统一风格一致） =====
document.addEventListener('DOMContentLoaded', function() {
    setTimeout(function() { document.getElementById('loader').classList.add('hide'); }, 2500);
});
if (document.readyState !== 'loading') {
    setTimeout(function() { document.getElementById('loader').classList.add('hide'); }, 2500);
}

// ===== 以下为音乐可视化核心逻辑，完整保留，未作任何修改 =====
const canvas = document.getElementById('canvas');
const ctx = canvas.getContext('2d');
const startBtn = document.getElementById('startBtn');
const statusTip = document.getElementById('statusTip');

// 固定宽高比，适配容器
let W, H;
function resize() {
  const rect = canvas.parentElement.getBoundingClientRect();
  const containerW = rect.width - 32; // padding
  const aspectRatio = 700 / 500;
  let w = containerW;
  let h = w / aspectRatio;
  // 限制最大尺寸
  if (h > window.innerHeight * 0.6) {
    h = window.innerHeight * 0.6;
    w = h * aspectRatio;
  }
  canvas.width = Math.floor(w);
  canvas.height = Math.floor(h);
  canvas.style.width = '100%';
  canvas.style.height = 'auto';
  W = canvas.width;
  H = canvas.height;
}
resize();
window.addEventListener('resize', resize);

let audioCtx, analyser, dataArray, isRunning = false;

async function initAudio() {
  try {
    const stream = await navigator.mediaDevices.getUserMedia({ audio: true, video: false });
    audioCtx = new (window.AudioContext || window.webkitAudioContext)();
    const source = audioCtx.createMediaStreamSource(stream);
    analyser = audioCtx.createAnalyser();
    analyser.fftSize = 256;
    source.connect(analyser);
    dataArray = new Uint8Array(analyser.frequencyBinCount);
    isRunning = true;
    startBtn.classList.add('hidden');
    statusTip.innerHTML = '<span class="dot"></span> 🎵 正在捕捉音频...';
    draw();
  } catch (err) {
    alert('无法访问麦克风，请允许权限或使用Chrome浏览器');
  }
}

function draw() {
  if (!isRunning) { requestAnimationFrame(draw); return; }
  analyser.getByteFrequencyData(dataArray);
  ctx.clearRect(0, 0, W, H);

  const barWidth = W / dataArray.length * 2.5;
  let x = 0;
  for (let i = 0; i < dataArray.length; i++) {
    const barHeight = dataArray[i] / 255 * H * 0.7;
    const hue = i / dataArray.length * 360 + Date.now() * 0.01;
    ctx.fillStyle = `hsl(${hue},80%,60%)`;
    ctx.shadowBlur = 20;
    ctx.shadowColor = `hsl(${hue},80%,60%)`;
    ctx.fillRect(x, H - barHeight, barWidth - 2, barHeight);
    x += barWidth;
  }
  ctx.shadowBlur = 0;

  ctx.beginPath();
  ctx.strokeStyle = 'rgba(255,255,255,0.08)';
  ctx.lineWidth = 2;
  for (let i = 0; i < dataArray.length; i++) {
    const y = H / 2 + (dataArray[i] - 128) / 128 * H / 3;
    if (i === 0) ctx.moveTo(i * 2, y);
    else ctx.lineTo(i * 2, y);
  }
  ctx.stroke();

  requestAnimationFrame(draw);
}

startBtn.addEventListener('click', initAudio);
canvas.addEventListener('click', function() {
  if (!isRunning) initAudio();
});

// 初始绘制（等待用户操作）
draw();
</script>
</body>
</html>
