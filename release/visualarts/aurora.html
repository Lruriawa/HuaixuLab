<!DOCTYPE html>
<html lang="zh">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no">
<title>🌌 极光幻境-槐序Lab-槐序实验室</title>
<link rel="icon" type="image/png" href="../tx.png">
<link href="https://cdn.jsdelivr.net/gh/webfontworld/misans/MiSans.css" rel="stylesheet">
<style>
  * { margin:0; padding:0; box-sizing:border-box; font-family:'MiSans', 'Segoe UI', system-ui, sans-serif; }
  body {
    background: #0a0818;
    overflow:hidden;
    height:100vh;
    width:100vw;
    position:relative;
  }

  /* ===== 加载动画（统一风格） ===== */
  #loader {
    position:fixed;
    top:0; left:0; right:0; bottom:0;
    background: #f5f7f5;
    display:flex;
    flex-direction:column;
    justify-content:center;
    align-items:center;
    z-index:9999;
    transition:opacity 0.6s ease-out;
  }
  #loader.hide { opacity:0; pointer-events:none; }
  #loader .logo { font-size:5.5rem; animation: loaderPulse 1.2s ease-in-out infinite; margin-bottom:14px; }
  #loader .loader-text { color:rgba(0,0,0,0.3); font-size:1.6rem; letter-spacing:4px; font-weight:400; margin-bottom:20px; }
  #loader .loader-text span { color:#40C463; font-weight:600; }
  #loader .loading-status { color:rgba(0,0,0,0.15); font-size:1rem; letter-spacing:2px; margin-bottom:16px; animation: loadingDot 1.6s ease-in-out infinite; }
  @keyframes loadingDot { 0%,100% { opacity:0.3; } 50% { opacity:1; } }
  #loader .loader-bar { width:200px; height:4px; background:rgba(0,0,0,0.06); border-radius:4px; overflow:hidden; position:relative; }
  #loader .loader-bar .fill { position:absolute; left:0; top:0; height:100%; width:0%; background:linear-gradient(90deg, #216E39, #40C463, #9BE9A8); border-radius:4px; animation: loaderFill 2.5s ease-in-out forwards; }
  @keyframes loaderPulse { 0%,100% { transform:scale(1); } 50% { transform:scale(1.08); } }
  @keyframes loaderFill { 0% { width:0%; } 30% { width:40%; } 60% { width:75%; } 100% { width:100%; } }

  /* ===== 全屏 Canvas（置于底层） ===== */
  #canvas {
    display:block;
    position:fixed;
    top:0;
    left:0;
    width:100vw;
    height:100vh;
    z-index:1;
    background:#0a0818;
  }

  /* ===== 页眉（毛玻璃） ===== */
  .header {
    position:fixed;
    top:0;
    left:0;
    right:0;
    z-index:10;
    padding:0 20px;
    height:56px;
    display:flex;
    align-items:center;
    justify-content:space-between;
    background:rgba(255,255,255,0.85);
    backdrop-filter:blur(16px);
    -webkit-backdrop-filter:blur(16px);
    border-bottom:1px solid rgba(0,0,0,0.04);
    pointer-events:none; /* 让鼠标事件穿透，方便与画布交互（如有需要） */
  }
  .header .brand {
    display:flex;
    align-items:center;
    gap:8px;
    text-decoration:none;
    color:#1a1a1a;
    font-weight:700;
    font-size:1.0rem;
    pointer-events:auto;
  }
  .header .brand .logo-icon { font-size:1.4rem; }
  .header .brand .brand-text {
    background:linear-gradient(135deg, #216E39, #40C463);
    -webkit-background-clip:text;
    -webkit-text-fill-color:transparent;
    background-clip:text;
  }
  .header .nav-link {
    color:rgba(0,0,0,0.45);
    text-decoration:none;
    font-size:0.8rem;
    padding:4px 14px;
    border-radius:20px;
    transition:all 0.3s;
    border:1px solid rgba(0,0,0,0.04);
    pointer-events:auto;
  }
  .header .nav-link:hover {
    background:rgba(0,0,0,0.04);
    color:#1a1a1a;
    border-color:rgba(0,0,0,0.1);
  }
  .header .nav-link.primary {
    background:linear-gradient(135deg, #40C463, #30A14E);
    border:none;
    color:#fff;
  }
  .header .nav-link.primary:hover { opacity:0.85; }
  .header .title {
    color:#1a1a1a;
    font-size:0.95rem;
    font-weight:500;
    letter-spacing:0.5px;
    pointer-events:none;
  }
  .header .title span { color:rgba(0,0,0,0.2); }

  /* ===== 页脚（毛玻璃） ===== */
  .footer {
    position:fixed;
    bottom:0;
    left:0;
    right:0;
    z-index:10;
    padding:10px 20px;
    display:flex;
    align-items:center;
    justify-content:center;
    background:rgba(255,255,255,0.70);
    backdrop-filter:blur(12px);
    -webkit-backdrop-filter:blur(12px);
    border-top:1px solid rgba(0,0,0,0.04);
    pointer-events:none;
  }
  .footer .text {
    color:rgba(0,0,0,0.25);
    font-size:0.75rem;
    letter-spacing:0.5px;
    pointer-events:none;
  }
  .footer .text .love { color:rgba(239,68,68,0.15); }
  .footer .text .highlight { color:#216E39; }

  /* ===== 移动端适配 ===== */
  @media (max-width: 640px) {
    .header { height:48px; padding:0 14px; }
    .header .brand { font-size:0.85rem; }
    .header .brand .logo-icon { font-size:1.1rem; }
    .header .title { font-size:0.75rem; }
    .header .nav-link { font-size:0.7rem; padding:3px 10px; }
    .footer { padding:6px 14px; }
    .footer .text { font-size:0.6rem; }
  }
</style>
</head>
<body>

  <!-- ===== 加载动画 ===== -->
  <div id="loader">
    <div class="logo">🌌</div>
    <div class="loader-text">槐序<span>Lab</span>-槐序实验室</div>
    <div class="loading-status">加载中...</div>
    <div class="loader-bar"><div class="fill"></div></div>
  </div>

  <!-- ===== 全屏 Canvas ===== -->
  <canvas id="canvas"></canvas>

  <!-- ===== 页眉 ===== -->
  <header class="header">
    <a href="https://lab.lruriawa.top/" class="brand">
      <span class="logo-icon">🧪</span>
      <span class="brand-text">槐序Lab实验室</span>
    </a>
    <span class="title">🌌 极光幻境 <span>· 动态特效</span></span>
    <a href="https://lab.lruriawa.top/release/home.html" class="nav-link primary">🏠 首页</a>
  </header>

  <!-- ===== 页脚 ===== -->
  <footer class="footer">
    <span class="text">
      🧪 槐序Lab实验室 · 极光幻境 · 动态特效 &nbsp;|&nbsp; <span class="highlight">❤️ Design by DeepSeek</span>
      &nbsp;&nbsp;<span class="love">❤️</span>
    </span>
  </footer>

  <script>
  // ===== 加载动画隐藏（2.5秒，与统一风格一致） =====
  document.addEventListener('DOMContentLoaded', function() {
    setTimeout(function() { document.getElementById('loader').classList.add('hide'); }, 2500);
  });
  if (document.readyState !== 'loading') {
    setTimeout(function() { document.getElementById('loader').classList.add('hide'); }, 2500);
  }

  // ===== 以下为极光核心逻辑，完整保留，未作任何修改 =====
  const canvas = document.getElementById('canvas');
  const ctx = canvas.getContext('2d');
  let W, H;

  function resize() {
    W = canvas.width = window.innerWidth;
    H = canvas.height = window.innerHeight;
  }
  resize();
  window.addEventListener('resize', resize);

  const bands = [];
  const BAND_COUNT = 5;

  class Band {
    constructor() {
      this.points = [];
      this.hue = 180 + Math.random() * 60;
      this.width = 40 + Math.random() * 80;
      this.speed = 0.3 + Math.random() * 0.4;
      this.phase = Math.random() * 100;
      this.offsetY = Math.random() * H * 0.3;
      for (let i = 0; i <= 100; i++) this.points.push(i / 100);
    }
    getY(x) {
      const t = x / W;
      const wave1 = Math.sin(t * 4 + this.phase) * 0.15;
      const wave2 = Math.sin(t * 7 + this.phase * 1.3) * 0.08;
      const wave3 = Math.sin(t * 2 + this.phase * 0.5) * 0.2;
      return H * 0.3 + this.offsetY + (wave1 + wave2 + wave3) * H * 0.3;
    }
    draw(time) {
      const grad = ctx.createLinearGradient(0, 0, 0, H);
      const hue = (this.hue + time * 0.05) % 360;
      grad.addColorStop(0, `hsla(${hue},80%,60%,0)`);
      grad.addColorStop(0.3, `hsla(${hue+20},90%,65%,0.5)`);
      grad.addColorStop(0.6, `hsla(${hue+40},80%,55%,0.7)`);
      grad.addColorStop(0.8, `hsla(${hue+60},70%,45%,0.4)`);
      grad.addColorStop(1, `hsla(${hue+80},60%,30%,0)`);
      ctx.fillStyle = grad;
      ctx.shadowBlur = 60;
      ctx.shadowColor = `hsla(${hue},80%,60%,0.3)`;
      ctx.beginPath();
      const step = 4;
      for (let i = 0; i <= W; i += step) {
        const y = this.getY(i);
        if (i === 0) ctx.moveTo(i, y);
        else ctx.lineTo(i, y);
      }
      const bottomY = H * 0.7 + this.offsetY * 0.3;
      ctx.lineTo(W, bottomY);
      ctx.lineTo(0, bottomY);
      ctx.closePath();
      ctx.fill();
    }
  }

  for (let i = 0; i < BAND_COUNT; i++) bands.push(new Band());

  function draw(time) {
    ctx.fillStyle = 'rgba(10,10,26,0.08)';
    ctx.fillRect(0, 0, W, H);
    ctx.shadowBlur = 0;
    for (let b of bands) b.draw(time);
    ctx.shadowBlur = 0;
    requestAnimationFrame(draw);
  }

  draw(0);
  </script>
</body>
</html>
