<!DOCTYPE html>
<html lang="zh">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<title>📊 BMI计算器-槐序Lab-槐序实验室</title>
<link rel="icon" type="image/png" href="../tx.png">
<link href="https://cdn.jsdelivr.net/gh/webfontworld/misans/MiSans.css" rel="stylesheet">
<style>
  * { margin:0; padding:0; box-sizing:border-box; user-select:none; -webkit-tap-highlight-color:transparent; font-family:'MiSans', 'Segoe UI', system-ui, sans-serif; }
  body {
    background: #f5f7f5;
    background: linear-gradient(145deg, #f0f4f0 0%, #e8eee8 50%, #f5f7f5 100%);
    display:flex;
    justify-content:center;
    align-items:center;
    min-height:100vh;
    padding:10px;
    padding-top:70px;
    padding-bottom:70px;
    position:relative;
  }

  /* ===== 加载动画（统一风格） ===== */
  #loader {
    position:fixed;
    top:0; left:0; right:0; bottom:0;
    background: #f5f7f5;
    display:flex;
    flex-direction:column;
    justify-content:center;
    align-items:center;
    z-index:9999;
    transition:opacity 0.6s ease-out;
  }
  #loader.hide { opacity:0; pointer-events:none; }
  #loader .logo { font-size:5.5rem; animation: loaderPulse 1.2s ease-in-out infinite; margin-bottom:14px; }
  #loader .loader-text { color:rgba(0,0,0,0.3); font-size:1.6rem; letter-spacing:4px; font-weight:400; margin-bottom:20px; }
  #loader .loader-text span { color:#40C463; font-weight:600; }
  #loader .loading-status { color:rgba(0,0,0,0.15); font-size:1rem; letter-spacing:2px; margin-bottom:16px; animation: loadingDot 1.6s ease-in-out infinite; }
  @keyframes loadingDot { 0%,100% { opacity:0.3; } 50% { opacity:1; } }
  #loader .loader-bar { width:200px; height:4px; background:rgba(0,0,0,0.06); border-radius:4px; overflow:hidden; position:relative; }
  #loader .loader-bar .fill { position:absolute; left:0; top:0; height:100%; width:0%; background:linear-gradient(90deg, #216E39, #40C463, #9BE9A8); border-radius:4px; animation: loaderFill 2.5s ease-in-out forwards; }
  @keyframes loaderPulse { 0%,100% { transform:scale(1); } 50% { transform:scale(1.08); } }
  @keyframes loaderFill { 0% { width:0%; } 30% { width:40%; } 60% { width:75%; } 100% { width:100%; } }

  /* ===== 页眉（毛玻璃） ===== */
  .header {
    position:fixed;
    top:0;
    left:0;
    right:0;
    z-index:10;
    padding:0 20px;
    height:56px;
    display:flex;
    align-items:center;
    justify-content:space-between;
    background:rgba(255,255,255,0.85);
    backdrop-filter:blur(16px);
    -webkit-backdrop-filter:blur(16px);
    border-bottom:1px solid rgba(0,0,0,0.04);
  }
  .header .brand {
    display:flex;
    align-items:center;
    gap:8px;
    text-decoration:none;
    color:#1a1a1a;
    font-weight:700;
    font-size:1.0rem;
  }
  .header .brand .logo-icon { font-size:1.4rem; }
  .header .brand .brand-text {
    background:linear-gradient(135deg, #216E39, #40C463);
    -webkit-background-clip:text;
    -webkit-text-fill-color:transparent;
    background-clip:text;
  }
  .header .nav-link {
    color:rgba(0,0,0,0.45);
    text-decoration:none;
    font-size:0.8rem;
    padding:4px 14px;
    border-radius:20px;
    transition:all 0.3s;
    border:1px solid rgba(0,0,0,0.04);
  }
  .header .nav-link:hover {
    background:rgba(0,0,0,0.04);
    color:#1a1a1a;
    border-color:rgba(0,0,0,0.1);
  }
  .header .nav-link.primary {
    background:linear-gradient(135deg, #40C463, #30A14E);
    border:none;
    color:#fff;
  }
  .header .nav-link.primary:hover { opacity:0.85; }
  .header .title {
    color:#1a1a1a;
    font-size:0.95rem;
    font-weight:500;
    letter-spacing:0.5px;
  }
  .header .title span { color:rgba(0,0,0,0.2); }

  /* ===== 页脚（毛玻璃） ===== */
  .footer {
    position:fixed;
    bottom:0;
    left:0;
    right:0;
    z-index:10;
    padding:10px 20px;
    display:flex;
    align-items:center;
    justify-content:center;
    background:rgba(255,255,255,0.70);
    backdrop-filter:blur(12px);
    -webkit-backdrop-filter:blur(12px);
    border-top:1px solid rgba(0,0,0,0.04);
  }
  .footer .text {
    color:rgba(0,0,0,0.25);
    font-size:0.75rem;
    letter-spacing:0.5px;
  }
  .footer .text .love { color:rgba(239,68,68,0.15); }
  .footer .text .highlight { color:#216E39; }

  /* ===== 工具容器（毛玻璃卡片） ===== */
  .tool-wrapper {
    background:rgba(255,255,255,0.85);
    backdrop-filter:blur(8px);
    -webkit-backdrop-filter:blur(8px);
    border-radius:20px;
    padding:16px;
    box-shadow:0 4px 40px rgba(0,0,0,0.04);
    border:1px solid rgba(0,0,0,0.04);
    max-width:420px;
    width:100%;
  }
  .tool-header {
    display:flex;
    justify-content:space-between;
    align-items:center;
    padding:0 6px 12px 6px;
    color:#1a1a1a;
    font-weight:700;
    font-size:1.0rem;
  }
  .tool-header .title-tag {
    color:rgba(0,0,0,0.3);
    font-size:0.9rem;
    font-weight:400;
  }

  /* ===== 输入区域 ===== */
  .bmi-input {
    display:flex;
    flex-direction:column;
    gap:14px;
    padding:12px 0;
  }
  .bmi-input .row {
    display:flex;
    align-items:center;
    gap:12px;
  }
  .bmi-input label {
    color:rgba(0,0,0,0.5);
    font-size:0.95rem;
    width:60px;
    font-weight:500;
  }
  .bmi-input input {
    flex:1;
    padding:10px 14px;
    border-radius:12px;
    border:1px solid rgba(0,0,0,0.06);
    background:rgba(0,0,0,0.02);
    color:#1a1a1a;
    font-size:1.1rem;
    outline:none;
    font-family:'MiSans', 'Segoe UI', sans-serif;
    transition:border-color 0.2s, background 0.2s;
  }
  .bmi-input input:focus {
    border-color:#40C463;
    background:rgba(0,0,0,0.04);
  }
  .bmi-input input::placeholder { color:rgba(0,0,0,0.2); }

  /* ===== 结果区域 ===== */
  .bmi-result {
    text-align:center;
    padding:16px 0;
    border-top:1px solid rgba(0,0,0,0.04);
  }
  .bmi-result .value {
    font-size:3rem;
    font-weight:700;
    color:#216E39;
  }
  .bmi-result .status {
    font-size:1.2rem;
    margin-top:4px;
    color:rgba(0,0,0,0.4);
    font-weight:500;
  }
  .bmi-result .range {
    font-size:0.8rem;
    color:rgba(0,0,0,0.2);
    margin-top:6px;
    letter-spacing:0.3px;
  }

  /* ===== 说明 ===== */
  .how-to-play {
    background:rgba(0,0,0,0.04);
    border-radius:12px;
    padding:10px 14px;
    margin-top:12px;
    color:rgba(0,0,0,0.4);
    font-size:0.85rem;
    line-height:1.6;
    text-align:center;
  }
  .how-to-play strong { color:rgba(0,0,0,0.6); }

  /* ===== 移动端适配 ===== */
  @media (max-width: 640px) {
    body { padding-top:60px; padding-bottom:60px; }
    .tool-wrapper { padding:12px; }
    .tool-header { font-size:0.85rem; }
    .bmi-input label { font-size:0.85rem; width:50px; }
    .bmi-input input { font-size:1rem; padding:8px 12px; }
    .bmi-result .value { font-size:2.4rem; }
    .bmi-result .status { font-size:1rem; }
    .how-to-play { font-size:0.75rem; padding:8px 10px; }
  }
</style>
</head>
<body>

<!-- ===== 加载动画 ===== -->
<div id="loader">
  <div class="logo">📊</div>
  <div class="loader-text">槐序<span>Lab</span>-槐序实验室</div>
  <div class="loading-status">加载中...</div>
  <div class="loader-bar"><div class="fill"></div></div>
</div>

<!-- ===== 页眉 ===== -->
<header class="header">
  <a href="https://lab.lruriawa.top/" class="brand">
    <span class="logo-icon">🧪</span>
    <span class="brand-text">槐序Lab实验室</span>
  </a>
  <span class="title">📊 BMI计算器</span>
  <a href="https://lab.lruriawa.top/release/home.html" class="nav-link primary">🏠 首页</a>
</header>

<!-- ===== 工具主体 ===== -->
<div class="tool-wrapper">
  <div class="tool-header">
    <span style="opacity:0.5;">📊</span>
    <span class="title-tag">BMI计算器</span>
  </div>

  <div class="bmi-input">
    <div class="row">
      <label>📏 身高</label>
      <input type="number" id="height" placeholder="cm" value="170">
    </div>
    <div class="row">
      <label>⚖️ 体重</label>
      <input type="number" id="weight" placeholder="kg" value="65">
    </div>
  </div>

  <div class="bmi-result">
    <div class="value" id="bmiValue">22.5</div>
    <div class="status" id="bmiStatus">✅ 正常</div>
    <div class="range">偏瘦 &lt; 18.5 · 正常 18.5–24 · 超重 24–28 · 肥胖 ≥ 28</div>
  </div>

  <div class="how-to-play">
    <strong>💡 使用：</strong> 输入身高(cm)和体重(kg) · 自动计算BMI · 参考健康范围
  </div>
</div>

<!-- ===== 页脚 ===== -->
<footer class="footer">
  <span class="text">
    🧪 槐序Lab实验室 · BMI计算器 &nbsp;|&nbsp; <span class="highlight">❤️ Design by DeepSeek</span>
    &nbsp;&nbsp;<span class="love">❤️</span>
  </span>
</footer>

<script>
// ===== 加载动画隐藏（2.5秒，与统一风格一致） =====
document.addEventListener('DOMContentLoaded', function() {
    setTimeout(function() { document.getElementById('loader').classList.add('hide'); }, 2500);
});
if (document.readyState !== 'loading') {
    setTimeout(function() { document.getElementById('loader').classList.add('hide'); }, 2500);
}

// ===== 以下为BMI计算核心逻辑，完整保留，未作任何修改 =====
const height = document.getElementById('height');
const weight = document.getElementById('weight');
const bmiValue = document.getElementById('bmiValue');
const bmiStatus = document.getElementById('bmiStatus');

function calc() {
  const h = parseFloat(height.value) / 100;
  const w = parseFloat(weight.value);
  if (!h || !w || h <= 0 || w <= 0) {
    bmiValue.textContent = '--';
    bmiStatus.textContent = '请输入有效数值';
    bmiStatus.style.color = 'rgba(0,0,0,0.4)';
    return;
  }
  const bmi = w / (h * h);
  bmiValue.textContent = bmi.toFixed(1);
  if (bmi < 18.5) {
    bmiStatus.textContent = '⚠️ 偏瘦';
    bmiStatus.style.color = '#ffa94d';
  } else if (bmi < 24) {
    bmiStatus.textContent = '✅ 正常';
    bmiStatus.style.color = '#40C463';
  } else if (bmi < 28) {
    bmiStatus.textContent = '⚠️ 超重';
    bmiStatus.style.color = '#ffa94d';
  } else {
    bmiStatus.textContent = '⚠️ 肥胖';
    bmiStatus.style.color = '#ff6b6b';
  }
}

height.addEventListener('input', calc);
weight.addEventListener('input', calc);
calc();
</script>
</body>
</html>
