  /* ===== 加载动画（统一风格） ===== */
  #loader {
    position:fixed;
    top:0; left:0; right:0; bottom:0;
    background: #f5f7f5;
    display:flex;
    flex-direction:column;
    justify-content:center;
    align-items:center;
    z-index:9999;
    transition:opacity 0.6s ease-out;
  }
  #loader.hide { opacity:0; pointer-events:none; }
  #loader .logo { font-size:5.5rem; animation: loaderPulse 1.2s ease-in-out infinite; margin-bottom:14px; }
  #loader .loader-text { color:rgba(0,0,0,0.3); font-size:1.6rem; letter-spacing:4px; font-weight:400; margin-bottom:20px; }
  #loader .loader-text span { color:#40C463; font-weight:600; }
  #loader .loading-status { color:rgba(0,0,0,0.15); font-size:1rem; letter-spacing:2px; margin-bottom:16px; animation: loadingDot 1.6s ease-in-out infinite; }

    align-items:center;
    justify-content:space-between;
    background:rgba(255,255,255,0.85);

  }
  .header .brand {
    display:flex;
    align-items:center;
    gap:8px;
    text-decoration:none;
    color:#1a1a1a;
    font-weight:700;
    font-size:1.0rem;
  }
  .header .brand .logo-icon { font-size:1.4rem; }
  .header .brand .brand-text {

  .header .nav-link {
    color:rgba(0,0,0,0.45);
    text-decoration:none;
    font-size:0.8rem;
    padding:4px 14px;
    border-radius:20px;
    transition:all 0.3s;
    border:1px solid rgba(0,0,0,0.04);
  }
  .header .nav-link:hover {

    border-color:rgba(0,0,0,0.1);
  }

    border:none;
    color:#fff;

  .header .title {
    color:#1a1a1a;
    font-size:0.95rem;
    font-weight:500;
    letter-spacing:0.5px;
  }

  /* ===== 页脚（毛玻璃） ===== */
  .footer {
    position:fixed;
    bottom:0;
    left:0;
    right:0;
    z-index:10;
    padding:10px 20px;
    display:flex;
    align-items:center;
    justify-content:center;
    background:rgba(255,255,255,0.70);
    backdrop-filter:blur(12px);
    -webkit-backdrop-filter:blur(12px);
    border-top:1px solid rgba(0,0,0,0.04);
  }
  .footer .text {
    color:rgba(0,0,0,0.25);
    font-size:0.75rem;
    letter-spacing:0.5px;
  }
  .footer .text .love { color:rgba(239,68,68,0.15); }
  .footer .text .highlight { color:#216E39; }

  /* ===== 工具容器（毛玻璃卡片） ===== */
  .game-wrapper {
    background:rgba(255,255,255,0.85);
    backdrop-filter:blur(8px);
    -webkit-backdrop-filter:blur(8px);
    border-radius:20px;
    padding:16px;
    box-shadow:0 4px 40px rgba(0,0,0,0.04);
    border:1px solid rgba(0,0,0,0.04);
    max-width:440px;
    width:100%;
  }
  .tool-header {
    display:flex;
    justify-content:space-between;
    align-items:center;
    padding:0 6px 12px 6px;
    color:#1a1a1a;
    font-weight:700;
    font-size:1.0rem;
  }
  .tool-header .title-tag {
    color:rgba(0,0,0,0.3);
    font-size:0.9rem;
    font-weight:400;
  }

  /* ===== 内部工具容器（浅色毛玻璃） ===== */
  .tool-container {
    position:relative;
    width:100%;
    border-radius:16px;
    overflow:hidden;
    background:rgba(255,255,255,0.6);
    backdrop-filter:blur(6px);
    -webkit-backdrop-filter:blur(6px);
    border:1px solid rgba(0,0,0,0.04);
    padding:16px;
    min-height:360px;
  }

  /* ===== 搜索区域 ===== */
  .search-area {
    display:flex;
    gap:8px;
    margin-bottom:8px;
  }
  .search-area input {
    flex:1;
    background:rgba(255,255,255,0.7);
    border:1px solid rgba(0,0,0,0.06);
    border-radius:10px;
    padding:10px 14px;
    color:#1a1a1a;
    font-size:0.9rem;
    outline:none;
    transition:border-color 0.3s;
    font-family:'MiSans', 'Segoe UI', sans-serif;
  }
  .search-area input:focus { border-color:#40C463; }
  .search-area input::placeholder { color:rgba(0,0,0,0.2); }
  .search-area button {
    padding:10px 20px;
    border:none;
    border-radius:10px;
    font-size:0.85rem;
    font-weight:600;
    cursor:pointer;
    transition:transform 0.15s, opacity 0.2s;
    color:#fff;
    background:linear-gradient(135deg, #40C463, #30A14E);
    box-shadow:0 4px 20px rgba(64,196,99,0.25);
    white-space:nowrap;
    font-family:'MiSans', 'Segoe UI', sans-serif;
  }
  .search-area button:active { transform:scale(0.94); }
  .search-area button:disabled {
    opacity:0.4;
    cursor:not-allowed;
    transform:none;
  }
  .search-area button:hover { opacity:0.9; }

  .search-hint {
    color:rgba(0,0,0,0.12);
    font-size:0.55rem;
    text-align:center;
    margin-bottom:10px;
    letter-spacing:0.3px;
    font-weight:400;
  }

    gap:5px;
    flex-wrap:wrap;

    font-size:1.3rem;

  .weather-main .right {

  }
  .weather-main .right .weather-icon {

    margin-bottom:2px;
  }
  .weather-main .right .temp {

    font-size:2.6rem;
    font-weight:300;

  .weather-main .right .temp .degree {

  }
  .weather-main .right .desc {

  }

  .weather-details {
    display:grid;
    grid-template-columns:1fr 1fr 1fr;

    margin-top:12px;
  }
  .weather-details .item {
    background:rgba(255,255,255,0.5);
    border:1px solid rgba(0,0,0,0.04);
    border-radius:10px;
    padding:8px 6px;
    text-align:center;
  }
  .weather-details .item .icon { font-size:1.1rem; }
  .weather-details .item .value {
    color:rgba(0,0,0,0.7);
    font-size:0.8rem;
    font-weight:500;
    margin-top:2px;
  }
  .weather-details .item .label {
    color:rgba(0,0,0,0.15);
    font-size:0.5rem;
    text-transform:uppercase;
    letter-spacing:0.5px;
    margin-top:1px;
    font-weight:500;
  }

  /* ===== 状态提示 ===== */
  .weather-error {
    color:#e74c3c;
    text-align:center;
    padding:20px 0;
    font-size:0.9rem;
    display:none;
  }
  .weather-error.show { display:block; }

  .weather-loading {
    text-align:center;
    padding:30px 0;
    color:rgba(0,0,0,0.15);
    font-size:0.9rem;
    display:none;

  .weather-loading.show { display:block; }
  .weather-loading .spinner {

    width:30px;
    height:30px;

    border-top-color:#40C463;
    border-radius:50%;
    animation:spin 0.8s linear infinite;
    margin-bottom:8px;
  }
  @keyframes spin {
    0% { transform:rotate(0deg); }
    100% { transform:rotate(360deg); }
  }

  .weather-hint {
    color:rgba(0,0,0,0.12);
    text-align:center;
    padding:30px 0;
    font-size:0.85rem;
    line-height:1.8;
  }
  .weather-hint .icon-big { font-size:3rem; display:block; margin-bottom:8px; }

  /* ===== 说明 ===== */
  .how-to-play {
    background:rgba(0,0,0,0.04);
    border-radius:12px;
    padding:10px 14px;
    margin-top:10px;
    color:rgba(0,0,0,0.4);
    font-size:0.75rem;
    line-height:1.6;
    text-align:center;
    border:1px solid rgba(0,0,0,0.04);

    .weather-main { flex-direction:column; align-items:flex-start; gap:4px; }
    .weather-main .right { text-align:left; width:100%; }
    .weather-details { grid-template-columns:1fr 1fr 1fr; gap:4px; }
    .weather-details .item { padding:6px 4px; }

// ===== DOM 引用 =====
const cityInput = document.getElementById('cityInput');
const searchBtn = document.getElementById('searchBtn');
const weatherResult = document.getElementById('weatherResult');
const loadingState = document.getElementById('loadingState');
const errorState = document.getElementById('errorState');
const hintState = document.getElementById('hintState');

const cityName = document.getElementById('cityName');
const updateTime = document.getElementById('updateTime');
const temperature = document.getElementById('temperature');
const weatherDesc = document.getElementById('weatherDesc');
const weatherIcon = document.getElementById('weatherIcon');
const windSpeed = document.getElementById('windSpeed');
const humidity = document.getElementById('humidity');
const pressure = document.getElementById('pressure');
const quickCities = document.getElementById('quickCities');

// ===== 快捷城市列表 =====
const quickList = ['北京', '上海', '广州', '深圳', '成都', '杭州', '武汉', '重庆', '南京', '西安', '天津', '长沙', '郑州', '青岛', '厦门', '苏州', '昆明', '香港', '东京', '纽约'];

quickList.forEach(city => {
    const btn = document.createElement('button');
    btn.textContent = city;
    btn.dataset.city = city;
    btn.addEventListener('click', function() {
        cityInput.value = this.dataset.city;
        fetchWeather(this.dataset.city);
    });
    quickCities.appendChild(btn);
});

// ===== 获取城市坐标（精确匹配优先） =====
function getCityCoords(city) {
    // 1. 精确匹配
    if (cityCoords[city]) return cityCoords[city];

    // 2. 去掉末尾的"市"、"省"、"区"、"县"后匹配
    const clean = city.replace(/[市区县省]$/, '');
    if (cityCoords[clean]) return cityCoords[clean];

    // 3. 遍历模糊匹配（包含关系）
    for (const [key, val] of Object.entries(cityCoords)) {
        if (city.includes(key) && key.length > 2) return val;
        if (key.includes(city) && city.length > 2) return val;
    }

    return null;
}

// ===== 天气代码转图标 =====
function getWeatherIconByCode(code) {
    const icons = {
        0: '☀️', 1: '🌤️', 2: '⛅', 3: '☁️',
        45: '🌫️', 48: '🌫️',
        51: '🌦️', 53: '🌦️', 55: '🌧️', 56: '🌧️', 57: '🌧️',
        61: '🌧️', 63: '🌧️', 65: '⛈️', 66: '🌧️', 67: '🌧️',
        71: '🌨️', 73: '🌨️', 75: '❄️', 77: '🌨️',
        80: '🌦️', 81: '🌧️', 82: '⛈️',
        85: '🌨️', 86: '❄️',
        95: '⛈️', 96: '⛈️', 99: '⛈️'
    };
    return icons[code] || '🌤️';
}

function getWeatherDescByCode(code) {
    const descs = {
        0: '晴朗', 1: '晴朗', 2: '部分多云', 3: '多云',
        45: '雾', 48: '雾',
        51: '毛毛雨', 53: '毛毛雨', 55: '毛毛雨',
        56: '冻雨', 57: '冻雨',
        61: '小雨', 63: '中雨', 65: '大雨',
        66: '冻雨', 67: '冻雨',
        71: '小雪', 73: '中雪', 75: '大雪',
        77: '雪粒',
        80: '阵雨', 81: '阵雨', 82: '强阵雨',
        85: '阵雪', 86: '强阵雪',
        95: '雷暴', 96: '雷暴', 99: '强雷暴'
    };
    return descs[code] || '未知天气';
}

// ===== 查询天气 =====
async function fetchWeather(city) {
    if (!city || city.trim() === '') {
        cityInput.focus();
        return;
    }

    city = city.trim();

    const coords = getCityCoords(city);
    if (!coords) {
        errorState.textContent = `❌ 未找到「${city}」，请检查输入（支持省/市/区/县）`;
        errorState.classList.add('show');
        weatherResult.classList.remove('show');
        loadingState.classList.remove('show');
        hintState.style.display = 'none';
        searchBtn.disabled = false;
        return;
    }

    loadingState.classList.add('show');
    weatherResult.classList.remove('show');
    errorState.classList.remove('show');
    hintState.style.display = 'none';
    searchBtn.disabled = true;

    try {
        const url = `https://api.open-meteo.com/v1/forecast?latitude=${coords.lat}&longitude=${coords.lon}&current=temperature_2m,relative_humidity_2m,wind_speed_10m,weather_code,pressure_msl&hourly=pressure_msl&timezone=auto`;

        const resp = await fetch(url, { signal: AbortSignal.timeout(10000) });

        if (!resp.ok) throw new Error('请求失败');

        const data = await resp.json();

        if (!data || !data.current) throw new Error('未获取到天气数据');

        const current = data.current;
        const temp = current.temperature_2m || '--';
        const humid = current.relative_humidity_2m || '--';
        const wind = current.wind_speed_10m || '--';
        const weatherCode = current.weather_code || 0;
        const desc = getWeatherDescByCode(weatherCode);
        const icon = getWeatherIconByCode(weatherCode);

        let pressureVal = '--';
        if (current.pressure_msl !== undefined && current.pressure_msl !== null) {
            pressureVal = current.pressure_msl;
        } else if (data.hourly && data.hourly.pressure_msl && data.hourly.pressure_msl.length > 0) {
            const p = data.hourly.pressure_msl.find(v => v !== null && v !== undefined);
            if (p !== undefined) pressureVal = p;
        }

        cityName.textContent = city;
        const now = new Date();
        updateTime.textContent = `更新于：${now.toLocaleTimeString('zh-CN')}`;
        temperature.innerHTML = `${temp}<span class="degree">°C</span>`;
        weatherDesc.textContent = desc;
        weatherIcon.textContent = icon;
        windSpeed.textContent = wind + ' km/h';
        humidity.textContent = humid + '%';
        pressure.textContent = (pressureVal !== '--') ? pressureVal + ' hPa' : '--';

        weatherResult.classList.add('show');
        loadingState.classList.remove('show');

    } catch (err) {
        console.error(err);
        errorState.textContent = `❌ ${err.message || '查询失败，请稍后重试'}`;
        errorState.classList.add('show');
        loadingState.classList.remove('show');
    }

    searchBtn.disabled = false;
}

// ===== 事件绑定 =====
searchBtn.addEventListener('click', function() {
    fetchWeather(cityInput.value);
});

cityInput.addEventListener('keydown', function(e) {
    if (e.key === 'Enter') {
        e.preventDefault();
        fetchWeather(this.value);
    }
});

// ===== 自动加载 =====
setTimeout(() => {
    fetchWeather('北京');
}, 500);
</script>
