<!DOCTYPE html>
<html lang="zh">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>🎯 目标追踪器-槐序Lab-槐序实验室</title>
    <link rel="icon" type="image/png" href="../tx.png">
    <link href="https://cdn.jsdelivr.net/gh/webfontworld/misans/MiSans.css" rel="stylesheet">
    <style>
        * { margin:0; padding:0; box-sizing:border-box; font-family:'MiSans', 'Segoe UI', system-ui, sans-serif; }
        body {
            background: #f5f7f5;
            background: linear-gradient(145deg, #f0f4f0 0%, #e8eee8 50%, #f5f7f5 100%);
            display:flex;
            justify-content:center;
            align-items:center;
            min-height:100vh;
            padding:10px;
            padding-top:70px;
            padding-bottom:70px;
            position:relative;
        }

        /* ===== 加载动画（统一风格） ===== */
        #loader {
            position:fixed;
            top:0; left:0; right:0; bottom:0;
            background: #f5f7f5;
            display:flex;
            flex-direction:column;
            justify-content:center;
            align-items:center;
            z-index:9999;
            transition:opacity 0.6s ease-out;
        }
        #loader.hide { opacity:0; pointer-events:none; }
        #loader .logo { font-size:5.5rem; animation: loaderPulse 1.2s ease-in-out infinite; margin-bottom:14px; }
        #loader .loader-text { color:rgba(0,0,0,0.3); font-size:1.6rem; letter-spacing:4px; font-weight:400; margin-bottom:20px; }
        #loader .loader-text span { color:#40C463; font-weight:600; }
        #loader .loading-status { color:rgba(0,0,0,0.15); font-size:1rem; letter-spacing:2px; margin-bottom:16px; animation: loadingDot 1.6s ease-in-out infinite; }
        @keyframes loadingDot { 0%,100% { opacity:0.3; } 50% { opacity:1; } }
        #loader .loader-bar { width:200px; height:4px; background:rgba(0,0,0,0.06); border-radius:4px; overflow:hidden; position:relative; }
        #loader .loader-bar .fill { position:absolute; left:0; top:0; height:100%; width:0%; background:linear-gradient(90deg, #216E39, #40C463, #9BE9A8); border-radius:4px; animation: loaderFill 2.5s ease-in-out forwards; }
        @keyframes loaderPulse { 0%,100% { transform:scale(1); } 50% { transform:scale(1.08); } }
        @keyframes loaderFill { 0% { width:0%; } 30% { width:40%; } 60% { width:75%; } 100% { width:100%; } }

        /* ===== 页眉（毛玻璃） ===== */
        .header {
            position:fixed;
            top:0;
            left:0;
            right:0;
            z-index:10;
            padding:0 20px;
            height:56px;
            display:flex;
            align-items:center;
            justify-content:space-between;
            background:rgba(255,255,255,0.85);
            backdrop-filter:blur(16px);
            -webkit-backdrop-filter:blur(16px);
            border-bottom:1px solid rgba(0,0,0,0.04);
        }
        .header .brand {
            display:flex;
            align-items:center;
            gap:8px;
            text-decoration:none;
            color:#1a1a1a;
            font-weight:700;
            font-size:1.0rem;
        }
        .header .brand .logo-icon { font-size:1.4rem; }
        .header .brand .brand-text {
            background:linear-gradient(135deg, #216E39, #40C463);
            -webkit-background-clip:text;
            -webkit-text-fill-color:transparent;
            background-clip:text;
        }
        .header .nav-link {
            color:rgba(0,0,0,0.45);
            text-decoration:none;
            font-size:0.8rem;
            padding:4px 14px;
            border-radius:20px;
            transition:all 0.3s;
            border:1px solid rgba(0,0,0,0.04);
        }
        .header .nav-link:hover {
            background:rgba(0,0,0,0.04);
            color:#1a1a1a;
            border-color:rgba(0,0,0,0.1);
        }
        .header .nav-link.primary {
            background:linear-gradient(135deg, #40C463, #30A14E);
            border:none;
            color:#fff;
        }
        .header .nav-link.primary:hover { opacity:0.85; }
        .header .title {
            color:#1a1a1a;
            font-size:0.95rem;
            font-weight:500;
            letter-spacing:0.5px;
        }
        .header .title span { color:rgba(0,0,0,0.2); }

        /* ===== 页脚（毛玻璃） ===== */
        .footer {
            position:fixed;
            bottom:0;
            left:0;
            right:0;
            z-index:10;
            padding:10px 20px;
            display:flex;
            align-items:center;
            justify-content:center;
            background:rgba(255,255,255,0.70);
            backdrop-filter:blur(12px);
            -webkit-backdrop-filter:blur(12px);
            border-top:1px solid rgba(0,0,0,0.04);
        }
        .footer .text {
            color:rgba(0,0,0,0.25);
            font-size:0.75rem;
            letter-spacing:0.5px;
        }
        .footer .text .love { color:rgba(239,68,68,0.15); }
        .footer .text .highlight { color:#216E39; }

        /* ===== 工具容器（毛玻璃卡片） ===== */
        .game-wrapper {
            background:rgba(255,255,255,0.85);
            backdrop-filter:blur(8px);
            -webkit-backdrop-filter:blur(8px);
            border-radius:20px;
            padding:16px;
            box-shadow:0 4px 40px rgba(0,0,0,0.04);
            border:1px solid rgba(0,0,0,0.04);
            max-width:420px;
            width:100%;
        }

        /* ===== 内部工具容器（浅色） ===== */
        .tool-container {
            position:relative;
            width:100%;
            border-radius:16px;
            overflow:hidden;
            background:#ffffff;
            box-shadow:inset 0 0 40px rgba(0,0,0,0.02);
            padding:20px 16px;
            min-height:380px;
            border:1px solid rgba(0,0,0,0.04);
        }

        /* ===== 输入区域 ===== */
        .goal-input-group {
            display:flex;
            gap:8px;
            margin-bottom:12px;
        }
        .goal-input-group input {
            flex:1;
            background:#f8faf8;
            border:1px solid rgba(0,0,0,0.06);
            border-radius:10px;
            padding:10px 14px;
            color:#1a1a1a;
            font-size:0.85rem;
            outline:none;
            transition:border-color 0.3s;
            font-family:'MiSans', 'Segoe UI', sans-serif;
        }
        .goal-input-group input:focus {
            border-color:rgba(33,110,57,0.25);
            background:#fafffa;
        }
        .goal-input-group input::placeholder {
            color:rgba(0,0,0,0.15);
        }
        .goal-input-group button {
            padding:10px 18px;
            border:none;
            border-radius:10px;
            font-size:0.8rem;
            font-weight:600;
            cursor:pointer;
            transition:transform 0.15s, opacity 0.2s;
            color:#fff;
            background:linear-gradient(135deg, #40C463, #30A14E);
            box-shadow:0 4px 20px rgba(64,196,99,0.25);
            white-space:nowrap;
            font-family:'MiSans', 'Segoe UI', sans-serif;
        }
        .goal-input-group button:active { transform:scale(0.94); }
        .goal-input-group button:hover { opacity:0.9; }

        /* ===== 目标列表 ===== */
        .goal-list {
            display:flex;
            flex-direction:column;
            gap:10px;
            max-height:260px;
            overflow-y:auto;
        }
        .goal-list::-webkit-scrollbar { width:4px; }
        .goal-list::-webkit-scrollbar-track { background:rgba(0,0,0,0.02); border-radius:4px; }
        .goal-list::-webkit-scrollbar-thumb { background:rgba(0,0,0,0.08); border-radius:4px; }

        .goal-item {
            background:rgba(0,0,0,0.02);
            border:1px solid rgba(0,0,0,0.04);
            border-radius:10px;
            padding:12px 14px;
            display:flex;
            align-items:center;
            justify-content:space-between;
            transition:all 0.3s;
        }
        .goal-item:hover {
            background:rgba(0,0,0,0.04);
            border-color:rgba(0,0,0,0.08);
        }
        .goal-item .goal-text {
            color:#1a1a1a;
            font-size:0.9rem;
            flex:1;
            word-break:break-word;
            margin-right:10px;
            font-weight:400;
        }
        .goal-item .goal-text.done {
            text-decoration:line-through;
            color:rgba(0,0,0,0.25);
        }
        .goal-item .goal-actions {
            display:flex;
            gap:6px;
            flex-shrink:0;
        }
        .goal-item .goal-actions button {
            border:none;
            border-radius:6px;
            padding:4px 10px;
            font-size:0.65rem;
            font-weight:600;
            cursor:pointer;
            transition:transform 0.15s, opacity 0.2s;
            font-family:'MiSans', 'Segoe UI', sans-serif;
        }
        .goal-item .goal-actions button:active { transform:scale(0.9); }
        .goal-item .goal-actions button:hover { opacity:0.85; }
        .goal-item .goal-actions .btn-done {
            background:rgba(33,110,57,0.08);
            border:1px solid rgba(33,110,57,0.1);
            color:#216E39;
        }
        .goal-item .goal-actions .btn-done:hover {
            background:rgba(33,110,57,0.14);
        }
        .goal-item .goal-actions .btn-done.done {
            background:rgba(239,68,68,0.08);
            border:1px solid rgba(239,68,68,0.1);
            color:#e74c3c;
        }
        .goal-item .goal-actions .btn-done.done:hover {
            background:rgba(239,68,68,0.14);
        }
        .goal-item .goal-actions .btn-delete {
            background:rgba(239,68,68,0.08);
            border:1px solid rgba(239,68,68,0.06);
            color:rgba(0,0,0,0.25);
        }
        .goal-item .goal-actions .btn-delete:hover {
            background:rgba(239,68,68,0.15);
            color:#e74c3c;
        }

        .goal-empty {
            color:rgba(0,0,0,0.15);
            text-align:center;
            padding:30px 0;
            font-style:italic;
            font-size:0.85rem;
        }

        /* ===== 计数器 ===== */
        .goal-counter {
            color:rgba(0,0,0,0.2);
            font-size:0.65rem;
            text-align:right;
            margin-top:8px;
            padding-top:8px;
            border-top:1px solid rgba(0,0,0,0.04);
            font-weight:400;
        }
        .goal-counter .count-done { color:#216E39; }

        /* ===== 说明 ===== */
        .how-to-play {
            background:rgba(0,0,0,0.04);
            border-radius:12px;
            padding:10px 14px;
            margin-top:10px;
            color:rgba(0,0,0,0.35);
            font-size:0.75rem;
            line-height:1.6;
            text-align:center;
            border:1px solid rgba(0,0,0,0.04);
        }
        .how-to-play strong { color:rgba(0,0,0,0.55); }

        /* ===== 移动端适配 ===== */
        @media (max-width: 640px) {
            body { padding-top:60px; padding-bottom:60px; }
            .game-wrapper { padding:12px; }
            .tool-container { padding:16px 12px; min-height:340px; }
            .goal-input-group input { font-size:0.8rem; padding:8px 12px; }
            .goal-input-group button { font-size:0.75rem; padding:8px 14px; }
            .goal-item { padding:10px 12px; }
            .goal-item .goal-text { font-size:0.8rem; }
            .goal-item .goal-actions button { font-size:0.6rem; padding:3px 8px; }
            .how-to-play { font-size:0.7rem; padding:8px 10px; }
            .goal-counter { font-size:0.6rem; }
        }
        @media (max-width: 380px) {
            .goal-input-group { flex-wrap:wrap; }
            .goal-input-group input { flex:1 1 100%; }
            .goal-input-group button { flex:1; }
        }
    </style>
</head>
<body>

    <!-- ===== 加载动画 ===== -->
    <div id="loader">
        <div class="logo">🎯</div>
        <div class="loader-text">槐序<span>Lab</span>-槐序实验室</div>
        <div class="loading-status">加载中...</div>
        <div class="loader-bar"><div class="fill"></div></div>
    </div>

    <script>
        setTimeout(function() {
            var loader = document.getElementById('loader');
            if (loader) loader.classList.add('hide');
        }, 2500);
        if (document.readyState !== 'loading') {
            setTimeout(function() {
                document.getElementById('loader').classList.add('hide');
            }, 2500);
        }
    </script>

    <!-- ===== 页眉 ===== -->
    <header class="header">
        <a href="https://lab.lruriawa.top/" class="brand">
            <span class="logo-icon">🧪</span>
            <span class="brand-text">槐序Lab实验室</span>
        </a>
        <span class="title">🎯 目标追踪</span>
        <a href="https://lab.lruriawa.top/release/home.html" class="nav-link primary">🏠 首页</a>
    </header>

    <!-- ===== 工具主体 ===== -->
    <div class="game-wrapper">
        <div class="tool-container">
            <div class="goal-input-group">
                <input type="text" id="goalInput" placeholder="输入目标..." maxlength="50">
                <button id="addGoalBtn">➕ 添加</button>
            </div>

            <div class="goal-list" id="goalList">
                <div class="goal-empty">还没有目标，添加一个吧 🎯</div>
            </div>

            <div class="goal-counter" id="goalCounter">总计: 0 | 已完成: 0</div>
        </div>

        <div class="how-to-play">
            <strong>🎯 目标追踪器：</strong>
            添加目标 → 完成后标记 ✓ → 随时删除，进度一目了然
        </div>
    </div>

    <!-- ===== 页脚 ===== -->
    <footer class="footer">
        <span class="text">
            🧪 槐序Lab实验室 · 目标追踪 &nbsp;|&nbsp; <span class="highlight">❤️ Design by DeepSeek</span>
            &nbsp;&nbsp;<span class="love">❤️</span>
        </span>
    </footer>

    <script>
        // ===== 以下为目标追踪核心逻辑，完整保留 =====
        const goalInput = document.getElementById('goalInput');
        const addBtn = document.getElementById('addGoalBtn');
        const goalList = document.getElementById('goalList');
        const goalCounter = document.getElementById('goalCounter');

        let goals = [];

        function loadGoals() {
            try {
                const saved = localStorage.getItem('goals_data');
                if (saved) {
                    goals = JSON.parse(saved);
                }
            } catch (e) {
                goals = [];
            }
            renderGoals();
        }

        function saveGoals() {
            try {
                localStorage.setItem('goals_data', JSON.stringify(goals));
            } catch (e) {}
        }

        function renderGoals() {
            if (goals.length === 0) {
                goalList.innerHTML = `<div class="goal-empty">还没有目标，添加一个吧 🎯</div>`;
                goalCounter.innerHTML = '总计: 0 | 已完成: 0';
                return;
            }

            let html = '';
            let doneCount = 0;
            for (let i = 0; i < goals.length; i++) {
                const g = goals[i];
                if (g.done) doneCount++;
                const doneClass = g.done ? 'done' : '';
                const doneBtnClass = g.done ? 'btn-done done' : 'btn-done';
                const doneText = g.done ? '↩️ 撤销' : '✅ 完成';
                html += `
                    <div class="goal-item">
                        <span class="goal-text ${doneClass}">${escapeHtml(g.text)}</span>
                        <div class="goal-actions">
                            <button class="${doneBtnClass}" data-index="${i}">${doneText}</button>
                            <button class="btn-delete" data-index="${i}">🗑️</button>
                        </div>
                    </div>
                `;
            }
            goalList.innerHTML = html;
            goalCounter.innerHTML = `总计: ${goals.length} | 已完成: <span class="count-done">${doneCount}</span>`;

            goalList.querySelectorAll('.btn-done').forEach(btn => {
                btn.addEventListener('click', function() {
                    const idx = parseInt(this.dataset.index);
                    toggleGoal(idx);
                });
            });
            goalList.querySelectorAll('.btn-delete').forEach(btn => {
                btn.addEventListener('click', function() {
                    const idx = parseInt(this.dataset.index);
                    deleteGoal(idx);
                });
            });
        }

        function escapeHtml(text) {
            const div = document.createElement('div');
            div.textContent = text;
            return div.innerHTML;
        }

        function addGoal() {
            const text = goalInput.value.trim();
            if (!text) {
                goalInput.focus();
                return;
            }
            goals.push({ text: text, done: false });
            goalInput.value = '';
            goalInput.focus();
            saveGoals();
            renderGoals();
        }

        function toggleGoal(index) {
            if (index >= 0 && index < goals.length) {
                goals[index].done = !goals[index].done;
                saveGoals();
                renderGoals();
            }
        }

        function deleteGoal(index) {
            if (index >= 0 && index < goals.length) {
                goals.splice(index, 1);
                saveGoals();
                renderGoals();
            }
        }

        addBtn.addEventListener('click', addGoal);
        goalInput.addEventListener('keydown', function(e) {
            if (e.key === 'Enter') addGoal();
        });

        loadGoals();
    </script>
</body>
</html>
