<!DOCTYPE html>
<html lang="zh">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<title>📋 密码生成器-槐序Lab-槐序实验室</title>
<link rel="icon" type="image/png" href="../tx.png">
<link href="https://cdn.jsdelivr.net/gh/webfontworld/misans/MiSans.css" rel="stylesheet">
<style>
  * { margin:0; padding:0; box-sizing:border-box; user-select:none; -webkit-tap-highlight-color:transparent; font-family:'MiSans', 'Segoe UI', system-ui, sans-serif; }
  body {
    background: #f5f7f5;
    background: linear-gradient(145deg, #f0f4f0 0%, #e8eee8 50%, #f5f7f5 100%);
    display:flex;
    justify-content:center;
    align-items:center;
    min-height:100vh;
    padding:10px;
    padding-top:70px;
    padding-bottom:70px;
    position:relative;
  }

  /* ===== 加载动画（统一风格） ===== */
  #loader {
    position:fixed;
    top:0; left:0; right:0; bottom:0;
    background: #f5f7f5;
    display:flex;
    flex-direction:column;
    justify-content:center;
    align-items:center;
    z-index:9999;
    transition:opacity 0.6s ease-out;
  }
  #loader.hide { opacity:0; pointer-events:none; }
  #loader .logo { font-size:5.5rem; animation: loaderPulse 1.2s ease-in-out infinite; margin-bottom:14px; }
  #loader .loader-text { color:rgba(0,0,0,0.3); font-size:1.6rem; letter-spacing:4px; font-weight:400; margin-bottom:20px; }
  #loader .loader-text span { color:#40C463; font-weight:600; }
  #loader .loading-status { color:rgba(0,0,0,0.15); font-size:1rem; letter-spacing:2px; margin-bottom:16px; animation: loadingDot 1.6s ease-in-out infinite; }
  @keyframes loadingDot { 0%,100% { opacity:0.3; } 50% { opacity:1; } }
  #loader .loader-bar { width:200px; height:4px; background:rgba(0,0,0,0.06); border-radius:4px; overflow:hidden; position:relative; }
  #loader .loader-bar .fill { position:absolute; left:0; top:0; height:100%; width:0%; background:linear-gradient(90deg, #216E39, #40C463, #9BE9A8); border-radius:4px; animation: loaderFill 2.5s ease-in-out forwards; }
  @keyframes loaderPulse { 0%,100% { transform:scale(1); } 50% { transform:scale(1.08); } }
  @keyframes loaderFill { 0% { width:0%; } 30% { width:40%; } 60% { width:75%; } 100% { width:100%; } }

  /* ===== 页眉（毛玻璃） ===== */
  .header {
    position:fixed;
    top:0;
    left:0;
    right:0;
    z-index:10;
    padding:0 20px;
    height:56px;
    display:flex;
    align-items:center;
    justify-content:space-between;
    background:rgba(255,255,255,0.85);
    backdrop-filter:blur(16px);
    -webkit-backdrop-filter:blur(16px);
    border-bottom:1px solid rgba(0,0,0,0.04);
  }
  .header .brand {
    display:flex;
    align-items:center;
    gap:8px;
    text-decoration:none;
    color:#1a1a1a;
    font-weight:700;
    font-size:1.0rem;
  }
  .header .brand .logo-icon { font-size:1.4rem; }
  .header .brand .brand-text {
    background:linear-gradient(135deg, #216E39, #40C463);
    -webkit-background-clip:text;
    -webkit-text-fill-color:transparent;
    background-clip:text;
  }
  .header .nav-link {
    color:rgba(0,0,0,0.45);
    text-decoration:none;
    font-size:0.8rem;
    padding:4px 14px;
    border-radius:20px;
    transition:all 0.3s;
    border:1px solid rgba(0,0,0,0.04);
  }
  .header .nav-link:hover {
    background:rgba(0,0,0,0.04);
    color:#1a1a1a;
    border-color:rgba(0,0,0,0.1);
  }
  .header .nav-link.primary {
    background:linear-gradient(135deg, #40C463, #30A14E);
    border:none;
    color:#fff;
  }
  .header .nav-link.primary:hover { opacity:0.85; }
  .header .title {
    color:#1a1a1a;
    font-size:0.95rem;
    font-weight:500;
    letter-spacing:0.5px;
  }
  .header .title span { color:rgba(0,0,0,0.2); }

  /* ===== 页脚（毛玻璃） ===== */
  .footer {
    position:fixed;
    bottom:0;
    left:0;
    right:0;
    z-index:10;
    padding:10px 20px;
    display:flex;
    align-items:center;
    justify-content:center;
    background:rgba(255,255,255,0.70);
    backdrop-filter:blur(12px);
    -webkit-backdrop-filter:blur(12px);
    border-top:1px solid rgba(0,0,0,0.04);
  }
  .footer .text {
    color:rgba(0,0,0,0.25);
    font-size:0.75rem;
    letter-spacing:0.5px;
  }
  .footer .text .love { color:rgba(239,68,68,0.15); }
  .footer .text .highlight { color:#216E39; }

  /* ===== 工具容器（毛玻璃卡片） ===== */
  .tool-wrapper {
    background:rgba(255,255,255,0.85);
    backdrop-filter:blur(8px);
    -webkit-backdrop-filter:blur(8px);
    border-radius:20px;
    padding:16px;
    box-shadow:0 4px 40px rgba(0,0,0,0.04);
    border:1px solid rgba(0,0,0,0.04);
    max-width:420px;
    width:100%;
  }
  .tool-header {
    display:flex;
    justify-content:space-between;
    align-items:center;
    padding:0 6px 12px 6px;
    color:#1a1a1a;
    font-weight:700;
    font-size:1.0rem;
  }
  .tool-header .title-tag {
    color:rgba(0,0,0,0.3);
    font-size:0.9rem;
    font-weight:400;
  }

  /* ===== 内部工具容器（浅色毛玻璃） ===== */
  .tool-container {
    position:relative;
    width:100%;
    border-radius:16px;
    overflow:hidden;
    background:rgba(255,255,255,0.6);
    backdrop-filter:blur(6px);
    -webkit-backdrop-filter:blur(6px);
    border:1px solid rgba(0,0,0,0.04);
    padding:16px;
    min-height:340px;
  }

  /* ===== 密码显示区 ===== */
  .password-display {
    background:rgba(255,255,255,0.6);
    border:1px solid rgba(0,0,0,0.04);
    border-radius:14px;
    padding:14px 18px;
    margin:8px 0 12px 0;
    display:flex;
    justify-content:space-between;
    align-items:center;
    transition:border-color 0.3s;
  }
  .password-display:focus-within { border-color:#40C463; }
  .password-display .pass {
    color:#1a1a1a;
    font-size:1.15rem;
    font-family:'MiSans', 'Consolas', 'Courier New', monospace;
    letter-spacing:0.5px;
    word-break:break-all;
    flex:1;
    font-weight:500;
  }
  .password-display .copy-btn {
    padding:6px 16px;
    border:1px solid rgba(0,0,0,0.06);
    border-radius:20px;
    background:rgba(255,255,255,0.5);
    color:rgba(0,0,0,0.35);
    cursor:pointer;
    font-size:0.8rem;
    transition:all 0.2s;
    flex-shrink:0;
    margin-left:10px;
    font-weight:500;
  }
  .password-display .copy-btn:active { transform:scale(0.94); background:rgba(0,0,0,0.04); }
  .password-display .copy-btn:hover { background:rgba(0,0,0,0.04); }

  /* ===== 选项 ===== */
  .options {
    display:flex;
    flex-direction:column;
    gap:10px;
    padding:6px 0;
  }
  .options .row {
    display:flex;
    align-items:center;
    gap:12px;
  }
  .options label {
    color:rgba(0,0,0,0.4);
    font-size:0.85rem;
    width:110px;
    font-weight:400;
  }
  .options input[type="range"] {
    flex:1;
    -webkit-appearance:none;
    appearance:none;
    height:4px;
    background:rgba(0,0,0,0.08);
    border-radius:4px;
    outline:none;
    accent-color:#40C463;
  }
  .options input[type="range"]::-webkit-slider-thumb {
    -webkit-appearance:none;
    appearance:none;
    width:16px;
    height:16px;
    border-radius:50%;
    background:linear-gradient(135deg, #40C463, #30A14E);
    cursor:pointer;
    box-shadow:0 2px 8px rgba(64,196,99,0.3);
  }
  .options input[type="range"]::-moz-range-thumb {
    width:16px;
    height:16px;
    border-radius:50%;
    border:none;
    background:linear-gradient(135deg, #40C463, #30A14E);
    cursor:pointer;
  }
  .options input[type="checkbox"] {
    accent-color:#40C463;
    width:18px;
    height:18px;
    cursor:pointer;
  }
  .options .len-value {
    color:rgba(0,0,0,0.3);
    font-size:0.9rem;
    width:32px;
    text-align:center;
    font-weight:500;
    font-family:'MiSans', 'Consolas', monospace;
  }

  /* ===== 强度 ===== */
  .strength {
    text-align:center;
    font-size:0.85rem;
    padding:8px 0 2px 0;
    color:rgba(0,0,0,0.3);
    font-weight:500;
  }
  .strength .strong { color:#216E39; }
  .strength .medium { color:#f59e0b; }
  .strength .weak { color:#e74c3c; }

  /* ===== 生成按钮 ===== */
  .controls {
    text-align:center;
    padding:6px 0 2px 0;
  }
  .controls button {
    padding:12px 40px;
    border:none;
    border-radius:40px;
    background:linear-gradient(135deg, #40C463, #30A14E);
    color:#fff;
    font-size:1rem;
    font-weight:600;
    cursor:pointer;
    transition:transform 0.2s, opacity 0.2s;
    font-family:'MiSans', 'Segoe UI', sans-serif;
    box-shadow:0 4px 20px rgba(64,196,99,0.25);
  }
  .controls button:active { transform:scale(0.94); }
  .controls button:hover { opacity:0.9; }

  /* ===== 说明 ===== */
  .how-to-play {
    background:rgba(0,0,0,0.04);
    border-radius:12px;
    padding:10px 14px;
    margin-top:12px;
    color:rgba(0,0,0,0.4);
    font-size:0.85rem;
    line-height:1.6;
    text-align:center;
    border:1px solid rgba(0,0,0,0.04);
  }
  .how-to-play strong { color:rgba(0,0,0,0.6); }

  /* ===== 移动端适配 ===== */
  @media (max-width: 640px) {
    body { padding-top:60px; padding-bottom:60px; }
    .tool-wrapper { padding:12px; }
    .tool-header { font-size:0.85rem; }
    .tool-container { padding:12px; min-height:300px; }
    .password-display { padding:12px 14px; }
    .password-display .pass { font-size:1rem; }
    .password-display .copy-btn { font-size:0.7rem; padding:4px 12px; }
    .options .row { gap:8px; }
    .options label { font-size:0.75rem; width:80px; }
    .options input[type="range"] { flex:1; }
    .controls button { font-size:0.9rem; padding:10px 30px; }
    .how-to-play { font-size:0.75rem; padding:8px 10px; }
    .strength { font-size:0.75rem; }
  }
  @media (max-width: 380px) {
    .options label { width:70px; font-size:0.7rem; }
    .password-display .pass { font-size:0.85rem; }
    .password-display .copy-btn { font-size:0.65rem; padding:3px 10px; }
  }
</style>
</head>
<body>

<!-- ===== 加载动画 ===== -->
<div id="loader">
  <div class="logo">📋</div>
  <div class="loader-text">槐序<span>Lab</span>-槐序实验室</div>
  <div class="loading-status">加载中...</div>
  <div class="loader-bar"><div class="fill"></div></div>
</div>

<!-- ===== 页眉 ===== -->
<header class="header">
  <a href="https://lab.lruriawa.top/" class="brand">
    <span class="logo-icon">🧪</span>
    <span class="brand-text">槐序Lab实验室</span>
  </a>
  <span class="title">📋 密码生成器</span>
  <a href="https://lab.lruriawa.top/release/home.html" class="nav-link primary">🏠 首页</a>
</header>

<!-- ===== 工具主体 ===== -->
<div class="tool-wrapper">
  <div class="tool-header">
    <span style="opacity:0.5;">📋</span>
    <span class="title-tag">密码生成器</span>
  </div>

  <div class="tool-container">
    <div class="password-display">
      <span class="pass" id="password">P@ssw0rd123!</span>
      <button class="copy-btn" id="copyBtn">📋 复制</button>
    </div>

    <div class="options">
      <div class="row">
        <label>🔢 长度</label>
        <input type="range" id="length" min="6" max="30" value="12">
        <span class="len-value" id="lenVal">12</span>
      </div>
      <div class="row">
        <label>🔤 包含大写</label>
        <input type="checkbox" id="uppercase" checked>
      </div>
      <div class="row">
        <label>🔡 包含小写</label>
        <input type="checkbox" id="lowercase" checked>
      </div>
      <div class="row">
        <label>🔢 包含数字</label>
        <input type="checkbox" id="numbers" checked>
      </div>
      <div class="row">
        <label>🔣 包含符号</label>
        <input type="checkbox" id="symbols" checked>
      </div>
    </div>

    <div class="strength" id="strength">💪 强度：<span class="strong">强</span></div>

    <div class="controls">
      <button id="genBtn">🔄 生成密码</button>
    </div>
  </div>

  <div class="how-to-play">
    <strong>💡 使用：</strong> 调整选项 · 点击生成 · 点击复制使用
  </div>
</div>

<!-- ===== 页脚 ===== -->
<footer class="footer">
  <span class="text">
    🧪 槐序Lab实验室 · 密码生成器 &nbsp;|&nbsp; <span class="highlight">❤️ Design by DeepSeek</span>
    &nbsp;&nbsp;<span class="love">❤️</span>
  </span>
</footer>

<script>
// ===== 加载动画隐藏（2.5秒，与统一风格一致） =====
document.addEventListener('DOMContentLoaded', function() {
    setTimeout(function() { document.getElementById('loader').classList.add('hide'); }, 2500);
});
if (document.readyState !== 'loading') {
    setTimeout(function() { document.getElementById('loader').classList.add('hide'); }, 2500);
}

// ===== 以下为密码生成核心逻辑，完整保留 =====
const passEl = document.getElementById('password');
const copyBtn = document.getElementById('copyBtn');
const genBtn = document.getElementById('genBtn');
const lengthSlider = document.getElementById('length');
const lenVal = document.getElementById('lenVal');
const strengthEl = document.getElementById('strength');
const uppercase = document.getElementById('uppercase');
const lowercase = document.getElementById('lowercase');
const numbers = document.getElementById('numbers');
const symbols = document.getElementById('symbols');

const UPPER = 'ABCDEFGHIJKLMNOPQRSTUVWXYZ';
const LOWER = 'abcdefghijklmnopqrstuvwxyz';
const NUMBERS = '0123456789';
const SYMBOLS = '!@#$%^&*()_+-=<>?';

function generate() {
  let chars = '';
  if (uppercase.checked) chars += UPPER;
  if (lowercase.checked) chars += LOWER;
  if (numbers.checked) chars += NUMBERS;
  if (symbols.checked) chars += SYMBOLS;
  if (!chars) { passEl.textContent = '请至少选择一种字符'; return; }
  const len = parseInt(lengthSlider.value);
  let password = '';
  for (let i = 0; i < len; i++) {
    password += chars[Math.floor(Math.random() * chars.length)];
  }
  passEl.textContent = password;

  let score = 0;
  if (len >= 12) score++;
  if (len >= 16) score++;
  if (uppercase.checked && lowercase.checked) score++;
  if (numbers.checked) score++;
  if (symbols.checked) score++;
  const strengths = ['弱', '弱', '中', '中', '强', '很强'];
  const cls = score <= 2 ? 'weak' : score <= 3 ? 'medium' : 'strong';
  strengthEl.innerHTML = '💪 强度：<span class="' + cls + '">' + strengths[Math.min(score, 5)] + '</span>';
}

lengthSlider.addEventListener('input', function() {
  lenVal.textContent = this.value;
  generate();
});
[uppercase, lowercase, numbers, symbols].forEach(el => el.addEventListener('change', generate));
genBtn.addEventListener('click', generate);
copyBtn.addEventListener('click', function() {
  const text = passEl.textContent;
  if (!text || text === '请至少选择一种字符') return;
  navigator.clipboard.writeText(text).then(() => {
    this.textContent = '✅ 已复制';
    setTimeout(() => this.textContent = '📋 复制', 1500);
  });
});

generate();
</script>
</body>
</html>
