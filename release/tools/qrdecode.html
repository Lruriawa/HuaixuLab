<!DOCTYPE html>
<html lang="zh">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>📦 二维码解码器-槐序Lab-槐序实验室</title>
    <link rel="icon" type="image/png" href="../tx.png">
    <link href="https://cdn.jsdelivr.net/gh/webfontworld/misans/MiSans.css" rel="stylesheet">
    <script src="https://cdn.jsdelivr.net/npm/jsqr@1.4.0/dist/jsQR.js">
    </script>
    <style>
        * { margin:0; padding:0; box-sizing:border-box; touch-action:none; user-select:none; -webkit-tap-highlight-color:transparent; font-family:'MiSans', 'Segoe UI', system-ui, sans-serif; }
        body {
            background: #f5f7f5;
            background: linear-gradient(145deg, #f0f4f0 0%, #e8eee8 50%, #f5f7f5 100%);
            display:flex;
            justify-content:center;
            align-items:center;
            min-height:100vh;
            padding:10px;
            padding-top:70px;
            padding-bottom:70px;
            position:relative;
        }

        /* ===== 加载动画（统一风格） ===== */
        #loader {
            position:fixed;
            top:0; left:0; right:0; bottom:0;
            background: #f5f7f5;
            display:flex;
            flex-direction:column;
            justify-content:center;
            align-items:center;
            z-index:9999;
            transition:opacity 0.6s ease-out;
        }
        #loader.hide { opacity:0; pointer-events:none; }
        #loader .logo { font-size:5.5rem; animation: loaderPulse 1.2s ease-in-out infinite; margin-bottom:14px; }
        #loader .loader-text { color:rgba(0,0,0,0.3); font-size:1.6rem; letter-spacing:4px; font-weight:400; margin-bottom:20px; }
        #loader .loader-text span { color:#40C463; font-weight:600; }
        #loader .loading-status { color:rgba(0,0,0,0.15); font-size:1rem; letter-spacing:2px; margin-bottom:16px; animation: loadingDot 1.6s ease-in-out infinite; }
        @keyframes loadingDot { 0%,100% { opacity:0.3; } 50% { opacity:1; } }
        #loader .loader-bar { width:200px; height:4px; background:rgba(0,0,0,0.06); border-radius:4px; overflow:hidden; position:relative; }
        #loader .loader-bar .fill { position:absolute; left:0; top:0; height:100%; width:0%; background:linear-gradient(90deg, #216E39, #40C463, #9BE9A8); border-radius:4px; animation: loaderFill 2.5s ease-in-out forwards; }
        @keyframes loaderPulse { 0%,100% { transform:scale(1); } 50% { transform:scale(1.08); } }
        @keyframes loaderFill { 0% { width:0%; } 30% { width:40%; } 60% { width:75%; } 100% { width:100%; } }

        /* ===== 页眉（毛玻璃） ===== */
        .header {
            position:fixed;
            top:0;
            left:0;
            right:0;
            z-index:10;
            padding:0 20px;
            height:56px;
            display:flex;
            align-items:center;
            justify-content:space-between;
            background:rgba(255,255,255,0.85);
            backdrop-filter:blur(16px);
            -webkit-backdrop-filter:blur(16px);
            border-bottom:1px solid rgba(0,0,0,0.04);
        }
        .header .brand {
            display:flex;
            align-items:center;
            gap:8px;
            text-decoration:none;
            color:#1a1a1a;
            font-weight:700;
            font-size:1.0rem;
        }
        .header .brand .logo-icon { font-size:1.4rem; }
        .header .brand .brand-text {
            background:linear-gradient(135deg, #216E39, #40C463);
            -webkit-background-clip:text;
            -webkit-text-fill-color:transparent;
            background-clip:text;
        }
        .header .nav-link {
            color:rgba(0,0,0,0.45);
            text-decoration:none;
            font-size:0.8rem;
            padding:4px 14px;
            border-radius:20px;
            transition:all 0.3s;
            border:1px solid rgba(0,0,0,0.04);
        }
        .header .nav-link:hover {
            background:rgba(0,0,0,0.04);
            color:#1a1a1a;
            border-color:rgba(0,0,0,0.1);
        }
        .header .nav-link.primary {
            background:linear-gradient(135deg, #40C463, #30A14E);
            border:none;
            color:#fff;
        }
        .header .nav-link.primary:hover { opacity:0.85; }
        .header .title {
            color:#1a1a1a;
            font-size:0.95rem;
            font-weight:500;
            letter-spacing:0.5px;
        }
        .header .title span { color:rgba(0,0,0,0.2); }

        /* ===== 页脚（毛玻璃） ===== */
        .footer {
            position:fixed;
            bottom:0;
            left:0;
            right:0;
            z-index:10;
            padding:10px 20px;
            display:flex;
            align-items:center;
            justify-content:center;
            background:rgba(255,255,255,0.70);
            backdrop-filter:blur(12px);
            -webkit-backdrop-filter:blur(12px);
            border-top:1px solid rgba(0,0,0,0.04);
        }
        .footer .text {
            color:rgba(0,0,0,0.25);
            font-size:0.75rem;
            letter-spacing:0.5px;
        }
        .footer .text .love { color:rgba(239,68,68,0.15); }
        .footer .text .highlight { color:#216E39; }

        /* ===== 工具容器（毛玻璃卡片） ===== */
        .game-wrapper {
            background:rgba(255,255,255,0.85);
            backdrop-filter:blur(8px);
            -webkit-backdrop-filter:blur(8px);
            border-radius:20px;
            padding:16px;
            box-shadow:0 4px 40px rgba(0,0,0,0.04);
            border:1px solid rgba(0,0,0,0.04);
            max-width:420px;
            width:100%;
        }
        .tool-header {
            display:flex;
            justify-content:space-between;
            align-items:center;
            padding:0 6px 12px 6px;
            color:#1a1a1a;
            font-weight:700;
            font-size:1.0rem;
        }
        .tool-header .title-tag {
            color:rgba(0,0,0,0.3);
            font-size:0.9rem;
            font-weight:400;
        }

        /* ===== 内部工具容器（浅色毛玻璃） ===== */
        .tool-container {
            position:relative;
            width:100%;
            border-radius:16px;
            overflow:hidden;
            background:rgba(255,255,255,0.6);
            backdrop-filter:blur(6px);
            -webkit-backdrop-filter:blur(6px);
            border:1px solid rgba(0,0,0,0.04);
            padding:16px;
            text-align:center;
        }

        /* ===== 上传区域 ===== */
        .upload-area {
            border:2px dashed rgba(0,0,0,0.08);
            border-radius:12px;
            padding:30px 20px;
            cursor:pointer;
            transition:all 0.3s;
            position:relative;
            background:rgba(255,255,255,0.3);
        }
        .upload-area:hover {
            border-color:rgba(33,110,57,0.3);
            background:rgba(255,255,255,0.5);
        }
        .upload-area .icon {
            font-size:3rem;
            display:block;
            margin-bottom:8px;
        }
        .upload-area .text {
            color:rgba(0,0,0,0.3);
            font-size:0.9rem;
            font-weight:500;
        }
        .upload-area .sub {
            color:rgba(0,0,0,0.15);
            font-size:0.7rem;
            margin-top:4px;
        }
        .upload-area input[type="file"] {
            position:absolute;
            inset:0;
            opacity:0;
            cursor:pointer;
        }

        /* ===== 预览区域 ===== */
        .preview-area {
            margin-top:12px;
            display:none;
        }
        .preview-area img {
            max-width:180px;
            max-height:180px;
            border-radius:10px;
            border:1px solid rgba(0,0,0,0.06);
            margin:0 auto;
            display:block;
            background:#fff;
        }

        /* ===== 结果区域 ===== */
        .result-area {
            margin-top:12px;
            padding:12px 14px;
            background:rgba(255,255,255,0.5);
            border:1px solid rgba(0,0,0,0.04);
            border-radius:10px;
            display:none;
            text-align:left;
        }
        .result-area .label {
            color:rgba(0,0,0,0.2);
            font-size:0.6rem;
            text-transform:uppercase;
            letter-spacing:1px;
            font-weight:600;
        }
        .result-area .content {
            color:#216E39;
            font-family:'MiSans', 'Consolas', 'Courier New', monospace;
            font-size:0.85rem;
            word-break:break-all;
            margin-top:4px;
            line-height:1.7;
            font-weight:500;
        }
        .result-area .content.error {
            color:#e74c3c;
        }

        /* ===== 按钮组 ===== */
        .btn-group {
            display:flex;
            gap:8px;
            margin-top:12px;
        }
        .btn-group button {
            padding:8px 16px;
            border:none;
            border-radius:10px;
            font-size:0.8rem;
            font-weight:600;
            cursor:pointer;
            transition:transform 0.15s, opacity 0.2s;
            color:#fff;
            flex:1;
            font-family:'MiSans', 'Segoe UI', sans-serif;
        }
        .btn-group button:active { transform:scale(0.94); }
        .btn-group button:hover { opacity:0.9; }
        .btn-group .btn-copy {
            background:rgba(33,110,57,0.08);
            border:1px solid rgba(33,110,57,0.1);
            color:#216E39;
        }
        .btn-group .btn-copy:hover { background:rgba(33,110,57,0.12); }
        .btn-group .btn-clear {
            background:rgba(0,0,0,0.04);
            border:1px solid rgba(0,0,0,0.06);
            color:rgba(0,0,0,0.4);
        }
        .btn-group .btn-clear:hover { background:rgba(0,0,0,0.06); }

        /* ===== 说明 ===== */
        .how-to-play {
            background:rgba(0,0,0,0.04);
            border-radius:12px;
            padding:10px 14px;
            margin-top:10px;
            color:rgba(0,0,0,0.4);
            font-size:0.75rem;
            line-height:1.6;
            text-align:center;
            border:1px solid rgba(0,0,0,0.04);
        }
        .how-to-play strong { color:rgba(0,0,0,0.6); }

        /* ===== Toast ===== */
        .toast {
            position:fixed;
            bottom:80px;
            left:50%;
            transform:translateX(-50%) translateY(80px);
            background:rgba(0,0,0,0.8);
            backdrop-filter:blur(8px);
            color:#fff;
            padding:10px 24px;
            border-radius:30px;
            font-size:0.85rem;
            border:1px solid rgba(255,255,255,0.06);
            opacity:0;
            transition:all 0.4s ease;
            pointer-events:none;
            z-index:100;
            white-space:nowrap;
            font-family:'MiSans', 'Segoe UI', sans-serif;
        }
        .toast.show {
            opacity:1;
            transform:translateX(-50%) translateY(0);
        }

        /* ===== 移动端适配 ===== */
        @media (max-width: 640px) {
            body { padding-top:60px; padding-bottom:60px; }
            .game-wrapper { padding:12px; }
            .tool-header { font-size:0.85rem; }
            .tool-container { padding:12px; }
            .upload-area { padding:22px 16px; }
            .upload-area .icon { font-size:2.4rem; }
            .upload-area .text { font-size:0.8rem; }
            .upload-area .sub { font-size:0.6rem; }
            .preview-area img { max-width:140px; max-height:140px; }
            .result-area .content { font-size:0.75rem; }
            .btn-group button { font-size:0.7rem; padding:6px 12px; }
            .how-to-play { font-size:0.7rem; padding:8px 10px; }
            .toast { font-size:0.75rem; padding:8px 18px; bottom:70px; }
        }
        @media (max-width: 380px) {
            .upload-area { padding:18px 12px; }
            .upload-area .icon { font-size:2rem; }
            .preview-area img { max-width:110px; max-height:110px; }
            .result-area { padding:10px 12px; }
            .btn-group { gap:4px; }
            .btn-group button { font-size:0.6rem; padding:4px 8px; }
        }
    </style>
</head>
<body>

    <!-- ===== 加载动画 ===== -->
    <div id="loader">
        <div class="logo">📦</div>
        <div class="loader-text">槐序<span>Lab</span>-槐序实验室</div>
        <div class="loading-status">加载中...</div>
        <div class="loader-bar"><div class="fill"></div></div>
    </div>

    <!-- ===== 页眉 ===== -->
    <header class="header">
        <a href="https://lab.lruriawa.top/" class="brand">
            <span class="logo-icon">🧪</span>
            <span class="brand-text">槐序Lab实验室</span>
        </a>
        <span class="title">📦 二维码解码</span>
        <a href="https://lab.lruriawa.top/release/home.html" class="nav-link primary">🏠 首页</a>
    </header>

    <!-- ===== 工具主体 ===== -->
    <div class="game-wrapper">
        <div class="tool-header">
            <span style="opacity:0.5;">📦</span>
            <span class="title-tag">二维码解码器</span>
        </div>

        <div class="tool-container">
            <div class="upload-area" id="uploadArea">
                <span class="icon">📷</span>
                <div class="text">点击上传二维码图片</div>
                <div class="sub">支持 PNG / JPG / WebP</div>
                <input type="file" id="fileInput" accept="image/*">
            </div>

            <div class="preview-area" id="previewArea">
                <img id="previewImg" src="" alt="预览">
            </div>

            <div class="result-area" id="resultArea">
                <div class="label">📄 解码结果</div>
                <div class="content" id="resultContent">等待解码...</div>
            </div>

            <div class="btn-group">
                <button class="btn-copy" id="copyBtn">📋 复制</button>
                <button class="btn-clear" id="clearBtn">✕ 清空</button>
            </div>
        </div>

        <div class="how-to-play">
            <strong>📦 二维码解码器：</strong>
            上传二维码图片，自动解码出文本或链接内容
        </div>
    </div>

    <!-- ===== 页脚 ===== -->
    <footer class="footer">
        <span class="text">
            🧪 槐序Lab实验室 · 二维码解码器 &nbsp;|&nbsp; <span class="highlight">❤️ Design by DeepSeek</span>
            &nbsp;&nbsp;<span class="love">❤️</span>
        </span>
    </footer>

    <!-- ===== Toast ===== -->
    <div class="toast" id="toast"></div>

    <script>
        // ===== 加载动画隐藏（2.5秒，与统一风格一致） =====
        document.addEventListener('DOMContentLoaded', function() {
            setTimeout(function() {
                document.getElementById('loader').classList.add('hide');
            }, 2500);
        });
        if (document.readyState !== 'loading') {
            setTimeout(function() {
                document.getElementById('loader').classList.add('hide');
            }, 2500);
        }

        // ===== 以下为二维码解码核心逻辑，完整保留 =====
        const fileInput = document.getElementById('fileInput');
        const previewArea = document.getElementById('previewArea');
        const previewImg = document.getElementById('previewImg');
        const resultArea = document.getElementById('resultArea');
        const resultContent = document.getElementById('resultContent');
        const copyBtn = document.getElementById('copyBtn');
        const clearBtn = document.getElementById('clearBtn');
        const toast = document.getElementById('toast');

        let lastResult = '';

        function showToast(msg) {
            toast.textContent = msg;
            toast.classList.add('show');
            clearTimeout(window.toastTimer);
            window.toastTimer = setTimeout(() => toast.classList.remove('show'), 2000);
        }

        function decodeQR(imageData) {
            const code = jsQR(imageData.data, imageData.width, imageData.height, {
                inversionAttempts: "dontInvert",
            });
            if (code && code.data) {
                resultContent.textContent = code.data;
                resultContent.className = 'content';
                resultArea.style.display = 'block';
                lastResult = code.data;
                showToast('✅ 解码成功！');
            } else {
                resultContent.textContent = '❌ 未能识别二维码，请尝试其他图片';
                resultContent.className = 'content error';
                resultArea.style.display = 'block';
                lastResult = '';
            }
        }

        function handleFile(file) {
            if (!file) return;
            const reader = new FileReader();
            reader.onload = function(e) {
                const img = new Image();
                img.onload = function() {
                    previewImg.src = e.target.result;
                    previewArea.style.display = 'block';

                    const canvas = document.createElement('canvas');
                    const ctx = canvas.getContext('2d');
                    canvas.width = img.width;
                    canvas.height = img.height;
                    ctx.drawImage(img, 0, 0, img.width, img.height);
                    const imageData = ctx.getImageData(0, 0, img.width, img.height);
                    decodeQR(imageData);
                };
                img.src = e.target.result;
            };
            reader.readAsDataURL(file);
        }

        fileInput.addEventListener('change', function(e) {
            if (this.files.length > 0) {
                handleFile(this.files[0]);
            }
        });

        const uploadArea = document.getElementById('uploadArea');
        uploadArea.addEventListener('dragover', function(e) {
            e.preventDefault();
            this.style.borderColor = 'rgba(33,110,57,0.4)';
        });
        uploadArea.addEventListener('dragleave', function(e) {
            e.preventDefault();
            this.style.borderColor = 'rgba(0,0,0,0.08)';
        });
        uploadArea.addEventListener('drop', function(e) {
            e.preventDefault();
            this.style.borderColor = 'rgba(0,0,0,0.08)';
            if (e.dataTransfer.files.length > 0) {
                handleFile(e.dataTransfer.files[0]);
            }
        });

        copyBtn.addEventListener('click', function() {
            if (!lastResult) {
                showToast('⚠️ 没有可复制的内容');
                return;
            }
            navigator.clipboard.writeText(lastResult).then(() => {
                showToast('✅ 已复制到剪贴板');
            }).catch(() => {
                const textarea = document.createElement('textarea');
                textarea.value = lastResult;
                document.body.appendChild(textarea);
                textarea.select();
                document.execCommand('copy');
                document.body.removeChild(textarea);
                showToast('✅ 已复制');
            });
        });

        clearBtn.addEventListener('click', function() {
            fileInput.value = '';
            previewArea.style.display = 'none';
            previewImg.src = '';
            resultArea.style.display = 'none';
            resultContent.textContent = '';
            lastResult = '';
            showToast('✕ 已清空');
        });
    </script>
</body>
</html>
