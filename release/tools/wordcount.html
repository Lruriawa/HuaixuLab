<!DOCTYPE html>
<html lang="zh">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>📄 文本统计器-槐序Lab-槐序实验室</title>
    <link rel="icon" type="image/png" href="../tx.png">
    <link href="https://cdn.jsdelivr.net/gh/webfontworld/misans/MiSans.css" rel="stylesheet">
    <style>
        * { margin:0; padding:0; box-sizing:border-box; font-family:'MiSans', 'Segoe UI', system-ui, sans-serif; }
        body {
            background: #f5f7f5;
            background: linear-gradient(145deg, #f0f4f0 0%, #e8eee8 50%, #f5f7f5 100%);
            display:flex;
            justify-content:center;
            align-items:center;
            min-height:100vh;
            padding:10px;
            padding-top:70px;
            padding-bottom:70px;
            position:relative;
        }

        /* ===== 加载动画 ===== */
        #loader {
            position:fixed;
            top:0; left:0; right:0; bottom:0;
            background: #f5f7f5;
            display:flex;
            flex-direction:column;
            justify-content:center;
            align-items:center;
            z-index:9999;
            transition:opacity 0.6s ease-out;
        }
        #loader.hide { opacity:0; pointer-events:none; }
        #loader .logo { font-size:5.5rem; animation: loaderPulse 1.2s ease-in-out infinite; margin-bottom:14px; }
        #loader .loader-text { color:rgba(0,0,0,0.3); font-size:1.6rem; letter-spacing:4px; font-weight:400; margin-bottom:20px; }
        #loader .loader-text span { color:#40C463; font-weight:600; }
        #loader .loading-status { color:rgba(0,0,0,0.15); font-size:1rem; letter-spacing:2px; margin-bottom:16px; animation: loadingDot 1.6s ease-in-out infinite; }
        @keyframes loadingDot { 0%,100% { opacity:0.3; } 50% { opacity:1; } }
        #loader .loader-bar { width:200px; height:4px; background:rgba(0,0,0,0.06); border-radius:4px; overflow:hidden; position:relative; }
        #loader .loader-bar .fill { position:absolute; left:0; top:0; height:100%; width:0%; background:linear-gradient(90deg, #216E39, #40C463, #9BE9A8); border-radius:4px; animation: loaderFill 2.5s ease-in-out forwards; }
        @keyframes loaderPulse { 0%,100% { transform:scale(1); } 50% { transform:scale(1.08); } }
        @keyframes loaderFill { 0% { width:0%; } 30% { width:40%; } 60% { width:75%; } 100% { width:100%; } }

        /* ===== 页眉 ===== */
        .header {
            position:fixed;
            top:0;
            left:0;
            right:0;
            z-index:10;
            padding:0 20px;
            height:56px;
            display:flex;
            align-items:center;
            justify-content:space-between;
            background:rgba(255,255,255,0.85);
            backdrop-filter:blur(16px);
            -webkit-backdrop-filter:blur(16px);
            border-bottom:1px solid rgba(0,0,0,0.04);
        }
        .header .brand {
            display:flex;
            align-items:center;
            gap:8px;
            text-decoration:none;
            color:#1a1a1a;
            font-weight:700;
            font-size:1.0rem;
        }
        .header .brand .logo-icon { font-size:1.4rem; }
        .header .brand .brand-text {
            background:linear-gradient(135deg, #216E39, #40C463);
            -webkit-background-clip:text;
            -webkit-text-fill-color:transparent;
            background-clip:text;
        }
        .header .nav-link {
            color:rgba(0,0,0,0.45);
            text-decoration:none;
            font-size:0.8rem;
            padding:4px 14px;
            border-radius:20px;
            transition:all 0.3s;
            border:1px solid rgba(0,0,0,0.04);
        }
        .header .nav-link:hover {
            background:rgba(0,0,0,0.04);
            color:#1a1a1a;
            border-color:rgba(0,0,0,0.1);
        }
        .header .nav-link.primary {
            background:linear-gradient(135deg, #40C463, #30A14E);
            border:none;
            color:#fff;
        }
        .header .nav-link.primary:hover { opacity:0.85; }
        .header .title {
            color:#1a1a1a;
            font-size:0.95rem;
            font-weight:500;
            letter-spacing:0.5px;
        }

        /* ===== 页脚 ===== */
        .footer {
            position:fixed;
            bottom:0;
            left:0;
            right:0;
            z-index:10;
            padding:10px 20px;
            display:flex;
            align-items:center;
            justify-content:center;
            background:rgba(255,255,255,0.70);
            backdrop-filter:blur(12px);
            -webkit-backdrop-filter:blur(12px);
            border-top:1px solid rgba(0,0,0,0.04);
        }
        .footer .text {
            color:rgba(0,0,0,0.25);
            font-size:0.75rem;
            letter-spacing:0.5px;
        }
        .footer .text .love { color:rgba(239,68,68,0.15); }
        .footer .text .highlight { color:#216E39; }

        /* ===== 工具容器 ===== */
        .game-wrapper {
            background:rgba(255,255,255,0.85);
            backdrop-filter:blur(8px);
            -webkit-backdrop-filter:blur(8px);
            border-radius:20px;
            padding:16px;
            box-shadow:0 4px 40px rgba(0,0,0,0.04);
            border:1px solid rgba(0,0,0,0.04);
            max-width:480px;
            width:100%;
        }
        .tool-header {
            display:flex;
            justify-content:space-between;
            align-items:center;
            padding:0 6px 12px 6px;
            color:#1a1a1a;
            font-weight:700;
            font-size:0.9rem;
        }
        .tool-header .title-tag {
            color:rgba(0,0,0,0.3);
            font-size:0.9rem;
            font-weight:400;
        }

        /* ===== 内部工具容器 ===== */
        .tool-container {
            position:relative;
            width:100%;
            border-radius:16px;
            overflow:hidden;
            background:#ffffff;
            box-shadow:inset 0 0 40px rgba(0,0,0,0.02);
            padding:16px;
            border:1px solid rgba(0,0,0,0.04);
        }

        .tool-container textarea {
            width:100%;
            min-height:160px;
            background:#f8faf8;
            border:1px solid rgba(0,0,0,0.06);
            border-radius:10px;
            padding:12px;
            color:#1a1a1a;
            font-size:0.9rem;
            font-family:'MiSans', 'Segoe UI', system-ui, sans-serif;
            resize:vertical;
            outline:none;
            transition:border-color 0.3s;
            line-height:1.7;
        }
        .tool-container textarea:focus {
            border-color:rgba(33,110,57,0.25);
            background:#fafffa;
        }
        .tool-container textarea::placeholder {
            color:rgba(0,0,0,0.15);
        }

        .stats-grid {
            display:grid;
            grid-template-columns:repeat(3, 1fr);
            gap:8px;
            margin-top:12px;
        }
        .stat-item {
            background:rgba(0,0,0,0.02);
            border:1px solid rgba(0,0,0,0.04);
            border-radius:10px;
            padding:10px 8px;
            text-align:center;
        }
        .stat-item .number {
            font-size:1.5rem;
            font-weight:700;
            color:#216E39;
            font-variant-numeric:tabular-nums;
        }
        .stat-item .label {
            color:rgba(0,0,0,0.25);
            font-size:0.6rem;
            text-transform:uppercase;
            letter-spacing:0.5px;
            margin-top:2px;
        }

        .btn-group {
            display:flex;
            gap:8px;
            margin-top:10px;
        }
        .btn-group button {
            padding:8px 16px;
            border:none;
            border-radius:10px;
            font-size:0.8rem;
            font-weight:600;
            cursor:pointer;
            transition:transform 0.15s, opacity 0.2s;
            flex:1;
            font-family:'MiSans', 'Segoe UI', sans-serif;
        }
        .btn-group button:active {
            transform:scale(0.94);
        }
        .btn-group button:hover { opacity:0.85; }
        .btn-group .btn-clear {
            background:rgba(0,0,0,0.04);
            border:1px solid rgba(0,0,0,0.04);
            color:rgba(0,0,0,0.35);
        }
        .btn-group .btn-clear:hover { background:rgba(0,0,0,0.06); }
        .btn-group .btn-example {
            background:linear-gradient(135deg, #7c3aed, #a29bfe);
            color:#fff;
            box-shadow:0 4px 20px rgba(108,92,231,0.2);
        }

        .how-to-play {
            background:rgba(0,0,0,0.04);
            border-radius:12px;
            padding:10px 14px;
            margin-top:10px;
            color:rgba(0,0,0,0.35);
            font-size:0.75rem;
            line-height:1.6;
            text-align:center;
            border:1px solid rgba(0,0,0,0.04);
        }
        .how-to-play strong {
            color:rgba(0,0,0,0.55);
        }

        @media (max-width: 640px) {
            body { padding-top:60px; padding-bottom:60px; }
            .game-wrapper { padding:12px; }
            .tool-container { padding:12px; }
            .tool-container textarea { min-height:130px; font-size:0.8rem; padding:10px; }
            .stats-grid { gap:6px; }
            .stat-item { padding:8px 4px; }
            .stat-item .number { font-size:1.2rem; }
            .stat-item .label { font-size:0.5rem; }
            .btn-group button { font-size:0.7rem; padding:6px 12px; }
            .how-to-play { font-size:0.7rem; padding:8px 10px; }
        }
        @media (max-width: 400px) {
            .stats-grid { grid-template-columns:repeat(2, 1fr); }
        }
    </style>
</head>
<body>

    <!-- ===== 加载动画 ===== -->
    <div id="loader">
        <div class="logo">📄</div>
        <div class="loader-text">槐序<span>Lab</span>-槐序实验室</div>
        <div class="loading-status">加载中...</div>
        <div class="loader-bar"><div class="fill"></div></div>
    </div>

    <script>
        setTimeout(function() {
            var loader = document.getElementById('loader');
            if (loader) loader.classList.add('hide');
        }, 2500);
        if (document.readyState !== 'loading') {
            setTimeout(function() {
                document.getElementById('loader').classList.add('hide');
            }, 2500);
        }
    </script>

    <!-- ===== 页眉 ===== -->
    <header class="header">
        <a href="https://lab.lruriawa.top/" class="brand">
            <span class="logo-icon">🧪</span>
            <span class="brand-text">槐序Lab实验室</span>
        </a>
        <span class="title">📄 文本统计</span>
        <a href="https://lab.lruriawa.top/release/home.html" class="nav-link primary">🏠 首页</a>
    </header>

    <!-- ===== 工具主体 ===== -->
    <div class="game-wrapper">
        <div class="tool-header">
            <span style="opacity:0.4;">📄</span>
            <span class="title-tag">文本统计器</span>
        </div>

        <div class="tool-container">
            <textarea id="textInput" placeholder="输入或粘贴文本，自动统计..."></textarea>

            <div class="stats-grid">
                <div class="stat-item">
                    <div class="number" id="charCount">0</div>
                    <div class="label">字符数</div>
                </div>
                <div class="stat-item">
                    <div class="number" id="charNoSpace">0</div>
                    <div class="label">不含空格</div>
                </div>
                <div class="stat-item">
                    <div class="number" id="wordCount">0</div>
                    <div class="label">单词数</div>
                </div>
                <div class="stat-item">
                    <div class="number" id="lineCount">0</div>
                    <div class="label">行数</div>
                </div>
                <div class="stat-item">
                    <div class="number" id="paraCount">0</div>
                    <div class="label">段落数</div>
                </div>
                <div class="stat-item">
                    <div class="number" id="readTime">0</div>
                    <div class="label">阅读时长(min)</div>
                </div>
            </div>

            <div class="btn-group">
                <button class="btn-example" id="exampleBtn">📄 示例</button>
                <button class="btn-clear" id="clearBtn">✕ 清空</button>
            </div>
        </div>

        <div class="how-to-play">
            <strong>📄 文本统计器：</strong>
            自动统计字符数（含/不含空格）、单词数、行数、段落数、预估阅读时长
        </div>
    </div>

    <!-- ===== 页脚 ===== -->
    <footer class="footer">
        <span class="text">
            🧪 槐序Lab实验室 · 文本统计器 &nbsp;|&nbsp; <span class="highlight">❤️ Design by DeepSeek</span>
            &nbsp;&nbsp;<span class="love">❤️</span>
        </span>
    </footer>

    <script>
        const input = document.getElementById('textInput');
        const charCount = document.getElementById('charCount');
        const charNoSpace = document.getElementById('charNoSpace');
        const wordCount = document.getElementById('wordCount');
        const lineCount = document.getElementById('lineCount');
        const paraCount = document.getElementById('paraCount');
        const readTime = document.getElementById('readTime');

        function updateStats() {
            const text = input.value;
            const len = text.length;

            charCount.textContent = len;
            charNoSpace.textContent = text.replace(/\s/g, '').length;

            const words = text.match(/[\w\u4e00-\u9fa5]+/g);
            wordCount.textContent = words ? words.length : 0;

            const lines = text.split('\n');
            lineCount.textContent = lines.filter(l => l.trim() !== '' || l === '').length || 0;

            const paras = text.split(/\n\s*\n/).filter(p => p.trim() !== '');
            paraCount.textContent = paras.length || 0;

            const chineseChars = (text.match(/[\u4e00-\u9fa5]/g) || []).length;
            const englishWords = (text.match(/[a-zA-Z]+/g) || []).length;
            const totalWords = chineseChars + englishWords;
            const minutes = Math.ceil(totalWords / 300);
            readTime.textContent = minutes || 0;
        }

        input.addEventListener('input', updateStats);

        document.getElementById('clearBtn').addEventListener('click', function() {
            input.value = '';
            updateStats();
        });

        document.getElementById('exampleBtn').addEventListener('click', function() {
            input.value = `槐序Lab实验室

交互 · 视觉 · 工具 · 游戏

欢迎来到槐序Lab！这里是一个集小游戏、视觉艺术、交互工具和实用工具于一体的在线工具体验中心。

目前已收录 86 个项目，涵盖 5 大分类：

🎮 小游戏（21款）
🛠️ 实用工具（35款）
🎨 视觉艺术（10款）
🧠 交互工具（11款）
🌟 动态特效（9款）

访问地址：https://lab.lruriawa.top

由热爱驱动，为探索而生。`;
            updateStats();
        });

        updateStats();
    </script>
</body>
</html>
