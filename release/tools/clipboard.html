<!DOCTYPE html>
<html lang="zh">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>📋 剪贴板历史-槐序Lab-槐序实验室</title>
    <link rel="icon" type="image/png" href="../tx.png">
    <link href="https://cdn.jsdelivr.net/gh/webfontworld/misans/MiSans.css" rel="stylesheet">
    <style>
        * { margin:0; padding:0; box-sizing:border-box; font-family:'MiSans', 'Segoe UI', system-ui, sans-serif; }
        body {
            background: #f5f7f5;
            background: linear-gradient(145deg, #f0f4f0 0%, #e8eee8 50%, #f5f7f5 100%);
            display:flex;
            justify-content:center;
            align-items:center;
            min-height:100vh;
            padding:10px;
            padding-top:70px;
            padding-bottom:70px;
            position:relative;
        }

        /* ===== 加载动画（统一风格） ===== */
        #loader {
            position:fixed;
            top:0; left:0; right:0; bottom:0;
            background: #f5f7f5;
            display:flex;
            flex-direction:column;
            justify-content:center;
            align-items:center;
            z-index:9999;
            transition:opacity 0.6s ease-out;
        }
        #loader.hide { opacity:0; pointer-events:none; }
        #loader .logo { font-size:5.5rem; animation: loaderPulse 1.2s ease-in-out infinite; margin-bottom:14px; }
        #loader .loader-text { color:rgba(0,0,0,0.3); font-size:1.6rem; letter-spacing:4px; font-weight:400; margin-bottom:20px; }
        #loader .loader-text span { color:#40C463; font-weight:600; }
        #loader .loading-status { color:rgba(0,0,0,0.15); font-size:1rem; letter-spacing:2px; margin-bottom:16px; animation: loadingDot 1.6s ease-in-out infinite; }
        @keyframes loadingDot { 0%,100% { opacity:0.3; } 50% { opacity:1; } }
        #loader .loader-bar { width:200px; height:4px; background:rgba(0,0,0,0.06); border-radius:4px; overflow:hidden; position:relative; }
        #loader .loader-bar .fill { position:absolute; left:0; top:0; height:100%; width:0%; background:linear-gradient(90deg, #216E39, #40C463, #9BE9A8); border-radius:4px; animation: loaderFill 2.5s ease-in-out forwards; }
        @keyframes loaderPulse { 0%,100% { transform:scale(1); } 50% { transform:scale(1.08); } }
        @keyframes loaderFill { 0% { width:0%; } 30% { width:40%; } 60% { width:75%; } 100% { width:100%; } }

        /* ===== 页眉（毛玻璃） ===== */
        .header {
            position:fixed;
            top:0;
            left:0;
            right:0;
            z-index:10;
            padding:0 20px;
            height:56px;
            display:flex;
            align-items:center;
            justify-content:space-between;
            background:rgba(255,255,255,0.85);
            backdrop-filter:blur(16px);
            -webkit-backdrop-filter:blur(16px);
            border-bottom:1px solid rgba(0,0,0,0.04);
        }
        .header .brand {
            display:flex;
            align-items:center;
            gap:8px;
            text-decoration:none;
            color:#1a1a1a;
            font-weight:700;
            font-size:1.0rem;
        }
        .header .brand .logo-icon { font-size:1.4rem; }
        .header .brand .brand-text {
            background:linear-gradient(135deg, #216E39, #40C463);
            -webkit-background-clip:text;
            -webkit-text-fill-color:transparent;
            background-clip:text;
        }
        .header .nav-link {
            color:rgba(0,0,0,0.45);
            text-decoration:none;
            font-size:0.8rem;
            padding:4px 14px;
            border-radius:20px;
            transition:all 0.3s;
            border:1px solid rgba(0,0,0,0.04);
        }
        .header .nav-link:hover {
            background:rgba(0,0,0,0.04);
            color:#1a1a1a;
            border-color:rgba(0,0,0,0.1);
        }
        .header .nav-link.primary {
            background:linear-gradient(135deg, #40C463, #30A14E);
            border:none;
            color:#fff;
        }
        .header .nav-link.primary:hover { opacity:0.85; }
        .header .title {
            color:#1a1a1a;
            font-size:0.95rem;
            font-weight:500;
            letter-spacing:0.5px;
        }

        /* ===== 页脚（毛玻璃） ===== */
        .footer {
            position:fixed;
            bottom:0;
            left:0;
            right:0;
            z-index:10;
            padding:10px 20px;
            display:flex;
            align-items:center;
            justify-content:center;
            background:rgba(255,255,255,0.70);
            backdrop-filter:blur(12px);
            -webkit-backdrop-filter:blur(12px);
            border-top:1px solid rgba(0,0,0,0.04);
        }
        .footer .text {
            color:rgba(0,0,0,0.25);
            font-size:0.75rem;
            letter-spacing:0.5px;
        }
        .footer .text .love { color:rgba(239,68,68,0.15); }
        .footer .text .highlight { color:#216E39; }

        /* ===== 工具容器（毛玻璃卡片） ===== */
        .game-wrapper {
            background:rgba(255,255,255,0.85);
            backdrop-filter:blur(8px);
            -webkit-backdrop-filter:blur(8px);
            border-radius:20px;
            padding:16px;
            box-shadow:0 4px 40px rgba(0,0,0,0.04);
            border:1px solid rgba(0,0,0,0.04);
            max-width:420px;
            width:100%;
        }

        /* ===== 内部工具容器（浅色） ===== */
        .tool-container {
            position:relative;
            width:100%;
            border-radius:16px;
            overflow:hidden;
            background:#ffffff;
            box-shadow:inset 0 0 40px rgba(0,0,0,0.02);
            padding:16px;
            min-height:320px;
            border:1px solid rgba(0,0,0,0.04);
        }

        /* ===== 输入区域 ===== */
        .clipboard-input-area {
            display:flex;
            gap:8px;
            margin-bottom:12px;
        }
        .clipboard-input-area input {
            flex:1;
            background:#f8faf8;
            border:1px solid rgba(0,0,0,0.06);
            border-radius:10px;
            padding:10px 14px;
            color:#1a1a1a;
            font-size:0.85rem;
            outline:none;
            transition:border-color 0.3s;
            font-family:'MiSans', 'Segoe UI', sans-serif;
        }
        .clipboard-input-area input:focus {
            border-color:rgba(33,110,57,0.25);
            background:#fafffa;
        }
        .clipboard-input-area input::placeholder {
            color:rgba(0,0,0,0.15);
        }
        .clipboard-input-area button {
            padding:10px 18px;
            border:none;
            border-radius:10px;
            font-size:0.8rem;
            font-weight:600;
            cursor:pointer;
            transition:transform 0.15s, opacity 0.2s;
            color:#fff;
            background:linear-gradient(135deg, #40C463, #30A14E);
            box-shadow:0 4px 20px rgba(64,196,99,0.25);
            white-space:nowrap;
            font-family:'MiSans', 'Segoe UI', sans-serif;
        }
        .clipboard-input-area button:active { transform:scale(0.94); }
        .clipboard-input-area button:hover { opacity:0.9; }

        /* ===== 列表 ===== */
        .clipboard-list {
            max-height:230px;
            overflow-y:auto;
            display:flex;
            flex-direction:column;
            gap:6px;
        }
        .clipboard-list::-webkit-scrollbar { width:4px; }
        .clipboard-list::-webkit-scrollbar-track { background:rgba(0,0,0,0.02); border-radius:4px; }
        .clipboard-list::-webkit-scrollbar-thumb { background:rgba(0,0,0,0.08); border-radius:4px; }

        .clipboard-item {
            background:rgba(0,0,0,0.02);
            border:1px solid rgba(0,0,0,0.04);
            border-radius:10px;
            padding:10px 14px;
            display:flex;
            justify-content:space-between;
            align-items:center;
            gap:8px;
            transition:all 0.3s;
            cursor:pointer;
        }
        .clipboard-item:hover {
            background:rgba(0,0,0,0.04);
            border-color:rgba(33,110,57,0.12);
        }
        .clipboard-item .text {
            color:#1a1a1a;
            font-size:0.8rem;
            word-break:break-all;
            flex:1;
            max-width:200px;
            overflow:hidden;
            text-overflow:ellipsis;
            white-space:nowrap;
            font-weight:400;
        }
        .clipboard-item .time {
            color:rgba(0,0,0,0.15);
            font-size:0.55rem;
            white-space:nowrap;
            min-width:50px;
            text-align:right;
        }
        .clipboard-item .del-btn {
            background:none;
            border:none;
            color:rgba(0,0,0,0.12);
            cursor:pointer;
            font-size:0.7rem;
            padding:0 4px;
            transition:color 0.2s;
        }
        .clipboard-item .del-btn:hover { color:#e74c3c; }

        .clipboard-empty {
            color:rgba(0,0,0,0.12);
            text-align:center;
            padding:30px 0;
            font-style:italic;
            font-size:0.85rem;
        }

        /* ===== 底部信息 ===== */
        .clipboard-info {
            display:flex;
            justify-content:space-between;
            color:rgba(0,0,0,0.15);
            font-size:0.6rem;
            margin-top:8px;
            padding-top:8px;
            border-top:1px solid rgba(0,0,0,0.04);
        }
        .clipboard-info button {
            background:none;
            border:none;
            color:rgba(0,0,0,0.15);
            cursor:pointer;
            font-size:0.6rem;
            transition:color 0.2s;
            font-family:'MiSans', 'Segoe UI', sans-serif;
        }
        .clipboard-info button:hover { color:#e74c3c; }

        /* ===== 说明 ===== */
        .how-to-play {
            background:rgba(0,0,0,0.04);
            border-radius:12px;
            padding:10px 14px;
            margin-top:10px;
            color:rgba(0,0,0,0.35);
            font-size:0.75rem;
            line-height:1.6;
            text-align:center;
            border:1px solid rgba(0,0,0,0.04);
        }
        .how-to-play strong { color:rgba(0,0,0,0.55); }

        /* ===== Toast ===== */
        .toast {
            position:fixed;
            bottom:80px;
            left:50%;
            transform:translateX(-50%) translateY(80px);
            background:rgba(0,0,0,0.8);
            backdrop-filter:blur(8px);
            color:#fff;
            padding:10px 24px;
            border-radius:30px;
            font-size:0.85rem;
            border:1px solid rgba(255,255,255,0.06);
            opacity:0;
            transition:all 0.4s ease;
            pointer-events:none;
            z-index:100;
            white-space:nowrap;
            font-family:'MiSans', 'Segoe UI', sans-serif;
        }
        .toast.show { opacity:1; transform:translateX(-50%) translateY(0); }

        /* ===== 移动端适配 ===== */
        @media (max-width: 640px) {
            body { padding-top:60px; padding-bottom:60px; }
            .game-wrapper { padding:12px; }
            .tool-container { padding:12px; min-height:280px; }
            .clipboard-item .text { max-width:130px; font-size:0.75rem; }
            .clipboard-input-area input { font-size:0.8rem; padding:8px 12px; }
            .clipboard-input-area button { font-size:0.75rem; padding:8px 14px; }
            .how-to-play { font-size:0.7rem; padding:8px 10px; }
            .toast { font-size:0.75rem; padding:8px 18px; bottom:70px; }
        }
        @media (max-width: 380px) {
            .clipboard-item .text { max-width:80px; }
            .clipboard-item .time { min-width:40px; font-size:0.5rem; }
        }
    </style>
</head>
<body>

<!-- ===== 加载动画 ===== -->
<div id="loader">
    <div class="logo">📋</div>
    <div class="loader-text">槐序<span>Lab</span>-槐序实验室</div>
    <div class="loading-status">加载中...</div>
    <div class="loader-bar"><div class="fill"></div></div>
</div>

<script>
    setTimeout(function() {
        var loader = document.getElementById('loader');
        if (loader) loader.classList.add('hide');
    }, 2500);
    if (document.readyState !== 'loading') {
        setTimeout(function() {
            document.getElementById('loader').classList.add('hide');
        }, 2500);
    }
</script>

<!-- ===== 页眉 ===== -->
<header class="header">
    <a href="https://lab.lruriawa.top/" class="brand">
        <span class="logo-icon">🧪</span>
        <span class="brand-text">槐序Lab实验室</span>
    </a>
    <span class="title">📋 剪贴板历史</span>
    <a href="https://lab.lruriawa.top/release/home.html" class="nav-link primary">🏠 首页</a>
</header>

<!-- ===== 工具主体 ===== -->
<div class="game-wrapper">
    <div class="tool-container">
        <div class="clipboard-input-area">
            <input type="text" id="clipInput" placeholder="输入内容后点击保存...">
            <button id="saveBtn">💾 保存</button>
        </div>

        <div class="clipboard-list" id="clipList">
            <div class="clipboard-empty">还没有保存的内容</div>
        </div>

        <div class="clipboard-info">
            <span id="clipCount">共 0 条</span>
            <button id="clearAllBtn">🗑️ 清空全部</button>
        </div>
    </div>

    <div class="how-to-play">
        <strong>📋 剪贴板历史：</strong>
        保存文本内容 · 点击条目复制到剪贴板 · 自动本地存储 · 刷新不丢失
    </div>
</div>

<!-- ===== 页脚 ===== -->
<footer class="footer">
    <span class="text">
        🧪 槐序Lab实验室 · 剪贴板历史 &nbsp;|&nbsp; <span class="highlight">❤️ Design by DeepSeek</span>
        &nbsp;&nbsp;<span class="love">❤️</span>
    </span>
</footer>

<!-- ===== Toast ===== -->
<div class="toast" id="toast"></div>

<script>
    // ===== Toast =====
    const toast = document.getElementById('toast');
    let toastTimer = null;

    function showToast(msg) {
        toast.textContent = msg;
        toast.classList.add('show');
        clearTimeout(toastTimer);
        toastTimer = setTimeout(() => toast.classList.remove('show'), 2000);
    }

    // ===== 数据管理 =====
    let clipboardData = [];

    function loadData() {
        try {
            const saved = localStorage.getItem('clipboard_history');
            if (saved) {
                clipboardData = JSON.parse(saved);
            }
        } catch (e) { clipboardData = []; }
        renderList();
    }

    function saveData() {
        try {
            localStorage.setItem('clipboard_history', JSON.stringify(clipboardData));
        } catch (e) {}
        renderList();
    }

    function addItem(text) {
        const trimmed = text.trim();
        if (!trimmed) { showToast('⚠️ 请输入内容'); return; }
        clipboardData.unshift({
            text: trimmed,
            time: new Date().toLocaleString('zh-CN')
        });
        if (clipboardData.length > 50) {
            clipboardData = clipboardData.slice(0, 50);
        }
        saveData();
        showToast('✅ 已保存');
        document.getElementById('clipInput').value = '';
        document.getElementById('clipInput').focus();
    }

    function deleteItem(index) {
        clipboardData.splice(index, 1);
        saveData();
        showToast('🗑️ 已删除');
    }

    function clearAll() {
        if (clipboardData.length === 0) return;
        if (confirm('确定要清空所有剪贴板历史吗？')) {
            clipboardData = [];
            saveData();
            showToast('🗑️ 已清空全部');
        }
    }

    function copyItem(index) {
        const item = clipboardData[index];
        if (!item) return;
        navigator.clipboard.writeText(item.text).then(() => {
            showToast('✅ 已复制到剪贴板');
        }).catch(() => {
            const ta = document.createElement('textarea');
            ta.value = item.text;
            document.body.appendChild(ta);
            ta.select();
            document.execCommand('copy');
            document.body.removeChild(ta);
            showToast('✅ 已复制');
        });
    }

    function renderList() {
        const container = document.getElementById('clipList');
        const countEl = document.getElementById('clipCount');

        if (clipboardData.length === 0) {
            container.innerHTML = '<div class="clipboard-empty">还没有保存的内容</div>';
            countEl.textContent = '共 0 条';
            return;
        }

        let html = '';
        clipboardData.forEach((item, index) => {
            const displayText = item.text.length > 30 ? item.text.slice(0, 28) + '…' : item.text;
            html += `
                <div class="clipboard-item" data-index="${index}">
                    <span class="text">${escapeHtml(displayText)}</span>
                    <span class="time">${item.time || ''}</span>
                    <button class="del-btn" data-index="${index}">✕</button>
                </div>
            `;
        });
        container.innerHTML = html;
        countEl.textContent = `共 ${clipboardData.length} 条`;

        container.querySelectorAll('.clipboard-item').forEach(el => {
            el.addEventListener('click', function(e) {
                if (e.target.closest('.del-btn')) return;
                const idx = parseInt(this.dataset.index);
                copyItem(idx);
            });
        });

        container.querySelectorAll('.del-btn').forEach(btn => {
            btn.addEventListener('click', function(e) {
                e.stopPropagation();
                const idx = parseInt(this.dataset.index);
                deleteItem(idx);
            });
        });
    }

    function escapeHtml(text) {
        const div = document.createElement('div');
        div.textContent = text;
        return div.innerHTML;
    }

    // ===== 事件绑定 =====
    document.getElementById('saveBtn').addEventListener('click', function() {
        const input = document.getElementById('clipInput');
        addItem(input.value);
    });

    document.getElementById('clipInput').addEventListener('keydown', function(e) {
        if (e.key === 'Enter') {
            e.preventDefault();
            document.getElementById('saveBtn').click();
        }
    });

    document.getElementById('clearAllBtn').addEventListener('click', clearAll);

    // ===== 监听系统复制 =====
    document.addEventListener('copy', function(e) {
        const selection = window.getSelection().toString().trim();
        if (selection && selection.length > 0 && selection.length < 500) {
            setTimeout(() => {
                const exists = clipboardData.some(item => item.text === selection);
                if (!exists) {
                    clipboardData.unshift({
                        text: selection,
                        time: new Date().toLocaleString('zh-CN')
                    });
                    if (clipboardData.length > 50) {
                        clipboardData = clipboardData.slice(0, 50);
                    }
                    saveData();
                }
            }, 300);
        }
    });

    // ===== 初始化 =====
    loadData();

    if (clipboardData.length === 0) {
        const examples = ['🌟 槐序Lab实验室 - https://lab.lruriawa.top', '🧪 由热爱驱动，为探索而生。'];
        examples.forEach((text, i) => {
            setTimeout(() => {
                clipboardData.push({
                    text: text,
                    time: new Date().toLocaleString('zh-CN')
                });
                if (i === examples.length - 1) {
                    saveData();
                }
            }, i * 100);
        });
    }
</script>
</body>
</html>
