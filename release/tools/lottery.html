<!DOCTYPE html>
<html lang="zh">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<title>🎯 抽签器-槐序Lab-槐序实验室</title>
<link rel="icon" type="image/png" href="../tx.png">
<link href="https://cdn.jsdelivr.net/gh/webfontworld/misans/MiSans.css" rel="stylesheet">
<style>
  * { margin:0; padding:0; box-sizing:border-box; user-select:none; -webkit-tap-highlight-color:transparent; font-family:'MiSans', 'Segoe UI', system-ui, sans-serif; }
  body {
    background: #f5f7f5;
    background: linear-gradient(145deg, #f0f4f0 0%, #e8eee8 50%, #f5f7f5 100%);
    display:flex;
    justify-content:center;
    align-items:center;
    min-height:100vh;
    padding:10px;
    padding-top:70px;
    padding-bottom:70px;
    position:relative;
  }

  /* ===== 加载动画（统一风格） ===== */
  #loader {
    position:fixed;
    top:0; left:0; right:0; bottom:0;
    background: #f5f7f5;
    display:flex;
    flex-direction:column;
    justify-content:center;
    align-items:center;
    z-index:9999;
    transition:opacity 0.6s ease-out;
  }
  #loader.hide { opacity:0; pointer-events:none; }
  #loader .logo { font-size:5.5rem; animation: loaderPulse 1.2s ease-in-out infinite; margin-bottom:14px; }
  #loader .loader-text { color:rgba(0,0,0,0.3); font-size:1.6rem; letter-spacing:4px; font-weight:400; margin-bottom:20px; }
  #loader .loader-text span { color:#40C463; font-weight:600; }
  #loader .loading-status { color:rgba(0,0,0,0.15); font-size:1rem; letter-spacing:2px; margin-bottom:16px; animation: loadingDot 1.6s ease-in-out infinite; }
  @keyframes loadingDot { 0%,100% { opacity:0.3; } 50% { opacity:1; } }
  #loader .loader-bar { width:200px; height:4px; background:rgba(0,0,0,0.06); border-radius:4px; overflow:hidden; position:relative; }
  #loader .loader-bar .fill { position:absolute; left:0; top:0; height:100%; width:0%; background:linear-gradient(90deg, #216E39, #40C463, #9BE9A8); border-radius:4px; animation: loaderFill 2.5s ease-in-out forwards; }
  @keyframes loaderPulse { 0%,100% { transform:scale(1); } 50% { transform:scale(1.08); } }
  @keyframes loaderFill { 0% { width:0%; } 30% { width:40%; } 60% { width:75%; } 100% { width:100%; } }

  /* ===== 页眉（毛玻璃） ===== */
  .header {
    position:fixed;
    top:0;
    left:0;
    right:0;
    z-index:10;
    padding:0 20px;
    height:56px;
    display:flex;
    align-items:center;
    justify-content:space-between;
    background:rgba(255,255,255,0.85);
    backdrop-filter:blur(16px);
    -webkit-backdrop-filter:blur(16px);
    border-bottom:1px solid rgba(0,0,0,0.04);
  }
  .header .brand {
    display:flex;
    align-items:center;
    gap:8px;
    text-decoration:none;
    color:#1a1a1a;
    font-weight:700;
    font-size:1.0rem;
  }
  .header .brand .logo-icon { font-size:1.4rem; }
  .header .brand .brand-text {
    background:linear-gradient(135deg, #216E39, #40C463);
    -webkit-background-clip:text;
    -webkit-text-fill-color:transparent;
    background-clip:text;
  }
  .header .nav-link {
    color:rgba(0,0,0,0.45);
    text-decoration:none;
    font-size:0.8rem;
    padding:4px 14px;
    border-radius:20px;
    transition:all 0.3s;
    border:1px solid rgba(0,0,0,0.04);
  }
  .header .nav-link:hover {
    background:rgba(0,0,0,0.04);
    color:#1a1a1a;
    border-color:rgba(0,0,0,0.1);
  }
  .header .nav-link.primary {
    background:linear-gradient(135deg, #40C463, #30A14E);
    border:none;
    color:#fff;
  }
  .header .nav-link.primary:hover { opacity:0.85; }
  .header .title {
    color:#1a1a1a;
    font-size:0.95rem;
    font-weight:500;
    letter-spacing:0.5px;
  }
  .header .title span { color:rgba(0,0,0,0.2); }

  /* ===== 页脚（毛玻璃） ===== */
  .footer {
    position:fixed;
    bottom:0;
    left:0;
    right:0;
    z-index:10;
    padding:10px 20px;
    display:flex;
    align-items:center;
    justify-content:center;
    background:rgba(255,255,255,0.70);
    backdrop-filter:blur(12px);
    -webkit-backdrop-filter:blur(12px);
    border-top:1px solid rgba(0,0,0,0.04);
  }
  .footer .text {
    color:rgba(0,0,0,0.25);
    font-size:0.75rem;
    letter-spacing:0.5px;
  }
  .footer .text .love { color:rgba(239,68,68,0.15); }
  .footer .text .highlight { color:#216E39; }

  /* ===== 工具容器（毛玻璃卡片） ===== */
  .tool-wrapper {
    background:rgba(255,255,255,0.85);
    backdrop-filter:blur(8px);
    -webkit-backdrop-filter:blur(8px);
    border-radius:20px;
    padding:16px;
    box-shadow:0 4px 40px rgba(0,0,0,0.04);
    border:1px solid rgba(0,0,0,0.04);
    max-width:420px;
    width:100%;
  }
  .tool-header {
    display:flex;
    justify-content:space-between;
    align-items:center;
    padding:0 6px 12px 6px;
    color:#1a1a1a;
    font-weight:700;
    font-size:1.0rem;
  }
  .tool-header .title-tag {
    color:rgba(0,0,0,0.3);
    font-size:0.9rem;
    font-weight:400;
  }

  /* ===== 内部工具容器（浅色毛玻璃） ===== */
  .tool-container {
    position:relative;
    width:100%;
    border-radius:16px;
    overflow:hidden;
    background:rgba(255,255,255,0.6);
    backdrop-filter:blur(6px);
    -webkit-backdrop-filter:blur(6px);
    border:1px solid rgba(0,0,0,0.04);
    padding:16px;
    min-height:360px;
  }

  /* ===== 抽签显示 ===== */
  .lottery-display {
    text-align:center;
    padding:20px 0;
    min-height:100px;
    display:flex;
    flex-direction:column;
    justify-content:center;
  }
  .lottery-display .result {
    font-size:2.8rem;
    font-weight:900;
    color:#216E39;
    text-shadow:0 0 40px rgba(33,110,57,0.08);
    transition:transform 0.1s ease;
    min-height:70px;
    display:flex;
    align-items:center;
    justify-content:center;
    word-break:break-word;
  }
  .lottery-display .sub {
    color:rgba(0,0,0,0.2);
    font-size:0.9rem;
    margin-top:6px;
    font-weight:400;
  }
  .lottery-display .result.placeholder {
    color:rgba(0,0,0,0.12);
    font-weight:400;
    font-size:1.4rem;
  }
  .lottery-display .result.warning {
    color:#e74c3c;
    font-size:1.2rem;
    font-weight:500;
  }

  /* ===== 输入区域 ===== */
  .lottery-input {
    margin:10px 0;
  }
  .lottery-input textarea {
    width:100%;
    height:110px;
    padding:12px;
    border-radius:12px;
    border:1px solid rgba(0,0,0,0.06);
    background:rgba(255,255,255,0.7);
    color:#1a1a1a;
    font-size:0.9rem;
    font-family:'MiSans', 'Segoe UI', sans-serif;
    outline:none;
    resize:vertical;
    line-height:1.8;
    transition:border-color 0.3s;
  }
  .lottery-input textarea:focus { border-color:#40C463; }
  .lottery-input textarea::placeholder { color:rgba(0,0,0,0.2); }

  /* ===== 控制按钮 ===== */
  .controls {
    display:flex;
    gap:10px;
    justify-content:center;
    flex-wrap:wrap;
  }
  .controls button {
    padding:10px 28px;
    border:none;
    border-radius:40px;
    font-size:1rem;
    font-weight:600;
    cursor:pointer;
    transition:transform 0.2s, opacity 0.2s;
    font-family:'MiSans', 'Segoe UI', sans-serif;
  }
  .controls button:active { transform:scale(0.94); }
  .controls button:hover { opacity:0.9; }
  .btn-draw {
    background:linear-gradient(135deg, #40C463, #30A14E);
    color:#fff;
    box-shadow:0 4px 20px rgba(64,196,99,0.3);
  }
  .btn-reset {
    background:rgba(0,0,0,0.04);
    color:rgba(0,0,0,0.4);
    border:1px solid rgba(0,0,0,0.06);
  }
  .btn-reset:hover { background:rgba(0,0,0,0.06); }

  /* ===== 说明 ===== */
  .how-to-play {
    background:rgba(0,0,0,0.04);
    border-radius:12px;
    padding:10px 14px;
    margin-top:12px;
    color:rgba(0,0,0,0.4);
    font-size:0.85rem;
    line-height:1.6;
    text-align:center;
    border:1px solid rgba(0,0,0,0.04);
  }
  .how-to-play strong { color:rgba(0,0,0,0.6); }

  /* ===== 移动端适配 ===== */
  @media (max-width: 640px) {
    body { padding-top:60px; padding-bottom:60px; }
    .tool-wrapper { padding:12px; }
    .tool-header { font-size:0.85rem; }
    .tool-container { padding:12px; min-height:320px; }
    .lottery-display .result { font-size:2.2rem; min-height:56px; }
    .lottery-input textarea { height:90px; font-size:0.8rem; padding:10px; }
    .controls button { font-size:0.9rem; padding:8px 20px; }
    .how-to-play { font-size:0.75rem; padding:8px 10px; }
  }
  @media (max-width: 380px) {
    .lottery-display .result { font-size:1.8rem; }
    .controls { gap:6px; }
    .controls button { font-size:0.8rem; padding:6px 16px; }
  }
</style>
</head>
<body>

<!-- ===== 加载动画 ===== -->
<div id="loader">
  <div class="logo">🎯</div>
  <div class="loader-text">槐序<span>Lab</span>-槐序实验室</div>
  <div class="loading-status">加载中...</div>
  <div class="loader-bar"><div class="fill"></div></div>
</div>

<!-- ===== 页眉 ===== -->
<header class="header">
  <a href="https://lab.lruriawa.top/" class="brand">
    <span class="logo-icon">🧪</span>
    <span class="brand-text">槐序Lab实验室</span>
  </a>
  <span class="title">🎯 抽签器</span>
  <a href="https://lab.lruriawa.top/release/home.html" class="nav-link primary">🏠 首页</a>
</header>

<!-- ===== 工具主体 ===== -->
<div class="tool-wrapper">
  <div class="tool-header">
    <span style="opacity:0.5;">🎯</span>
    <span class="title-tag">抽签器</span>
  </div>

  <div class="tool-container">
    <div class="lottery-display">
      <div class="result placeholder" id="result">🎲 点击抽签</div>
      <div class="sub" id="subInfo">共 0 项</div>
    </div>

    <div class="lottery-input">
      <textarea id="options" placeholder="每行一个选项&#10;例如：&#10;吃饭&#10;睡觉&#10;打游戏">吃饭
睡觉
打游戏</textarea>
    </div>

    <div class="controls">
      <button class="btn-draw" id="drawBtn">🎯 抽签</button>
      <button class="btn-reset" id="resetBtn">🔄 重置</button>
    </div>
  </div>

  <div class="how-to-play">
    <strong>💡 使用：</strong> 每行一个选项 · 点击抽签随机选一个 · 用于决策/抽奖
  </div>
</div>

<!-- ===== 页脚 ===== -->
<footer class="footer">
  <span class="text">
    🧪 槐序Lab实验室 · 抽签器 &nbsp;|&nbsp; <span class="highlight">❤️ Design by DeepSeek</span>
    &nbsp;&nbsp;<span class="love">❤️</span>
  </span>
</footer>

<script>
// ===== 加载动画隐藏（2.5秒，与统一风格一致） =====
document.addEventListener('DOMContentLoaded', function() {
    setTimeout(function() { document.getElementById('loader').classList.add('hide'); }, 2500);
});
if (document.readyState !== 'loading') {
    setTimeout(function() { document.getElementById('loader').classList.add('hide'); }, 2500);
}

// ===== 以下为抽签核心逻辑，完整保留 =====
const textarea = document.getElementById('options');
const result = document.getElementById('result');
const subInfo = document.getElementById('subInfo');
const drawBtn = document.getElementById('drawBtn');
const resetBtn = document.getElementById('resetBtn');

function getOptions() {
  return textarea.value.split('\n').map(s => s.trim()).filter(s => s.length > 0);
}

function updateInfo() {
  const opts = getOptions();
  subInfo.textContent = '共 ' + opts.length + ' 项';
  if (opts.length === 0) {
    result.textContent = '⚠️ 请添加选项';
    result.className = 'result warning';
  } else {
    result.className = 'result placeholder';
    if (result.textContent === '⚠️ 请添加选项' || result.textContent === '🎲 点击抽签') {
      // keep placeholder
    }
  }
}

function draw() {
  const opts = getOptions();
  if (opts.length === 0) {
    result.textContent = '⚠️ 请添加选项';
    result.className = 'result warning';
    return;
  }
  const pick = opts[Math.floor(Math.random() * opts.length)];
  result.textContent = pick;
  result.className = 'result';
  result.style.transform = 'scale(0.8)';
  setTimeout(() => result.style.transform = 'scale(1)', 100);
}

textarea.addEventListener('input', updateInfo);
drawBtn.addEventListener('click', draw);
resetBtn.addEventListener('click', function() {
  textarea.value = '';
  updateInfo();
  result.textContent = '🎲 点击抽签';
  result.className = 'result placeholder';
});

updateInfo();
</script>
</body>
</html>
