<!DOCTYPE html>
<html lang="zh">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>📋 JSON格式化-槐序Lab-槐序实验室</title>
    <link rel="icon" type="image/png" href="../tx.png">
    <link href="https://cdn.jsdelivr.net/gh/webfontworld/misans/MiSans.css" rel="stylesheet">
    <style>
        * { margin:0; padding:0; box-sizing:border-box; font-family:'MiSans', 'Segoe UI', system-ui, sans-serif; }
        body {
            background: #f5f7f5;
            background: linear-gradient(145deg, #f0f4f0 0%, #e8eee8 50%, #f5f7f5 100%);
            display:flex;
            justify-content:center;
            align-items:center;
            min-height:100vh;
            padding:10px;
            padding-top:70px;
            padding-bottom:70px;
            position:relative;
        }

        /* ===== 加载动画（统一风格） ===== */
        #loader {
            position:fixed;
            top:0; left:0; right:0; bottom:0;
            background: #f5f7f5;
            display:flex;
            flex-direction:column;
            justify-content:center;
            align-items:center;
            z-index:9999;
            transition:opacity 0.6s ease-out;
        }
        #loader.hide { opacity:0; pointer-events:none; }
        #loader .logo { font-size:5.5rem; animation: loaderPulse 1.2s ease-in-out infinite; margin-bottom:14px; }
        #loader .loader-text { color:rgba(0,0,0,0.3); font-size:1.6rem; letter-spacing:4px; font-weight:400; margin-bottom:20px; }
        #loader .loader-text span { color:#40C463; font-weight:600; }
        #loader .loading-status { color:rgba(0,0,0,0.15); font-size:1rem; letter-spacing:2px; margin-bottom:16px; animation: loadingDot 1.6s ease-in-out infinite; }
        @keyframes loadingDot { 0%,100% { opacity:0.3; } 50% { opacity:1; } }
        #loader .loader-bar { width:200px; height:4px; background:rgba(0,0,0,0.06); border-radius:4px; overflow:hidden; position:relative; }
        #loader .loader-bar .fill { position:absolute; left:0; top:0; height:100%; width:0%; background:linear-gradient(90deg, #216E39, #40C463, #9BE9A8); border-radius:4px; animation: loaderFill 2.5s ease-in-out forwards; }
        @keyframes loaderPulse { 0%,100% { transform:scale(1); } 50% { transform:scale(1.08); } }
        @keyframes loaderFill { 0% { width:0%; } 30% { width:40%; } 60% { width:75%; } 100% { width:100%; } }

        /* ===== 页眉（毛玻璃） ===== */
        .header {
            position:fixed;
            top:0;
            left:0;
            right:0;
            z-index:10;
            padding:0 20px;
            height:56px;
            display:flex;
            align-items:center;
            justify-content:space-between;
            background:rgba(255,255,255,0.85);
            backdrop-filter:blur(16px);
            -webkit-backdrop-filter:blur(16px);
            border-bottom:1px solid rgba(0,0,0,0.04);
        }
        .header .brand {
            display:flex;
            align-items:center;
            gap:8px;
            text-decoration:none;
            color:#1a1a1a;
            font-weight:700;
            font-size:1.0rem;
        }
        .header .brand .logo-icon { font-size:1.4rem; }
        .header .brand .brand-text {
            background:linear-gradient(135deg, #216E39, #40C463);
            -webkit-background-clip:text;
            -webkit-text-fill-color:transparent;
            background-clip:text;
        }
        .header .nav-link {
            color:rgba(0,0,0,0.45);
            text-decoration:none;
            font-size:0.8rem;
            padding:4px 14px;
            border-radius:20px;
            transition:all 0.3s;
            border:1px solid rgba(0,0,0,0.04);
        }
        .header .nav-link:hover {
            background:rgba(0,0,0,0.04);
            color:#1a1a1a;
            border-color:rgba(0,0,0,0.1);
        }
        .header .nav-link.primary {
            background:linear-gradient(135deg, #40C463, #30A14E);
            border:none;
            color:#fff;
        }
        .header .nav-link.primary:hover { opacity:0.85; }
        .header .title {
            color:#1a1a1a;
            font-size:0.95rem;
            font-weight:500;
            letter-spacing:0.5px;
        }
        .header .title span { color:rgba(0,0,0,0.2); }

        /* ===== 页脚（毛玻璃） ===== */
        .footer {
            position:fixed;
            bottom:0;
            left:0;
            right:0;
            z-index:10;
            padding:10px 20px;
            display:flex;
            align-items:center;
            justify-content:center;
            background:rgba(255,255,255,0.70);
            backdrop-filter:blur(12px);
            -webkit-backdrop-filter:blur(12px);
            border-top:1px solid rgba(0,0,0,0.04);
        }
        .footer .text {
            color:rgba(0,0,0,0.25);
            font-size:0.75rem;
            letter-spacing:0.5px;
        }
        .footer .text .love { color:rgba(239,68,68,0.15); }
        .footer .text .highlight { color:#216E39; }

        /* ===== 工具容器（毛玻璃卡片） ===== */
        .game-wrapper {
            background:rgba(255,255,255,0.85);
            backdrop-filter:blur(8px);
            -webkit-backdrop-filter:blur(8px);
            border-radius:20px;
            padding:16px;
            box-shadow:0 4px 40px rgba(0,0,0,0.04);
            border:1px solid rgba(0,0,0,0.04);
            max-width:480px;
            width:100%;
        }
        .tool-header {
            display:flex;
            justify-content:space-between;
            align-items:center;
            padding:0 6px 12px 6px;
            color:#1a1a1a;
            font-weight:700;
            font-size:1.0rem;
        }
        .tool-header .title-tag {
            color:rgba(0,0,0,0.3);
            font-size:0.9rem;
            font-weight:400;
        }

        /* ===== 内部工具容器（浅色毛玻璃） ===== */
        .tool-container {
            position:relative;
            width:100%;
            border-radius:16px;
            overflow:hidden;
            background:rgba(255,255,255,0.6);
            backdrop-filter:blur(6px);
            -webkit-backdrop-filter:blur(6px);
            border:1px solid rgba(0,0,0,0.04);
            padding:16px;
            min-height:400px;
        }

        /* ===== 输入框 ===== */
        .tool-container textarea {
            width:100%;
            min-height:130px;
            background:rgba(255,255,255,0.7);
            border:1px solid rgba(0,0,0,0.06);
            border-radius:10px;
            padding:12px;
            color:#1a1a1a;
            font-size:0.8rem;
            font-family:'MiSans', 'Consolas', 'Courier New', monospace;
            resize:vertical;
            outline:none;
            transition:border-color 0.3s;
            line-height:1.6;
        }
        .tool-container textarea:focus { border-color:#40C463; }
        .tool-container textarea::placeholder { color:rgba(0,0,0,0.2); }

        /* ===== 输出区域 ===== */
        .json-output {
            margin-top:10px;
            background:rgba(255,255,255,0.5);
            border:1px solid rgba(0,0,0,0.04);
            border-radius:10px;
            padding:12px 14px;
            min-height:80px;
            max-height:200px;
            overflow-y:auto;
            color:rgba(0,0,0,0.7);
            font-family:'MiSans', 'Consolas', 'Courier New', monospace;
            font-size:0.75rem;
            line-height:1.7;
            white-space:pre-wrap;
            word-break:break-all;
        }
        .json-output::-webkit-scrollbar { width:4px; }
        .json-output::-webkit-scrollbar-track { background:rgba(0,0,0,0.02); border-radius:4px; }
        .json-output::-webkit-scrollbar-thumb { background:rgba(0,0,0,0.08); border-radius:4px; }
        .json-output .error { color:#e74c3c; }
        .json-output .empty { color:rgba(0,0,0,0.2); font-style:italic; }

        /* ===== 按钮组 ===== */
        .btn-group {
            display:flex;
            gap:8px;
            margin-top:10px;
            flex-wrap:wrap;
        }
        .btn-group button {
            flex:1;
            padding:8px 12px;
            border:none;
            border-radius:10px;
            font-size:0.8rem;
            font-weight:600;
            cursor:pointer;
            transition:transform 0.15s, opacity 0.2s;
            color:#fff;
            font-family:'MiSans', 'Segoe UI', sans-serif;
            min-width:50px;
        }
        .btn-group button:active { transform:scale(0.94); }
        .btn-group button:hover { opacity:0.9; }
        .btn-group .btn-format {
            background:linear-gradient(135deg, #7c3aed, #a29bfe);
            box-shadow:0 4px 20px rgba(108,92,231,0.25);
        }
        .btn-group .btn-minify {
            background:linear-gradient(135deg, #f59e0b, #f97316);
            box-shadow:0 4px 20px rgba(245,158,11,0.25);
        }
        .btn-group .btn-clear {
            background:rgba(0,0,0,0.04);
            border:1px solid rgba(0,0,0,0.06);
            color:rgba(0,0,0,0.4);
        }
        .btn-group .btn-clear:hover { background:rgba(0,0,0,0.06); }
        .btn-group .btn-copy {
            background:rgba(33,110,57,0.08);
            border:1px solid rgba(33,110,57,0.1);
            color:#216E39;
        }
        .btn-group .btn-copy:hover { background:rgba(33,110,57,0.12); }

        /* ===== 说明 ===== */
        .how-to-play {
            background:rgba(0,0,0,0.04);
            border-radius:12px;
            padding:10px 14px;
            margin-top:10px;
            color:rgba(0,0,0,0.4);
            font-size:0.75rem;
            line-height:1.6;
            text-align:center;
            border:1px solid rgba(0,0,0,0.04);
        }
        .how-to-play strong { color:rgba(0,0,0,0.6); }

        /* ===== 移动端适配 ===== */
        @media (max-width: 640px) {
            body { padding-top:60px; padding-bottom:60px; }
            .game-wrapper { padding:12px; }
            .tool-header { font-size:0.85rem; }
            .tool-container { padding:12px; min-height:360px; }
            .tool-container textarea { min-height:100px; font-size:0.7rem; padding:10px; }
            .json-output { font-size:0.65rem; min-height:60px; max-height:160px; padding:10px 12px; }
            .btn-group button { font-size:0.7rem; padding:6px 10px; min-width:40px; }
            .how-to-play { font-size:0.7rem; padding:8px 10px; }
        }
        @media (max-width: 380px) {
            .btn-group { gap:4px; }
            .btn-group button { font-size:0.6rem; padding:4px 6px; }
        }
    </style>
</head>
<body>

    <!-- ===== 加载动画 ===== -->
    <div id="loader">
        <div class="logo">📋</div>
        <div class="loader-text">槐序<span>Lab</span>-槐序实验室</div>
        <div class="loading-status">加载中...</div>
        <div class="loader-bar"><div class="fill"></div></div>
    </div>

    <!-- ===== 页眉 ===== -->
    <header class="header">
        <a href="https://lab.lruriawa.top/" class="brand">
            <span class="logo-icon">🧪</span>
            <span class="brand-text">槐序Lab实验室</span>
        </a>
        <span class="title">📋 JSON格式化</span>
        <a href="https://lab.lruriawa.top/release/home.html" class="nav-link primary">🏠 首页</a>
    </header>

    <!-- ===== 工具主体 ===== -->
    <div class="game-wrapper">
        <div class="tool-header">
            <span style="opacity:0.5;">📋</span>
            <span class="title-tag">JSON格式化工具</span>
        </div>

        <div class="tool-container">
            <textarea id="jsonInput" placeholder='粘贴 JSON 数据，如 {"name":"槐序Lab","url":"lab.lruriawa.top"}'></textarea>

            <div class="btn-group">
                <button class="btn-format" id="formatBtn">✨ 格式化</button>
                <button class="btn-minify" id="minifyBtn">📦 压缩</button>
                <button class="btn-copy" id="copyBtn">📋 复制</button>
                <button class="btn-clear" id="clearBtn">✕ 清空</button>
            </div>

            <div class="json-output" id="jsonOutput">
                <span class="empty">输入 JSON 后点击「格式化」或「压缩」</span>
            </div>
        </div>

        <div class="how-to-play">
            <strong>📋 JSON格式化工具：</strong>
            粘贴 JSON 数据，一键格式化/压缩，支持复制结果
        </div>
    </div>

    <!-- ===== 页脚 ===== -->
    <footer class="footer">
        <span class="text">
            🧪 槐序Lab实验室 · JSON格式化 &nbsp;|&nbsp; <span class="highlight">❤️ Design by DeepSeek</span>
            &nbsp;&nbsp;<span class="love">❤️</span>
        </span>
    </footer>

    <script>
        // ===== 加载动画隐藏（2.5秒，与统一风格一致） =====
        document.addEventListener('DOMContentLoaded', function() {
            setTimeout(function() {
                document.getElementById('loader').classList.add('hide');
            }, 2500);
        });
        if (document.readyState !== 'loading') {
            setTimeout(function() {
                document.getElementById('loader').classList.add('hide');
            }, 2500);
        }

        // ===== 以下为JSON格式化核心逻辑，完整保留 =====
        const input = document.getElementById('jsonInput');
        const output = document.getElementById('jsonOutput');

        function formatJSON(spaces) {
            const text = input.value.trim();
            if (!text) {
                output.innerHTML = '<span class="empty">⚠️ 请先输入 JSON 数据</span>';
                return;
            }
            try {
                const parsed = JSON.parse(text);
                const formatted = JSON.stringify(parsed, null, spaces || 2);
                output.innerHTML = escapeHtml(formatted);
                output.className = 'json-output';
            } catch (e) {
                output.innerHTML = `<span class="error">❌ JSON 解析错误: ${e.message}</span>`;
                output.className = 'json-output';
            }
        }

        function minifyJSON() {
            const text = input.value.trim();
            if (!text) {
                output.innerHTML = '<span class="empty">⚠️ 请先输入 JSON 数据</span>';
                return;
            }
            try {
                const parsed = JSON.parse(text);
                const minified = JSON.stringify(parsed);
                output.innerHTML = escapeHtml(minified);
                output.className = 'json-output';
            } catch (e) {
                output.innerHTML = `<span class="error">❌ JSON 解析错误: ${e.message}</span>`;
                output.className = 'json-output';
            }
        }

        function escapeHtml(text) {
            const div = document.createElement('div');
            div.textContent = text;
            return div.innerHTML;
        }

        function copyResult() {
            const text = output.textContent;
            if (!text || text.includes('⚠️') || text.includes('❌')) {
                return;
            }
            navigator.clipboard.writeText(text).then(() => {
                const orig = output.innerHTML;
                output.innerHTML = '<span style="color:#216E39;">✅ 已复制到剪贴板</span>';
                setTimeout(() => {
                    output.innerHTML = orig;
                }, 1500);
            }).catch(() => {
                const range = document.createRange();
                range.selectNode(output);
                window.getSelection().removeAllRanges();
                window.getSelection().addRange(range);
                document.execCommand('copy');
                const orig = output.innerHTML;
                output.innerHTML = '<span style="color:#216E39;">✅ 已复制</span>';
                setTimeout(() => {
                    output.innerHTML = orig;
                }, 1500);
            });
        }

        document.getElementById('formatBtn').addEventListener('click', function() {
            formatJSON(2);
        });
        document.getElementById('minifyBtn').addEventListener('click', minifyJSON);
        document.getElementById('copyBtn').addEventListener('click', copyResult);
        document.getElementById('clearBtn').addEventListener('click', function() {
            input.value = '';
            output.innerHTML = '<span class="empty">输入 JSON 后点击「格式化」或「压缩」</span>';
            output.className = 'json-output';
        });

        // 快捷键: Ctrl+Enter 格式化
        input.addEventListener('keydown', function(e) {
            if ((e.ctrlKey || e.metaKey) && e.key === 'Enter') {
                e.preventDefault();
                formatJSON(2);
            }
        });

        // 初始示例
        input.value = '{"name":"槐序Lab实验室","url":"https://lab.lruriawa.top","categories":["小游戏","工具","视觉艺术"],"status":"active"}';
        formatJSON(2);
    </script>
</body>
</html>
