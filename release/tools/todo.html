<!DOCTYPE html>
<html lang="zh">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<title>📝 待办清单-槐序Lab-槐序实验室</title>
<link rel="icon" type="image/png" href="../tx.png">
<link href="https://cdn.jsdelivr.net/gh/webfontworld/misans/MiSans.css" rel="stylesheet">
<style>
  * { margin:0; padding:0; box-sizing:border-box; user-select:none; -webkit-tap-highlight-color:transparent; font-family:'MiSans', 'Segoe UI', system-ui, sans-serif; }
  body {
    background: #f5f7f5;
    background: linear-gradient(145deg, #f0f4f0 0%, #e8eee8 50%, #f5f7f5 100%);
    display:flex;
    justify-content:center;
    align-items:center;
    min-height:100vh;
    padding:10px;
    padding-top:70px;
    padding-bottom:70px;
    position:relative;
  }

  /* ===== 加载动画（统一风格） ===== */
  #loader {
    position:fixed;
    top:0; left:0; right:0; bottom:0;
    background: #f5f7f5;
    display:flex;
    flex-direction:column;
    justify-content:center;
    align-items:center;
    z-index:9999;
    transition:opacity 0.6s ease-out;
  }
  #loader.hide { opacity:0; pointer-events:none; }
  #loader .logo { font-size:5.5rem; animation: loaderPulse 1.2s ease-in-out infinite; margin-bottom:14px; }
  #loader .loader-text { color:rgba(0,0,0,0.3); font-size:1.6rem; letter-spacing:4px; font-weight:400; margin-bottom:20px; }
  #loader .loader-text span { color:#40C463; font-weight:600; }
  #loader .loading-status { color:rgba(0,0,0,0.15); font-size:1rem; letter-spacing:2px; margin-bottom:16px; animation: loadingDot 1.6s ease-in-out infinite; }
  @keyframes loadingDot { 0%,100% { opacity:0.3; } 50% { opacity:1; } }
  #loader .loader-bar { width:200px; height:4px; background:rgba(0,0,0,0.06); border-radius:4px; overflow:hidden; position:relative; }
  #loader .loader-bar .fill { position:absolute; left:0; top:0; height:100%; width:0%; background:linear-gradient(90deg, #216E39, #40C463, #9BE9A8); border-radius:4px; animation: loaderFill 2.5s ease-in-out forwards; }
  @keyframes loaderPulse { 0%,100% { transform:scale(1); } 50% { transform:scale(1.08); } }
  @keyframes loaderFill { 0% { width:0%; } 30% { width:40%; } 60% { width:75%; } 100% { width:100%; } }

  /* ===== 页眉（毛玻璃） ===== */
  .header {
    position:fixed;
    top:0;
    left:0;
    right:0;
    z-index:10;
    padding:0 20px;
    height:56px;
    display:flex;
    align-items:center;
    justify-content:space-between;
    background:rgba(255,255,255,0.85);
    backdrop-filter:blur(16px);
    -webkit-backdrop-filter:blur(16px);
    border-bottom:1px solid rgba(0,0,0,0.04);
  }
  .header .brand {
    display:flex;
    align-items:center;
    gap:8px;
    text-decoration:none;
    color:#1a1a1a;
    font-weight:700;
    font-size:1.0rem;
  }
  .header .brand .logo-icon { font-size:1.4rem; }
  .header .brand .brand-text {
    background:linear-gradient(135deg, #216E39, #40C463);
    -webkit-background-clip:text;
    -webkit-text-fill-color:transparent;
    background-clip:text;
  }
  .header .nav-link {
    color:rgba(0,0,0,0.45);
    text-decoration:none;
    font-size:0.8rem;
    padding:4px 14px;
    border-radius:20px;
    transition:all 0.3s;
    border:1px solid rgba(0,0,0,0.04);
  }
  .header .nav-link:hover {
    background:rgba(0,0,0,0.04);
    color:#1a1a1a;
    border-color:rgba(0,0,0,0.1);
  }
  .header .nav-link.primary {
    background:linear-gradient(135deg, #40C463, #30A14E);
    border:none;
    color:#fff;
  }
  .header .nav-link.primary:hover { opacity:0.85; }
  .header .title {
    color:#1a1a1a;
    font-size:0.95rem;
    font-weight:500;
    letter-spacing:0.5px;
  }
  .header .title span { color:rgba(0,0,0,0.2); }

  /* ===== 页脚（毛玻璃） ===== */
  .footer {
    position:fixed;
    bottom:0;
    left:0;
    right:0;
    z-index:10;
    padding:10px 20px;
    display:flex;
    align-items:center;
    justify-content:center;
    background:rgba(255,255,255,0.70);
    backdrop-filter:blur(12px);
    -webkit-backdrop-filter:blur(12px);
    border-top:1px solid rgba(0,0,0,0.04);
  }
  .footer .text {
    color:rgba(0,0,0,0.25);
    font-size:0.75rem;
    letter-spacing:0.5px;
  }
  .footer .text .love { color:rgba(239,68,68,0.15); }
  .footer .text .highlight { color:#216E39; }

  /* ===== 工具容器（毛玻璃卡片） ===== */
  .tool-wrapper {
    background:rgba(255,255,255,0.85);
    backdrop-filter:blur(8px);
    -webkit-backdrop-filter:blur(8px);
    border-radius:20px;
    padding:16px;
    box-shadow:0 4px 40px rgba(0,0,0,0.04);
    border:1px solid rgba(0,0,0,0.04);
    max-width:420px;
    width:100%;
  }
  .tool-header {
    display:flex;
    justify-content:space-between;
    align-items:center;
    padding:0 6px 12px 6px;
    color:#1a1a1a;
    font-weight:700;
    font-size:1.0rem;
  }
  .tool-header .title-tag {
    color:rgba(0,0,0,0.3);
    font-size:0.9rem;
    font-weight:400;
  }
  .tool-header .count {
    background:rgba(0,0,0,0.06);
    padding:2px 14px;
    border-radius:30px;
    font-size:0.9rem;
    color:rgba(0,0,0,0.4);
    font-weight:500;
  }
  .tool-header .count span { color:#216E39; font-weight:700; }

  /* ===== 内部工具容器（浅色毛玻璃） ===== */
  .tool-container {
    position:relative;
    width:100%;
    border-radius:16px;
    overflow:hidden;
    background:rgba(255,255,255,0.6);
    backdrop-filter:blur(6px);
    -webkit-backdrop-filter:blur(6px);
    border:1px solid rgba(0,0,0,0.04);
    padding:16px;
    min-height:320px;
  }

  /* ===== 输入区域 ===== */
  .input-area {
    display:flex;
    gap:10px;
    margin-bottom:14px;
  }
  .input-area input {
    flex:1;
    padding:10px 14px;
    border-radius:12px;
    border:1px solid rgba(0,0,0,0.06);
    background:rgba(255,255,255,0.7);
    color:#1a1a1a;
    font-size:1rem;
    outline:none;
    font-family:'MiSans', 'Segoe UI', sans-serif;
    transition:border-color 0.2s, background 0.2s;
  }
  .input-area input::placeholder { color:rgba(0,0,0,0.2); }
  .input-area input:focus {
    border-color:#40C463;
    background:rgba(255,255,255,0.9);
  }
  .input-area button {
    padding:10px 20px;
    border:none;
    border-radius:12px;
    background:linear-gradient(135deg, #40C463, #30A14E);
    color:#fff;
    font-weight:600;
    cursor:pointer;
    font-size:1rem;
    transition:transform 0.2s, opacity 0.2s;
    font-family:'MiSans', 'Segoe UI', sans-serif;
    box-shadow:0 4px 16px rgba(64,196,99,0.2);
    white-space:nowrap;
  }
  .input-area button:active { transform:scale(0.94); }
  .input-area button:hover { opacity:0.9; }

  /* ===== 待办列表 ===== */
  .todo-list {
    list-style:none;
    max-height:400px;
    overflow-y:auto;
  }
  .todo-list::-webkit-scrollbar { width:4px; }
  .todo-list::-webkit-scrollbar-track { background:rgba(0,0,0,0.02); border-radius:4px; }
  .todo-list::-webkit-scrollbar-thumb { background:rgba(0,0,0,0.08); border-radius:4px; }

  .todo-item {
    display:flex;
    align-items:center;
    gap:10px;
    padding:10px 12px;
    margin-bottom:6px;
    background:rgba(255,255,255,0.5);
    border:1px solid rgba(0,0,0,0.04);
    border-radius:12px;
    transition:background 0.2s, border-color 0.2s;
  }
  .todo-item:hover {
    background:rgba(255,255,255,0.7);
    border-color:rgba(0,0,0,0.06);
  }
  .todo-item.done .todo-text { text-decoration:line-through; opacity:0.35; }
  .todo-item .todo-check {
    width:22px;
    height:22px;
    border-radius:50%;
    border:2px solid rgba(0,0,0,0.15);
    cursor:pointer;
    flex-shrink:0;
    display:flex;
    align-items:center;
    justify-content:center;
    transition:all 0.2s;
    font-size:12px;
    font-weight:700;
    color:transparent;
  }
  .todo-item .todo-check.done {
    background:#40C463;
    border-color:#40C463;
    color:#fff;
  }
  .todo-item .todo-check:active { transform:scale(0.85); }
  .todo-item .todo-text {
    flex:1;
    color:#1a1a1a;
    font-size:1rem;
    word-break:break-all;
    font-weight:400;
  }
  .todo-item .todo-del {
    background:rgba(231,76,60,0.06);
    border:1px solid rgba(231,76,60,0.08);
    color:#e74c3c;
    width:28px;
    height:28px;
    border-radius:50%;
    cursor:pointer;
    font-size:13px;
    transition:background 0.2s, transform 0.2s;
    flex-shrink:0;
    display:flex;
    align-items:center;
    justify-content:center;
  }
  .todo-item .todo-del:hover { background:rgba(231,76,60,0.10); }
  .todo-item .todo-del:active { background:rgba(231,76,60,0.15); transform:scale(0.85); }

  .empty-tip {
    color:rgba(0,0,0,0.15);
    text-align:center;
    padding:40px 0;
    font-size:0.95rem;
    font-style:italic;
  }

  /* ===== 说明 ===== */
  .how-to-play {
    background:rgba(0,0,0,0.04);
    border-radius:12px;
    padding:10px 14px;
    margin-top:12px;
    color:rgba(0,0,0,0.4);
    font-size:0.85rem;
    line-height:1.6;
    text-align:center;
    border:1px solid rgba(0,0,0,0.04);
  }
  .how-to-play strong { color:rgba(0,0,0,0.6); }

  /* ===== 移动端适配 ===== */
  @media (max-width: 640px) {
    body { padding-top:60px; padding-bottom:60px; }
    .tool-wrapper { padding:12px; }
    .tool-header { font-size:0.85rem; }
    .tool-header .count { font-size:0.8rem; padding:2px 10px; }
    .tool-container { padding:12px; min-height:280px; }
    .input-area input { font-size:0.9rem; padding:8px 12px; }
    .input-area button { font-size:0.9rem; padding:8px 16px; }
    .todo-item { padding:8px 10px; }
    .todo-item .todo-text { font-size:0.9rem; }
    .how-to-play { font-size:0.75rem; padding:8px 10px; }
  }
  @media (max-width: 380px) {
    .input-area { gap:6px; }
    .input-area input { font-size:0.8rem; padding:6px 10px; }
    .input-area button { font-size:0.8rem; padding:6px 12px; }
    .todo-item .todo-text { font-size:0.8rem; }
  }
</style>
</head>
<body>

<!-- ===== 加载动画 ===== -->
<div id="loader">
  <div class="logo">📝</div>
  <div class="loader-text">槐序<span>Lab</span>-槐序实验室</div>
  <div class="loading-status">加载中...</div>
  <div class="loader-bar"><div class="fill"></div></div>
</div>

<!-- ===== 页眉 ===== -->
<header class="header">
  <a href="https://lab.lruriawa.top/" class="brand">
    <span class="logo-icon">🧪</span>
    <span class="brand-text">槐序Lab实验室</span>
  </a>
  <span class="title">📝 待办清单</span>
  <a href="https://lab.lruriawa.top/release/home.html" class="nav-link primary">🏠 首页</a>
</header>

<!-- ===== 工具主体 ===== -->
<div class="tool-wrapper">
  <div class="tool-header">
    <span style="opacity:0.5;">📝</span>
    <span class="count">事项 <span id="todoCount">0</span></span>
  </div>

  <div class="tool-container">
    <div class="input-area">
      <input type="text" id="todoInput" placeholder="输入待办事项..." maxlength="50">
      <button id="addBtn">添加</button>
    </div>
    <ul class="todo-list" id="todoList"></ul>
  </div>

  <div class="how-to-play">
    <strong>💡 使用：</strong> 输入事项点击添加 · 点击圆圈标记完成 · ✕ 删除
  </div>
</div>

<!-- ===== 页脚 ===== -->
<footer class="footer">
  <span class="text">
    🧪 槐序Lab实验室 · 待办清单 &nbsp;|&nbsp; <span class="highlight">❤️ Design by DeepSeek</span>
    &nbsp;&nbsp;<span class="love">❤️</span>
  </span>
</footer>

<script>
// ===== 加载动画隐藏（2.5秒，与统一风格一致） =====
document.addEventListener('DOMContentLoaded', function() {
    setTimeout(function() { document.getElementById('loader').classList.add('hide'); }, 2500);
});
if (document.readyState !== 'loading') {
    setTimeout(function() { document.getElementById('loader').classList.add('hide'); }, 2500);
}

// ===== 以下为待办清单核心逻辑，完整保留 =====
const input = document.getElementById('todoInput');
const addBtn = document.getElementById('addBtn');
const list = document.getElementById('todoList');
const countSpan = document.getElementById('todoCount');

let todos = JSON.parse(localStorage.getItem('todos')) || [];

function save() { localStorage.setItem('todos', JSON.stringify(todos)); }

function render() {
  list.innerHTML = '';
  if (todos.length === 0) {
    list.innerHTML = '<div class="empty-tip">✨ 还没有待办事项</div>';
    countSpan.textContent = '0';
    return;
  }
  countSpan.textContent = todos.length;
  todos.forEach((todo, i) => {
    const li = document.createElement('li');
    li.className = 'todo-item' + (todo.done ? ' done' : '');
    li.innerHTML = `
      <div class="todo-check ${todo.done ? 'done' : ''}" data-i="${i}">${todo.done ? '✓' : ''}</div>
      <span class="todo-text">${escapeHtml(todo.text)}</span>
      <button class="todo-del" data-i="${i}">✕</button>
    `;
    list.appendChild(li);
  });
}

function escapeHtml(text) {
  const div = document.createElement('div');
  div.textContent = text;
  return div.innerHTML;
}

list.addEventListener('click', function(e) {
  const btn = e.target.closest('.todo-check, .todo-del');
  if (!btn) return;
  const i = parseInt(btn.dataset.i);
  if (btn.classList.contains('todo-check')) {
    todos[i].done = !todos[i].done;
  } else {
    todos.splice(i, 1);
  }
  save(); render();
});

addBtn.addEventListener('click', function() {
  const text = input.value.trim();
  if (!text) return;
  todos.push({ text, done: false });
  input.value = '';
  save(); render();
  input.focus();
});

input.addEventListener('keydown', function(e) { if (e.key === 'Enter') addBtn.click(); });

render();
</script>
</body>
</html>
