<!DOCTYPE html>
<html lang="zh">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>🔤 编码转换器-槐序Lab-槐序实验室</title>
    <link rel="icon" type="image/png" href="../tx.png">
    <link href="https://cdn.jsdelivr.net/gh/webfontworld/misans/MiSans.css" rel="stylesheet">
    <style>
        * { margin:0; padding:0; box-sizing:border-box; font-family:'MiSans', 'Segoe UI', system-ui, sans-serif; }
        body {
            background: #f5f7f5;
            background: linear-gradient(145deg, #f0f4f0 0%, #e8eee8 50%, #f5f7f5 100%);
            display:flex;
            justify-content:center;
            align-items:center;
            min-height:100vh;
            padding:10px;
            padding-top:70px;
            padding-bottom:70px;
            position:relative;
        }

        /* ===== 加载动画（统一风格） ===== */
        #loader {
            position:fixed;
            top:0; left:0; right:0; bottom:0;
            background: #f5f7f5;
            display:flex;
            flex-direction:column;
            justify-content:center;
            align-items:center;
            z-index:9999;
            transition:opacity 0.6s ease-out;
        }
        #loader.hide { opacity:0; pointer-events:none; }
        #loader .logo { font-size:5.5rem; animation: loaderPulse 1.2s ease-in-out infinite; margin-bottom:14px; }
        #loader .loader-text { color:rgba(0,0,0,0.3); font-size:1.6rem; letter-spacing:4px; font-weight:400; margin-bottom:20px; }
        #loader .loader-text span { color:#40C463; font-weight:600; }
        #loader .loading-status { color:rgba(0,0,0,0.15); font-size:1rem; letter-spacing:2px; margin-bottom:16px; animation: loadingDot 1.6s ease-in-out infinite; }
        @keyframes loadingDot { 0%,100% { opacity:0.3; } 50% { opacity:1; } }
        #loader .loader-bar { width:200px; height:4px; background:rgba(0,0,0,0.06); border-radius:4px; overflow:hidden; position:relative; }
        #loader .loader-bar .fill { position:absolute; left:0; top:0; height:100%; width:0%; background:linear-gradient(90deg, #216E39, #40C463, #9BE9A8); border-radius:4px; animation: loaderFill 2.5s ease-in-out forwards; }
        @keyframes loaderPulse { 0%,100% { transform:scale(1); } 50% { transform:scale(1.08); } }
        @keyframes loaderFill { 0% { width:0%; } 30% { width:40%; } 60% { width:75%; } 100% { width:100%; } }

        /* ===== 页眉（毛玻璃） ===== */
        .header {
            position:fixed;
            top:0;
            left:0;
            right:0;
            z-index:10;
            padding:0 20px;
            height:56px;
            display:flex;
            align-items:center;
            justify-content:space-between;
            background:rgba(255,255,255,0.85);
            backdrop-filter:blur(16px);
            -webkit-backdrop-filter:blur(16px);
            border-bottom:1px solid rgba(0,0,0,0.04);
        }
        .header .brand {
            display:flex;
            align-items:center;
            gap:8px;
            text-decoration:none;
            color:#1a1a1a;
            font-weight:700;
            font-size:1.0rem;
        }
        .header .brand .logo-icon { font-size:1.4rem; }
        .header .brand .brand-text {
            background:linear-gradient(135deg, #216E39, #40C463);
            -webkit-background-clip:text;
            -webkit-text-fill-color:transparent;
            background-clip:text;
        }
        .header .nav-link {
            color:rgba(0,0,0,0.45);
            text-decoration:none;
            font-size:0.8rem;
            padding:4px 14px;
            border-radius:20px;
            transition:all 0.3s;
            border:1px solid rgba(0,0,0,0.04);
        }
        .header .nav-link:hover {
            background:rgba(0,0,0,0.04);
            color:#1a1a1a;
            border-color:rgba(0,0,0,0.1);
        }
        .header .nav-link.primary {
            background:linear-gradient(135deg, #40C463, #30A14E);
            border:none;
            color:#fff;
        }
        .header .nav-link.primary:hover { opacity:0.85; }
        .header .title {
            color:#1a1a1a;
            font-size:0.95rem;
            font-weight:500;
            letter-spacing:0.5px;
        }
        .header .title span { color:rgba(0,0,0,0.2); }

        /* ===== 页脚（毛玻璃） ===== */
        .footer {
            position:fixed;
            bottom:0;
            left:0;
            right:0;
            z-index:10;
            padding:10px 20px;
            display:flex;
            align-items:center;
            justify-content:center;
            background:rgba(255,255,255,0.70);
            backdrop-filter:blur(12px);
            -webkit-backdrop-filter:blur(12px);
            border-top:1px solid rgba(0,0,0,0.04);
        }
        .footer .text {
            color:rgba(0,0,0,0.25);
            font-size:0.75rem;
            letter-spacing:0.5px;
        }
        .footer .text .love { color:rgba(239,68,68,0.15); }
        .footer .text .highlight { color:#216E39; }

        /* ===== 工具容器（毛玻璃卡片） ===== */
        .game-wrapper {
            background:rgba(255,255,255,0.85);
            backdrop-filter:blur(8px);
            -webkit-backdrop-filter:blur(8px);
            border-radius:20px;
            padding:16px;
            box-shadow:0 4px 40px rgba(0,0,0,0.04);
            border:1px solid rgba(0,0,0,0.04);
            max-width:480px;
            width:100%;
        }
        .tool-header {
            display:flex;
            justify-content:space-between;
            align-items:center;
            padding:0 6px 12px 6px;
            color:#1a1a1a;
            font-weight:700;
            font-size:1.0rem;
        }
        .tool-header .title-tag {
            color:rgba(0,0,0,0.3);
            font-size:0.9rem;
            font-weight:400;
        }

        /* ===== 内部容器 ===== */
        .tool-container {
            position:relative;
            width:100%;
            border-radius:16px;
            overflow:hidden;
            background:#15132b;
            box-shadow:inset 0 0 60px rgba(0,0,0,0.3);
            padding:16px;
        }

        /* ===== 模式标签（深色主题内保持） ===== */
        .mode-tabs {
            display:flex;
            gap:4px;
            margin-bottom:10px;
        }
        .mode-tabs button {
            padding:4px 12px;
            border:1px solid rgba(255,255,255,0.06);
            border-radius:20px;
            background:rgba(255,255,255,0.04);
            color:rgba(255,255,255,0.3);
            font-size:0.65rem;
            cursor:pointer;
            transition:all 0.3s;
            font-weight:600;
            font-family:'MiSans', 'Segoe UI', sans-serif;
        }
        .mode-tabs button.active {
            background:rgba(64,196,99,0.15);
            border-color:rgba(64,196,99,0.25);
            color:#4ade80;
        }
        .mode-tabs button:active { transform:scale(0.94); }

        /* ===== 输入框（深色主题内保持） ===== */
        .tool-container textarea {
            width:100%;
            min-height:80px;
            background:rgba(255,255,255,0.06);
            border:1px solid rgba(255,255,255,0.08);
            border-radius:10px;
            padding:10px 12px;
            color:#d4d4d4;
            font-size:0.85rem;
            font-family:'MiSans', 'Consolas', 'Courier New', monospace;
            resize:vertical;
            outline:none;
            transition:border-color 0.3s;
            line-height:1.7;
        }
        .tool-container textarea:focus { border-color:rgba(64,196,99,0.3); }
        .tool-container textarea::placeholder { color:rgba(255,255,255,0.15); }

        /* ===== 结果区域（深色主题内保持） ===== */
        .encode-result {
            background:rgba(255,255,255,0.04);
            border:1px solid rgba(255,255,255,0.06);
            border-radius:10px;
            padding:10px 12px;
            margin-top:8px;
            color:#4ade80;
            font-family:'MiSans', 'Consolas', 'Courier New', monospace;
            font-size:0.75rem;
            word-break:break-all;
            min-height:40px;
            max-height:100px;
            overflow-y:auto;
            line-height:1.7;
        }
        .encode-result .empty {
            color:rgba(255,255,255,0.12);
            font-style:italic;
        }
        .encode-result .error {
            color:#f87171;
        }

        /* ===== 按钮组 ===== */
        .btn-group {
            display:flex;
            gap:6px;
            margin-top:8px;
            flex-wrap:wrap;
        }
        .btn-group button {
            padding:6px 14px;
            border:none;
            border-radius:8px;
            font-size:0.7rem;
            font-weight:600;
            cursor:pointer;
            transition:transform 0.15s, opacity 0.2s;
            color:#fff;
            flex:1;
            min-width:50px;
            font-family:'MiSans', 'Segoe UI', sans-serif;
        }
        .btn-group button:active { transform:scale(0.94); }
        .btn-group button:hover { opacity:0.85; }
        .btn-group .btn-encode {
            background:linear-gradient(135deg, #7c3aed, #a29bfe);
        }
        .btn-group .btn-decode {
            background:linear-gradient(135deg, #f59e0b, #f97316);
        }
        .btn-group .btn-copy {
            background:rgba(74,222,128,0.15);
            border:1px solid rgba(74,222,128,0.1);
            color:#4ade80;
        }
        .btn-group .btn-clear {
            background:rgba(255,255,255,0.08);
            border:1px solid rgba(255,255,255,0.06);
            color:rgba(255,255,255,0.4);
        }

        /* ===== 说明 ===== */
        .how-to-play {
            background:rgba(0,0,0,0.04);
            border-radius:12px;
            padding:10px 14px;
            margin-top:10px;
            color:rgba(0,0,0,0.4);
            font-size:0.75rem;
            line-height:1.6;
            text-align:center;
            border:1px solid rgba(0,0,0,0.04);
        }
        .how-to-play strong { color:rgba(0,0,0,0.6); }

        /* ===== 移动端适配 ===== */
        @media (max-width: 640px) {
            body { padding-top:60px; padding-bottom:60px; }
            .game-wrapper { padding:12px; }
            .tool-header { font-size:0.85rem; }
            .tool-container { padding:12px; }
            .tool-container textarea { min-height:60px; font-size:0.8rem; padding:8px 10px; }
            .encode-result { font-size:0.65rem; min-height:32px; max-height:80px; padding:8px 10px; }
            .btn-group button { font-size:0.6rem; padding:4px 10px; }
            .mode-tabs button { font-size:0.55rem; padding:3px 10px; }
            .how-to-play { font-size:0.7rem; padding:8px 10px; }
        }
        @media (max-width: 380px) {
            .btn-group button { font-size:0.55rem; padding:4px 6px; min-width:40px; }
            .mode-tabs button { font-size:0.5rem; padding:2px 8px; }
        }
    </style>
</head>
<body>

<!-- ===== 加载动画 ===== -->
<div id="loader">
    <div class="logo">🔤</div>
    <div class="loader-text">槐序<span>Lab</span>-槐序实验室</div>
    <div class="loading-status">加载中...</div>
    <div class="loader-bar"><div class="fill"></div></div>
</div>

<!-- ===== 页眉 ===== -->
<header class="header">
    <a href="https://lab.lruriawa.top/" class="brand">
        <span class="logo-icon">🧪</span>
        <span class="brand-text">槐序Lab实验室</span>
    </a>
    <span class="title">🔤 编码转换</span>
    <a href="https://lab.lruriawa.top/release/home.html" class="nav-link primary">🏠 首页</a>
</header>

<!-- ===== 工具主体 ===== -->
<div class="game-wrapper">
    <div class="tool-header">
        <span style="opacity:0.5;">🔤</span>
        <span class="title-tag">编码转换器</span>
    </div>

    <div class="tool-container">
        <div class="mode-tabs">
            <button class="active" data-mode="base64">Base64</button>
            <button data-mode="url">URL编码</button>
            <button data-mode="hex">Hex</button>
            <button data-mode="unicode">Unicode</button>
        </div>

        <textarea id="encodeInput" placeholder="输入要编码/解码的文本...">槐序Lab 实验室 🧪</textarea>

        <div class="encode-result" id="encodeResult">
            <span class="empty">点击「编码」或「解码」</span>
        </div>

        <div class="btn-group">
            <button class="btn-encode" id="encodeBtn">🔒 编码</button>
            <button class="btn-decode" id="decodeBtn">🔓 解码</button>
            <button class="btn-copy" id="copyBtn">📋 复制</button>
            <button class="btn-clear" id="clearBtn">✕ 清空</button>
        </div>
    </div>

    <div class="how-to-play">
        <strong>🔤 编码转换器：</strong>
        Base64 · URL编码 · Hex · Unicode 互转
    </div>
</div>

<!-- ===== 页脚 ===== -->
<footer class="footer">
    <span class="text">
        🧪 槐序Lab实验室 · 编码转换 &nbsp;|&nbsp; <span class="highlight">❤️ Design by DeepSeek</span>
        &nbsp;&nbsp;<span class="love">❤️</span>
    </span>
</footer>

<script>
    // ===== 加载动画隐藏（2.5秒，与统一风格一致） =====
    document.addEventListener('DOMContentLoaded', function() {
        setTimeout(function() { document.getElementById('loader').classList.add('hide'); }, 2500);
    });
    if (document.readyState !== 'loading') {
        setTimeout(function() { document.getElementById('loader').classList.add('hide'); }, 2500);
    }

    // ===== 以下为编码转换核心逻辑，完整保留，未作任何修改 =====
    let currentMode = 'base64';
    const input = document.getElementById('encodeInput');
    const result = document.getElementById('encodeResult');

    // 模式切换
    document.querySelectorAll('.mode-tabs button').forEach(btn => {
        btn.addEventListener('click', function() {
            document.querySelectorAll('.mode-tabs button').forEach(b => b.classList.remove('active'));
            this.classList.add('active');
            currentMode = this.dataset.mode;
            result.innerHTML = '<span class="empty">切换模式，重新编码/解码</span>';
        });
    });

    function encodeText(text, mode) {
        try {
            switch (mode) {
                case 'base64':
                    return btoa(unescape(encodeURIComponent(text)));
                case 'url':
                    return encodeURIComponent(text);
                case 'hex':
                    return text.split('').map(c => c.charCodeAt(0).toString(16).padStart(2, '0')).join(' ');
                case 'unicode':
                    return text.split('').map(c => '\\u' + c.charCodeAt(0).toString(16).padStart(4, '0')).join('');
                default:
                    return text;
            }
        } catch (e) {
            return '❌ 编码错误: ' + e.message;
        }
    }

    function decodeText(text, mode) {
        try {
            switch (mode) {
                case 'base64':
                    return decodeURIComponent(escape(atob(text)));
                case 'url':
                    return decodeURIComponent(text);
                case 'hex':
                    return text.split(' ').map(h => String.fromCharCode(parseInt(h, 16))).join('');
                case 'unicode':
                    return text.replace(/\\u([0-9a-fA-F]{4})/g, (_, h) => String.fromCharCode(parseInt(h, 16)));
                default:
                    return text;
            }
        } catch (e) {
            return '❌ 解码错误: ' + e.message;
        }
    }

    function doEncode() {
        const text = input.value;
        if (!text) { result.innerHTML = '<span class="empty">⚠️ 请输入内容</span>'; return; }
        result.innerHTML = encodeText(text, currentMode);
        result.className = 'encode-result';
    }

    function doDecode() {
        const text = input.value;
        if (!text) { result.innerHTML = '<span class="empty">⚠️ 请输入内容</span>'; return; }
        result.innerHTML = decodeText(text, currentMode);
        result.className = 'encode-result';
    }

    document.getElementById('encodeBtn').addEventListener('click', doEncode);
    document.getElementById('decodeBtn').addEventListener('click', doDecode);

    document.getElementById('copyBtn').addEventListener('click', function() {
        const text = result.textContent;
        if (!text || text.includes('⚠️') || text.includes('❌')) {
            return;
        }
        navigator.clipboard.writeText(text).then(() => {
            const orig = result.innerHTML;
            result.innerHTML = '<span style="color:#4ade80;">✅ 已复制</span>';
            setTimeout(() => { result.innerHTML = orig; }, 1500);
        }).catch(() => {
            const range = document.createRange();
            range.selectNode(result);
            window.getSelection().removeAllRanges();
            window.getSelection().addRange(range);
            document.execCommand('copy');
            const orig = result.innerHTML;
            result.innerHTML = '<span style="color:#4ade80;">✅ 已复制</span>';
            setTimeout(() => { result.innerHTML = orig; }, 1500);
        });
    });

    document.getElementById('clearBtn').addEventListener('click', function() {
        input.value = '';
        result.innerHTML = '<span class="empty">清空完成</span>';
    });

    // 快捷键: Ctrl+Enter 编码
    input.addEventListener('keydown', function(e) {
        if ((e.ctrlKey || e.metaKey) && e.key === 'Enter') {
            e.preventDefault();
            doEncode();
        }
    });
</script>
</body>
</html>
