<!DOCTYPE html>
<html lang="zh">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<title>🔢 计算器-槐序Lab-槐序实验室</title>
<link rel="icon" type="image/png" href="../tx.png">
<link href="https://cdn.jsdelivr.net/gh/webfontworld/misans/MiSans.css" rel="stylesheet">
<style>
  * { margin:0; padding:0; box-sizing:border-box; user-select:none; -webkit-tap-highlight-color:transparent; font-family:'MiSans', 'Segoe UI', system-ui, sans-serif; }
  body {
    background: #f5f7f5;
    background: linear-gradient(145deg, #f0f4f0 0%, #e8eee8 50%, #f5f7f5 100%);
    display:flex;
    justify-content:center;
    align-items:center;
    min-height:100vh;
    padding:10px;
    padding-top:70px;
    padding-bottom:70px;
    position:relative;
  }

  /* ===== 加载动画（统一风格） ===== */
  #loader {
    position:fixed;
    top:0; left:0; right:0; bottom:0;
    background: #f5f7f5;
    display:flex;
    flex-direction:column;
    justify-content:center;
    align-items:center;
    z-index:9999;
    transition:opacity 0.6s ease-out;
  }
  #loader.hide { opacity:0; pointer-events:none; }
  #loader .logo { font-size:5.5rem; animation: loaderPulse 1.2s ease-in-out infinite; margin-bottom:14px; }
  #loader .loader-text { color:rgba(0,0,0,0.3); font-size:1.6rem; letter-spacing:4px; font-weight:400; margin-bottom:20px; }
  #loader .loader-text span { color:#40C463; font-weight:600; }
  #loader .loading-status { color:rgba(0,0,0,0.15); font-size:1rem; letter-spacing:2px; margin-bottom:16px; animation: loadingDot 1.6s ease-in-out infinite; }
  @keyframes loadingDot { 0%,100% { opacity:0.3; } 50% { opacity:1; } }
  #loader .loader-bar { width:200px; height:4px; background:rgba(0,0,0,0.06); border-radius:4px; overflow:hidden; position:relative; }
  #loader .loader-bar .fill { position:absolute; left:0; top:0; height:100%; width:0%; background:linear-gradient(90deg, #216E39, #40C463, #9BE9A8); border-radius:4px; animation: loaderFill 2.5s ease-in-out forwards; }
  @keyframes loaderPulse { 0%,100% { transform:scale(1); } 50% { transform:scale(1.08); } }
  @keyframes loaderFill { 0% { width:0%; } 30% { width:40%; } 60% { width:75%; } 100% { width:100%; } }

  /* ===== 页眉（毛玻璃） ===== */
  .header {
    position:fixed;
    top:0;
    left:0;
    right:0;
    z-index:10;
    padding:0 20px;
    height:56px;
    display:flex;
    align-items:center;
    justify-content:space-between;
    background:rgba(255,255,255,0.85);
    backdrop-filter:blur(16px);
    -webkit-backdrop-filter:blur(16px);
    border-bottom:1px solid rgba(0,0,0,0.04);
  }
  .header .brand {
    display:flex;
    align-items:center;
    gap:8px;
    text-decoration:none;
    color:#1a1a1a;
    font-weight:700;
    font-size:1.0rem;
  }
  .header .brand .logo-icon { font-size:1.4rem; }
  .header .brand .brand-text {
    background:linear-gradient(135deg, #216E39, #40C463);
    -webkit-background-clip:text;
    -webkit-text-fill-color:transparent;
    background-clip:text;
  }
  .header .nav-link {
    color:rgba(0,0,0,0.45);
    text-decoration:none;
    font-size:0.8rem;
    padding:4px 14px;
    border-radius:20px;
    transition:all 0.3s;
    border:1px solid rgba(0,0,0,0.04);
  }
  .header .nav-link:hover {
    background:rgba(0,0,0,0.04);
    color:#1a1a1a;
    border-color:rgba(0,0,0,0.1);
  }
  .header .nav-link.primary {
    background:linear-gradient(135deg, #40C463, #30A14E);
    border:none;
    color:#fff;
  }
  .header .nav-link.primary:hover { opacity:0.85; }
  .header .title {
    color:#1a1a1a;
    font-size:0.95rem;
    font-weight:500;
    letter-spacing:0.5px;
  }
  .header .title span { color:rgba(0,0,0,0.2); }

  /* ===== 页脚（毛玻璃） ===== */
  .footer {
    position:fixed;
    bottom:0;
    left:0;
    right:0;
    z-index:10;
    padding:10px 20px;
    display:flex;
    align-items:center;
    justify-content:center;
    background:rgba(255,255,255,0.70);
    backdrop-filter:blur(12px);
    -webkit-backdrop-filter:blur(12px);
    border-top:1px solid rgba(0,0,0,0.04);
  }
  .footer .text {
    color:rgba(0,0,0,0.25);
    font-size:0.75rem;
    letter-spacing:0.5px;
  }
  .footer .text .love { color:rgba(239,68,68,0.15); }
  .footer .text .highlight { color:#216E39; }

  /* ===== 工具容器（毛玻璃卡片） ===== */
  .tool-wrapper {
    background:rgba(255,255,255,0.85);
    backdrop-filter:blur(8px);
    -webkit-backdrop-filter:blur(8px);
    border-radius:20px;
    padding:16px;
    box-shadow:0 4px 40px rgba(0,0,0,0.04);
    border:1px solid rgba(0,0,0,0.04);
    max-width:400px;
    width:100%;
  }
  .tool-header {
    display:flex;
    justify-content:space-between;
    align-items:center;
    padding:0 6px 12px 6px;
    color:#1a1a1a;
    font-weight:700;
    font-size:1.0rem;
  }
  .tool-header .title-tag {
    color:rgba(0,0,0,0.3);
    font-size:0.9rem;
    font-weight:400;
  }

  /* ===== 显示屏 ===== */
  .calc-display {
    background:rgba(0,0,0,0.03);
    border-radius:16px;
    padding:16px 20px;
    margin:12px 0;
    text-align:right;
    min-height:80px;
    display:flex;
    flex-direction:column;
    justify-content:flex-end;
    border:1px solid rgba(0,0,0,0.04);
  }
  .calc-display .expression {
    color:rgba(0,0,0,0.3);
    font-size:0.9rem;
    min-height:24px;
    word-break:break-all;
    font-weight:400;
  }
  .calc-display .result {
    color:#1a1a1a;
    font-size:2.4rem;
    font-weight:300;
    font-family:'MiSans', 'Courier New', monospace;
  }

  /* ===== 按键网格 ===== */
  .calc-grid {
    display:grid;
    grid-template-columns:repeat(4,1fr);
    gap:8px;
  }
  .calc-grid button {
    padding:16px;
    border:none;
    border-radius:12px;
    font-size:1.3rem;
    font-weight:600;
    cursor:pointer;
    transition:all 0.15s;
    background:rgba(0,0,0,0.03);
    color:#1a1a1a;
    font-family:'MiSans', 'Segoe UI', sans-serif;
    border:1px solid rgba(0,0,0,0.04);
  }
  .calc-grid button:active {
    transform:scale(0.94);
    background:rgba(0,0,0,0.06);
  }
  .calc-grid button:hover { background:rgba(0,0,0,0.05); }
  .calc-grid .op {
    background:rgba(33,110,57,0.06);
    color:#216E39;
    border-color:rgba(33,110,57,0.08);
  }
  .calc-grid .op:hover { background:rgba(33,110,57,0.10); }
  .calc-grid .op:active { background:rgba(33,110,57,0.14); }
  .calc-grid .eq {
    background:linear-gradient(135deg, #40C463, #30A14E);
    color:#fff;
    border:none;
  }
  .calc-grid .eq:hover { opacity:0.9; }
  .calc-grid .eq:active { opacity:0.8; }
  .calc-grid .clear {
    background:rgba(231,76,60,0.06);
    color:#e74c3c;
    border-color:rgba(231,76,60,0.08);
  }
  .calc-grid .clear:hover { background:rgba(231,76,60,0.10); }
  .calc-grid .clear:active { background:rgba(231,76,60,0.14); }
  .calc-grid .span2 { grid-column:span 2; }

  /* ===== 说明 ===== */
  .how-to-play {
    background:rgba(0,0,0,0.04);
    border-radius:12px;
    padding:10px 14px;
    margin-top:12px;
    color:rgba(0,0,0,0.4);
    font-size:0.85rem;
    line-height:1.6;
    text-align:center;
  }
  .how-to-play strong { color:rgba(0,0,0,0.6); }

  /* ===== 移动端适配 ===== */
  @media (max-width: 640px) {
    body { padding-top:60px; padding-bottom:60px; }
    .tool-wrapper { padding:12px; }
    .tool-header { font-size:0.85rem; }
    .calc-display .result { font-size:2rem; }
    .calc-grid button { padding:14px; font-size:1.1rem; }
    .calc-grid { gap:6px; }
    .how-to-play { font-size:0.75rem; padding:8px 10px; }
  }
  @media (max-width: 400px) {
    .calc-grid button { padding:12px; font-size:1rem; }
    .calc-display .result { font-size:1.6rem; }
  }
</style>
</head>
<body>

<!-- ===== 加载动画 ===== -->
<div id="loader">
  <div class="logo">🔢</div>
  <div class="loader-text">槐序<span>Lab</span>-槐序实验室</div>
  <div class="loading-status">加载中...</div>
  <div class="loader-bar"><div class="fill"></div></div>
</div>

<!-- ===== 页眉 ===== -->
<header class="header">
  <a href="https://lab.lruriawa.top/" class="brand">
    <span class="logo-icon">🧪</span>
    <span class="brand-text">槐序Lab实验室</span>
  </a>
  <span class="title">🔢 计算器</span>
  <a href="https://lab.lruriawa.top/release/home.html" class="nav-link primary">🏠 首页</a>
</header>

<!-- ===== 工具主体 ===== -->
<div class="tool-wrapper">
  <div class="tool-header">
    <span style="opacity:0.5;">🔢</span>
    <span class="title-tag">计算器</span>
  </div>

  <div class="calc-display">
    <div class="expression" id="expression"></div>
    <div class="result" id="result">0</div>
  </div>

  <div class="calc-grid">
    <button class="clear" data-v="C">C</button>
    <button data-v="±">±</button>
    <button data-v="%">%</button>
    <button class="op" data-v="÷">÷</button>
    <button data-v="7">7</button>
    <button data-v="8">8</button>
    <button data-v="9">9</button>
    <button class="op" data-v="×">×</button>
    <button data-v="4">4</button>
    <button data-v="5">5</button>
    <button data-v="6">6</button>
    <button class="op" data-v="-">−</button>
    <button data-v="1">1</button>
    <button data-v="2">2</button>
    <button data-v="3">3</button>
    <button class="op" data-v="+">+</button>
    <button data-v="0" class="span2">0</button>
    <button data-v=".">.</button>
    <button class="eq" data-v="=">=</button>
  </div>

  <div class="how-to-play">
    <strong>💡 使用：</strong> 点击按钮输入 · 支持四则运算 · C 清空 · = 计算结果
  </div>
</div>

<!-- ===== 页脚 ===== -->
<footer class="footer">
  <span class="text">
    🧪 槐序Lab实验室 · 计算器 &nbsp;|&nbsp; <span class="highlight">❤️ Design by DeepSeek</span>
    &nbsp;&nbsp;<span class="love">❤️</span>
  </span>
</footer>

<script>
// ===== 加载动画隐藏（2.5秒，与统一风格一致） =====
document.addEventListener('DOMContentLoaded', function() {
    setTimeout(function() { document.getElementById('loader').classList.add('hide'); }, 2500);
});
if (document.readyState !== 'loading') {
    setTimeout(function() { document.getElementById('loader').classList.add('hide'); }, 2500);
}

// ===== 以下为计算器核心逻辑，完整保留，未作任何修改 =====
const resultEl = document.getElementById('result');
const exprEl = document.getElementById('expression');
let display = '0';
let expression = '';
let lastResult = null;

function updateDisplay() {
  resultEl.textContent = display;
  exprEl.textContent = expression;
}

function handleInput(v) {
  if (v === 'C') {
    display = '0';
    expression = '';
    lastResult = null;
    updateDisplay();
    return;
  }
  if (v === '±') {
    if (display !== '0') {
      display = display.startsWith('-') ? display.slice(1) : '-' + display;
      updateDisplay();
      return;
    }
  }
  if (v === '%') {
    const num = parseFloat(display);
    if (!isNaN(num)) {
      display = String(num / 100);
      updateDisplay();
      return;
    }
  }
  if ('+-×÷'.includes(v)) {
    if (expression && !'+-×÷'.includes(expression.slice(-1))) {
      expression += display;
    } else if (!expression) {
      expression = display;
    }
    expression += v;
    display = '0';
    updateDisplay();
    return;
  }
  if (v === '=') {
    try {
      let expr = expression + display;
      expr = expr.replace(/×/g, '*').replace(/÷/g, '/').replace(/−/g, '-');
      const result = Function('"use strict"; return (' + expr + ')')();
      lastResult = result;
      expression = '';
      display = String(parseFloat(result.toFixed(10)));
      updateDisplay();
      return;
    } catch(e) {
      display = '错误';
      updateDisplay();
      return;
    }
  }
  if (v === '.' && display.includes('.')) return;
  if (display === '0' && v !== '.') display = v;
  else display += v;
  updateDisplay();
}

document.querySelectorAll('.calc-grid button[data-v]').forEach(btn => {
  btn.addEventListener('click', function() {
    handleInput(this.dataset.v);
  });
});
</script>
</body>
</html>
