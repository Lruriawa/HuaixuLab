<!DOCTYPE html>
<html lang="zh">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<title>🧩 数字华容道-槐序Lab-槐序实验室</title>
<link rel="icon" type="image/png" href="../tx.png">
<link href="https://cdn.jsdelivr.net/gh/webfontworld/misans/MiSans.css" rel="stylesheet">
<style>
  * { margin:0; padding:0; box-sizing:border-box; touch-action:none; user-select:none; -webkit-tap-highlight-color:transparent; font-family:'MiSans', 'Segoe UI', system-ui, sans-serif; }
  body {
    background: #f5f7f5;
    background: linear-gradient(145deg, #f0f4f0 0%, #e8eee8 50%, #f5f7f5 100%);
    display:flex;
    justify-content:center;
    align-items:center;
    min-height:100vh;
    padding:10px;
    padding-top:70px;
    padding-bottom:70px;
    position:relative;
  }

  /* ===== 加载动画（统一风格） ===== */
  #loader {
    position:fixed;
    top:0; left:0; right:0; bottom:0;
    background: #f5f7f5;
    display:flex;
    flex-direction:column;
    justify-content:center;
    align-items:center;
    z-index:9999;
    transition:opacity 0.6s ease-out;
  }
  #loader.hide { opacity:0; pointer-events:none; }
  #loader .logo { font-size:5.5rem; animation: loaderPulse 1.2s ease-in-out infinite; margin-bottom:14px; }
  #loader .loader-text { color:rgba(0,0,0,0.3); font-size:1.6rem; letter-spacing:4px; font-weight:400; margin-bottom:20px; }
  #loader .loader-text span { color:#40C463; font-weight:600; }
  #loader .loading-status { color:rgba(0,0,0,0.15); font-size:1rem; letter-spacing:2px; margin-bottom:16px; animation: loadingDot 1.6s ease-in-out infinite; }
  @keyframes loadingDot { 0%,100% { opacity:0.3; } 50% { opacity:1; } }
  #loader .loader-bar { width:200px; height:4px; background:rgba(0,0,0,0.06); border-radius:4px; overflow:hidden; position:relative; }
  #loader .loader-bar .fill { position:absolute; left:0; top:0; height:100%; width:0%; background:linear-gradient(90deg, #216E39, #40C463, #9BE9A8); border-radius:4px; animation: loaderFill 2.5s ease-in-out forwards; }
  @keyframes loaderPulse { 0%,100% { transform:scale(1); } 50% { transform:scale(1.08); } }
  @keyframes loaderFill { 0% { width:0%; } 30% { width:40%; } 60% { width:75%; } 100% { width:100%; } }

  /* ===== 页眉（毛玻璃） ===== */
  .header {
    position:fixed;
    top:0;
    left:0;
    right:0;
    z-index:10;
    padding:0 20px;
    height:56px;
    display:flex;
    align-items:center;
    justify-content:space-between;
    background:rgba(255,255,255,0.85);
    backdrop-filter:blur(16px);
    -webkit-backdrop-filter:blur(16px);
    border-bottom:1px solid rgba(0,0,0,0.04);
  }
  .header .brand {
    display:flex;
    align-items:center;
    gap:8px;
    text-decoration:none;
    color:#1a1a1a;
    font-weight:700;
    font-size:1.0rem;
  }
  .header .brand .logo-icon { font-size:1.4rem; }
  .header .brand .brand-text {
    background:linear-gradient(135deg, #216E39, #40C463);
    -webkit-background-clip:text;
    -webkit-text-fill-color:transparent;
    background-clip:text;
  }
  .header .nav-link {
    color:rgba(0,0,0,0.45);
    text-decoration:none;
    font-size:0.8rem;
    padding:4px 14px;
    border-radius:20px;
    transition:all 0.3s;
    border:1px solid rgba(0,0,0,0.04);
  }
  .header .nav-link:hover {
    background:rgba(0,0,0,0.04);
    color:#1a1a1a;
    border-color:rgba(0,0,0,0.1);
  }
  .header .nav-link.primary {
    background:linear-gradient(135deg, #40C463, #30A14E);
    border:none;
    color:#fff;
  }
  .header .nav-link.primary:hover { opacity:0.85; }
  .header .title {
    color:#1a1a1a;
    font-size:0.95rem;
    font-weight:500;
    letter-spacing:0.5px;
  }
  .header .title span { color:rgba(0,0,0,0.2); }

  /* ===== 页脚（毛玻璃） ===== */
  .footer {
    position:fixed;
    bottom:0;
    left:0;
    right:0;
    z-index:10;
    padding:10px 20px;
    display:flex;
    align-items:center;
    justify-content:center;
    background:rgba(255,255,255,0.70);
    backdrop-filter:blur(12px);
    -webkit-backdrop-filter:blur(12px);
    border-top:1px solid rgba(0,0,0,0.04);
  }
  .footer .text {
    color:rgba(0,0,0,0.25);
    font-size:0.75rem;
    letter-spacing:0.5px;
  }
  .footer .text .love { color:rgba(239,68,68,0.15); }
  .footer .text .highlight { color:#216E39; }

  /* ===== 游戏容器（毛玻璃卡片） ===== */
  .game-wrapper {
    background:rgba(255,255,255,0.85);
    backdrop-filter:blur(8px);
    -webkit-backdrop-filter:blur(8px);
    border-radius:20px;
    padding:16px;
    box-shadow:0 4px 40px rgba(0,0,0,0.04);
    border:1px solid rgba(0,0,0,0.04);
    max-width:420px;
    width:100%;
  }
  .game-header {
    display:flex;
    justify-content:space-between;
    align-items:center;
    padding:0 6px 12px 6px;
    color:#1a1a1a;
    font-weight:700;
    font-size:1.0rem;
  }
  .game-header .score {
    background:rgba(0,0,0,0.06);
    padding:4px 14px;
    border-radius:30px;
    font-size:0.95rem;
    color:#1a1a1a;
  }

  .canvas-wrap {
    position:relative;
    width:100%;
    aspect-ratio:1/1;
    border-radius:16px;
    overflow:hidden;
    background:#ffffff;
    box-shadow:inset 0 0 60px rgba(0,0,0,0.02);
  }
  canvas { display:block; width:100%; height:100%; cursor:pointer; touch-action:none; }

  .how-to-play {
    background:rgba(0,0,0,0.04);
    border-radius:12px;
    padding:10px 14px;
    margin-top:10px;
    color:rgba(0,0,0,0.5);
    font-size:0.95rem;
    line-height:1.6;
    text-align:center;
  }
  .how-to-play strong { color:#1a1a1a; }

  .overlay {
    position:absolute; top:0; left:0; right:0; bottom:0;
    background:rgba(0,0,0,0.55); backdrop-filter:blur(6px);
    display:flex; flex-direction:column; justify-content:center; align-items:center;
    color:#fff; opacity:0; pointer-events:none; transition:opacity 0.4s; border-radius:16px;
    z-index:10;
  }
  .overlay.show { opacity:1; pointer-events:auto; }
  .overlay h2 { font-size:2.4rem; margin-bottom:6px; }
  .overlay .sub-text { font-size:1.2rem; opacity:0.7; margin-bottom:16px; }
  .overlay .btn-group { display:flex; gap:12px; flex-wrap:wrap; justify-content:center; }
  .overlay button {
    padding:12px 30px; border:none; border-radius:40px; font-size:1.2rem; font-weight:700;
    cursor:pointer; transition:transform 0.2s;
  }
  .overlay button:active { transform:scale(0.94); }
  .btn-start { background:linear-gradient(135deg, #4CAF50, #2ECC71); color:#fff; box-shadow:0 4px 20px rgba(46,204,113,0.4); }
  .btn-restart { background:linear-gradient(135deg, #FF6B6B, #EE5A24); color:#fff; box-shadow:0 4px 20px rgba(238,90,36,0.4); }
  .btn-home { background:rgba(255,255,255,0.2); color:#fff; border:1px solid rgba(255,255,255,0.2); }

  @media (max-width: 640px) {
    body { padding-top:60px; padding-bottom:60px; }
    .game-wrapper { padding:12px; }
    .game-header { font-size:0.85rem; }
    .game-header .score { font-size:0.8rem; padding:2px 10px; }
    .how-to-play { font-size:0.8rem; padding:8px 10px; }
    .overlay h2 { font-size:2rem; }
    .overlay .sub-text { font-size:1rem; }
    .overlay button { padding:10px 24px; font-size:1rem; }
  }
</style>
</head>
<body>

<!-- ===== 加载动画 ===== -->
<div id="loader">
  <div class="logo">🧩</div>
  <div class="loader-text">槐序<span>Lab</span>-槐序实验室</div>
  <div class="loading-status">加载中...</div>
  <div class="loader-bar"><div class="fill"></div></div>
</div>

<!-- ===== 页眉 ===== -->
<header class="header">
  <a href="https://lab.lruriawa.top/" class="brand">
    <span class="logo-icon">🧪</span>
    <span class="brand-text">槐序Lab实验室</span>
  </a>
  <span class="title">🧩 数字华容道</span>
  <a href="https://lab.lruriawa.top/release/home.html" class="nav-link primary">🏠 首页</a>
</header>

<!-- ===== 游戏主体 ===== -->
<div class="game-wrapper">
  <div class="game-header">
    <span style="opacity:0.5;">🧩</span>
    <span class="score">步数 <span id="scoreDisplay">0</span></span>
  </div>
  <div class="canvas-wrap">
    <canvas id="gameCanvas"></canvas>
    <div class="overlay show" id="startOverlay">
      <h2>🧩 数字华容道</h2>
      <p class="sub-text">点击数字移动到空白格</p>
      <div class="btn-group">
        <button class="btn-start" id="startBtn">🚀 开始游戏</button>
        <button class="btn-home" id="homeBtn">🏠 返回首页</button>
      </div>
    </div>
    <div class="overlay" id="gameOverOverlay">
      <h2>🎉 恭喜完成！</h2>
      <p class="sub-text">步数：<span id="finalScore">0</span></p>
      <div class="btn-group">
        <button class="btn-restart" id="restartBtn">🔄 再来一局</button>
        <button class="btn-home" id="homeBtn2">🏠 返回首页</button>
      </div>
    </div>
  </div>
  <div class="how-to-play">
    <strong>🎯 玩法：</strong>
    👆 点击数字块，它会和空白格交换位置，
    按 1-15 顺序排好就赢啦！
  </div>
</div>

<!-- ===== 页脚 ===== -->
<footer class="footer">
  <span class="text">
    🧪 槐序Lab实验室 · 数字华容道 &nbsp;|&nbsp; <span class="highlight">❤️ Design by DeepSeek</span>
    &nbsp;&nbsp;<span class="love">❤️</span>
  </span>
</footer>

<script>
// ===== 加载动画隐藏（2.5秒，与统一风格一致） =====
document.addEventListener('DOMContentLoaded', function() {
    setTimeout(function() {
        document.getElementById('loader').classList.add('hide');
    }, 2500);
});
if (document.readyState !== 'loading') {
    setTimeout(function() {
        document.getElementById('loader').classList.add('hide');
    }, 2500);
}

// ===== 以下为游戏核心逻辑，仅修改画布背景适配白色 =====
const canvas = document.getElementById('gameCanvas');
const ctx = canvas.getContext('2d');
const scoreSpan = document.getElementById('scoreDisplay');
const finalScoreSpan = document.getElementById('finalScore');
const startOverlay = document.getElementById('startOverlay');
const gameOverOverlay = document.getElementById('gameOverOverlay');
const startBtn = document.getElementById('startBtn');
const restartBtn = document.getElementById('restartBtn');
const homeBtns = document.querySelectorAll('.btn-home, #homeBtn, #homeBtn2');

let W, H, SIZE;
function resizeCanvas() {
  const rect = canvas.parentElement.getBoundingClientRect();
  const size = Math.min(rect.width, rect.height);
  canvas.width = size;
  canvas.height = size;
  canvas.style.width = '100%';
  canvas.style.height = '100%';
  W = canvas.width;
  H = canvas.height;
  SIZE = W / 4;
}
resizeCanvas();
window.addEventListener('resize', resizeCanvas);

let board = [];
let emptyRow = 3, emptyCol = 3;
let moves = 0;
let gameFinished = false;
let started = false;

function initBoard() {
  let arr = Array.from({length: 15}, (_, i) => i + 1);
  arr.push(0);
  do {
    for (let i = arr.length - 1; i > 0; i--) {
      let j = Math.floor(Math.random() * (i + 1));
      [arr[i], arr[j]] = [arr[j], arr[i]];
    }
  } while (!isSolvable(arr));
  board = [];
  for (let r = 0; r < 4; r++) board.push(arr.slice(r * 4, r * 4 + 4));
  for (let r = 0; r < 4; r++) for (let c = 0; c < 4; c++) if (board[r][c] === 0) { emptyRow = r; emptyCol = c; }
}

function isSolvable(arr) {
  let inv = 0, row = 0;
  for (let i = 0; i < 16; i++) {
    if (arr[i] === 0) { row = Math.floor(i / 4); continue; }
    for (let j = i + 1; j < 16; j++) {
      if (arr[j] !== 0 && arr[i] > arr[j]) inv++;
    }
  }
  return (inv + (4 - row)) % 2 === 0;
}

function reset() {
  initBoard();
  moves = 0;
  gameFinished = false;
  started = false;
  gameOverOverlay.classList.remove('show');
  startOverlay.classList.add('show');
  updateUI();
}

function startGame() {
  reset();
  started = true;
  startOverlay.classList.remove('show');
}

function updateUI() { scoreSpan.textContent = moves; }

function onTileClick(r, c) {
  if (gameFinished || !started) return;
  const dr = Math.abs(r - emptyRow);
  const dc = Math.abs(c - emptyCol);
  if ((dr === 1 && dc === 0) || (dr === 0 && dc === 1)) {
    board[emptyRow][emptyCol] = board[r][c];
    board[r][c] = 0;
    emptyRow = r;
    emptyCol = c;
    moves++;
    updateUI();
    checkWin();
  }
}

function checkWin() {
  let flag = true, idx = 1;
  for (let r = 0; r < 4; r++) {
    for (let c = 0; c < 4; c++) {
      if (r === 3 && c === 3) {
        if (board[r][c] !== 0) flag = false;
      } else {
        if (board[r][c] !== idx) flag = false;
        idx++;
      }
    }
  }
  if (flag) {
    gameFinished = true;
    finalScoreSpan.textContent = moves;
    gameOverOverlay.classList.add('show');
  }
}

function getPos(clientX, clientY) {
  const rect = canvas.getBoundingClientRect();
  const scaleX = canvas.width / rect.width;
  const scaleY = canvas.height / rect.height;
  const x = (clientX - rect.left) * scaleX;
  const y = (clientY - rect.top) * scaleY;
  return { r: Math.floor(y / SIZE), c: Math.floor(x / SIZE) };
}

canvas.addEventListener('click', (e) => {
  const pos = getPos(e.clientX, e.clientY);
  if (pos.r >= 0 && pos.r < 4 && pos.c >= 0 && pos.c < 4) onTileClick(pos.r, pos.c);
});
canvas.addEventListener('touchstart', (e) => {
  e.preventDefault();
  const touch = e.touches[0];
  const pos = getPos(touch.clientX, touch.clientY);
  if (pos.r >= 0 && pos.r < 4 && pos.c >= 0 && pos.c < 4) onTileClick(pos.r, pos.c);
}, { passive: false });

// 颜色配置 - 适配白色背景，使用更鲜明的颜色
const COLORS = [
  '#e74c3c', // 红
  '#e67e22', // 橙
  '#f1c40f', // 黄
  '#2ecc71', // 绿
  '#3498db', // 蓝
  '#9b59b6', // 紫
  '#1abc9c', // 青
  '#e84393', // 粉
  '#00b894', // 薄荷
  '#6c5ce7', // 靛蓝
  '#fd79a8', // 浅粉
  '#0984e3', // 深蓝
  '#fdcb6e', // 香槟
  '#00cec9', // 蓝绿
  '#d63031'  // 深红
];

function draw() {
  ctx.clearRect(0, 0, W, H);
  // 白色背景
  ctx.fillStyle = '#ffffff';
  ctx.fillRect(0, 0, W, H);
  
  // 绘制浅灰色网格线，让格子边界更清晰
  ctx.strokeStyle = 'rgba(0,0,0,0.04)';
  ctx.lineWidth = 1;
  for (let i = 1; i < 4; i++) {
    ctx.beginPath();
    ctx.moveTo(i * SIZE, 0);
    ctx.lineTo(i * SIZE, H);
    ctx.stroke();
    ctx.beginPath();
    ctx.moveTo(0, i * SIZE);
    ctx.lineTo(W, i * SIZE);
    ctx.stroke();
  }
  
  for (let r = 0; r < 4; r++) {
    for (let c = 0; c < 4; c++) {
      const val = board[r][c];
      const x = c * SIZE + 4, y = r * SIZE + 4;
      if (val === 0) {
        // 空格 - 极浅灰色
        ctx.fillStyle = 'rgba(0,0,0,0.02)';
        ctx.beginPath();
        ctx.roundRect(x, y, SIZE - 8, SIZE - 8, 8);
        ctx.fill();
        continue;
      }
      ctx.fillStyle = COLORS[val - 1];
      ctx.shadowBlur = 6;
      ctx.shadowColor = 'rgba(0,0,0,0.06)';
      ctx.beginPath();
      ctx.roundRect(x, y, SIZE - 8, SIZE - 8, 8);
      ctx.fill();
      ctx.shadowBlur = 0;
      // 数字使用白色，在彩色背景上清晰
      ctx.fillStyle = '#ffffff';
      ctx.font = `bold ${SIZE * 0.4}px Arial`;
      ctx.textAlign = 'center';
      ctx.textBaseline = 'middle';
      ctx.fillText(val, x + (SIZE-8)/2, y + (SIZE-8)/2 + 2);
    }
  }
}

if (!CanvasRenderingContext2D.prototype.roundRect) {
  CanvasRenderingContext2D.prototype.roundRect = function(x, y, w, h, radii) {
    const r = typeof radii === 'number' ? radii : (radii || 0);
    this.moveTo(x + r, y);
    this.arcTo(x + w, y, x + w, y + h, r);
    this.arcTo(x + w, y + h, x, y + h, r);
    this.arcTo(x, y + h, x, y, r);
    this.arcTo(x, y, x + w, y, r);
    return this;
  };
}

function loop() {
  draw();
  requestAnimationFrame(loop);
}

startBtn.addEventListener('click', startGame);
restartBtn.addEventListener('click', startGame);
homeBtns.forEach(btn => btn.addEventListener('click', () => { window.location.href = 'https://lab.lruriawa.top/release/home.html'; }));

reset();
loop();
</script>
</body>
</html>
