<!DOCTYPE html>
<html lang="zh">
<head>
<meta charset="UTF-8">

<link href="https://cdn.jsdelivr.net/gh/webfontworld/misans/MiSans.css" rel="stylesheet">
<style>
  * { margin:0; padding:0; box-sizing:border-box; touch-action:none; user-select:none; -webkit-tap-highlight-color:transparent; font-family:'MiSans', 'Segoe UI', system-ui, sans-serif; }
  body {
    background: #f5f7f5;
    background: linear-gradient(145deg, #f0f4f0 0%, #e8eee8 50%, #f5f7f5 100%);
    display:flex;
    justify-content:center;
    align-items:center;
    min-height:100vh;
    padding:10px;
    padding-top:70px;
    padding-bottom:70px;
    position:relative;
  }

  /* ===== 加载动画（统一风格） ===== */
  #loader {
    position:fixed;
    top:0; left:0; right:0; bottom:0;
    background: #f5f7f5;
    display:flex;
    flex-direction:column;
    justify-content:center;
    align-items:center;
    z-index:9999;
    transition:opacity 0.6s ease-out;
  }
  #loader.hide { opacity:0; pointer-events:none; }
  #loader .logo { font-size:5.5rem; animation: loaderPulse 1.2s ease-in-out infinite; margin-bottom:14px; }
  #loader .loader-text { color:rgba(0,0,0,0.3); font-size:1.6rem; letter-spacing:4px; font-weight:400; margin-bottom:20px; }
  #loader .loader-text span { color:#40C463; font-weight:600; }
  #loader .loading-status { color:rgba(0,0,0,0.15); font-size:1rem; letter-spacing:2px; margin-bottom:16px; animation: loadingDot 1.6s ease-in-out infinite; }
  @keyframes loadingDot { 0%,100% { opacity:0.3; } 50% { opacity:1; } }
  #loader .loader-bar { width:200px; height:4px; background:rgba(0,0,0,0.06); border-radius:4px; overflow:hidden; position:relative; }
  #loader .loader-bar .fill { position:absolute; left:0; top:0; height:100%; width:0%; background:linear-gradient(90deg, #216E39, #40C463, #9BE9A8); border-radius:4px; animation: loaderFill 2.5s ease-in-out forwards; }
  @keyframes loaderPulse { 0%,100% { transform:scale(1); } 50% { transform:scale(1.08); } }
  @keyframes loaderFill { 0% { width:0%; } 30% { width:40%; } 60% { width:75%; } 100% { width:100%; } }

  /* ===== 页眉（毛玻璃） ===== */
  .header {
    position:fixed;
    top:0;
    left:0;
    right:0;
    z-index:10;
    padding:0 20px;
    height:56px;
    display:flex;
    align-items:center;
    justify-content:space-between;
    background:rgba(255,255,255,0.85);
    backdrop-filter:blur(16px);
    -webkit-backdrop-filter:blur(16px);

  }
  .header .brand {
    display:flex;
    align-items:center;
    gap:8px;
    text-decoration:none;
    color:#1a1a1a;
    font-weight:700;
    font-size:1.0rem;

  .header .brand .logo-icon { font-size:1.4rem; }
  .header .brand .brand-text {
    background:linear-gradient(135deg, #216E39, #40C463);
    -webkit-background-clip:text;
    -webkit-text-fill-color:transparent;
    background-clip:text;

  .header .nav-link {
    color:rgba(0,0,0,0.45);
    text-decoration:none;
    font-size:0.8rem;

  .header .title {

  /* ===== 页脚（毛玻璃） ===== */
  .footer {
    position:fixed;
    bottom:0;
    left:0;
    right:0;
    z-index:10;

    align-items:center;

  .footer .text {

  .footer .text .love { color:rgba(239,68,68,0.15); }

  /* ===== 游戏容器（毛玻璃卡片） ===== */
  .game-wrapper {

  .game-header .score .num { color:#216E39; font-weight:700; }

  .game-area {
    position:relative;
    width:100%;
    aspect-ratio:1/1.15;
    border-radius:18px;
    overflow:hidden;

  canvas {
    display:block;

  .toolbar {
    display:flex;
    justify-content:center;
    gap:10px;

  .toolbar button {
    padding:6px 16px;

  .toolbar button:active { transform:scale(0.92); background:rgba(0,0,0,0.08); }
  .toolbar button .icon { font-size:1rem; margin-right:4px; }

  .how-to-play {
    background:rgba(0,0,0,0.04);
    border-radius:14px;
    padding:10px 14px;
    margin-top:10px;
    color:rgba(0,0,0,0.5);
    font-size:0.85rem;
    line-height:1.6;
    text-align:center;
    border:1px solid rgba(0,0,0,0.04);
  }
  .how-to-play strong { color:#1a1a1a; }
  .how-to-play .highlight { color:#216E39; font-weight:600; }

  .overlay {
    position:absolute; top:0; left:0; right:0; bottom:0;
    background:rgba(0,0,0,0.6);
    backdrop-filter:blur(8px);
    display:flex; flex-direction:column; justify-content:center; align-items:center;
    color:#fff; opacity:0; pointer-events:none; transition:opacity 0.4s;
    border-radius:18px; z-index:10;
  }
  .overlay.show { opacity:1; pointer-events:auto; }
  .overlay .icon-big { font-size:3.5rem; margin-bottom:6px; }
  .overlay h2 { font-size:2.2rem; margin-bottom:4px; font-weight:800; }
  .overlay .sub-text { font-size:1.1rem; opacity:0.6; margin-bottom:16px; }
  .overlay .btn-group { display:flex; gap:10px; flex-wrap:wrap; justify-content:center; }
  .overlay button { padding:10px 28px; border:none; border-radius:40px; font-size:1.1rem; font-weight:700; cursor:pointer; transition:transform 0.2s; }
  .overlay button:active { transform:scale(0.94); }
  .btn-start { background:linear-gradient(135deg, #4CAF50, #2ECC71); color:#fff; box-shadow:0 6px 30px rgba(46,204,113,0.35); }
  .btn-restart { background:linear-gradient(135deg, #FF6B6B, #EE5A24); color:#fff; box-shadow:0 6px 30px rgba(238,90,36,0.35); }
  .btn-home { background:rgba(255,255,255,0.1); color:#fff; border:1px solid rgba(255,255,255,0.12); }

  @media (max-width: 640px) {
    body { padding-top:60px; padding-bottom:60px; }
    .game-wrapper { padding:12px; }
    .game-header { font-size:0.85rem; }
    .game-header .score { font-size:0.8rem; padding:2px 10px; }
    .how-to-play { font-size:0.75rem; padding:8px 10px; }
    .toolbar button { font-size:0.75rem; padding:4px 12px; }
    .overlay h2 { font-size:1.8rem; }
    .overlay .sub-text { font-size:1rem; }
    .overlay button { padding:8px 20px; font-size:1rem; }
  }
</style>

<body>

<!-- ===== 加载动画 ===== -->
<div id="loader">
  <div class="logo">🐑</div>
  <div class="loader-text">槐序<span>Lab</span>-槐序实验室</div>
  <div class="loading-status">加载中...</div>
  <div class="loader-bar"><div class="fill"></div></div>
</div>

<!-- ===== 页眉 ===== -->
<header class="header">
  <a href="https://lab.lruriawa.top/" class="brand">
    <span class="logo-icon">🧪</span>
    <span class="brand-text">槐序Lab实验室</span>
  </a>
  <span class="title">🐑 羊了个羊</span>
  <a href="https://lab.lruriawa.top/release/home.html" class="nav-link primary">🏠 首页</a>
</header>

<!-- ===== 游戏主体 ===== -->
<div class="game-wrapper">

  <div class="game-header">
    <span style="opacity:0.5;">🐑</span>
    <span class="score">得分 <span class="num" id="scoreDisplay">0</span></span>
  </div>

  <div class="game-area">
    <canvas id="gameCanvas"></canvas>

    <div class="overlay show" id="startOverlay">
      <div class="icon-big">🐑</div>
      <h2>羊了个羊</h2>
      <p class="sub-text">多层堆叠 · 点击相同图案消除</p>
      <div class="btn-group">
        <button class="btn-start" id="startBtn">🚀 开始游戏</button>

      <div class="btn-group">

<!-- ===== 页脚 ===== -->
<footer class="footer">
  <span class="text">
    🧪 槐序Lab实验室 · 羊了个羊 &nbsp;|&nbsp; <span class="highlight">❤️ Design by DeepSeek</span>
    &nbsp;&nbsp;<span class="love">❤️</span>
  </span>

<script>
// ===== 加载动画隐藏（2.5秒，与统一风格一致） =====
document.addEventListener('DOMContentLoaded', function() {
    setTimeout(function() { document.getElementById('loader').classList.add('hide'); }, 2500);
});
if (document.readyState !== 'loading') {
    setTimeout(function() { document.getElementById('loader').classList.add('hide'); }, 2500);
}

// ============================================================
//  🐑 羊了个羊 - 多层堆叠版
//  以下为游戏核心逻辑，仅修改画布背景适配白色
// ============================================================

const canvas = document.getElementById('gameCanvas');
const ctx = canvas.getContext('2d');
const scoreSpan = document.getElementById('scoreDisplay');
const finalScoreSpan = document.getElementById('finalScore');
const resultIcon = document.getElementById('resultIcon');
const resultTitle = document.getElementById('resultTitle');
const startOverlay = document.getElementById('startOverlay');
const gameOverOverlay = document.getElementById('gameOverOverlay');
const startBtn = document.getElementById('startBtn');
const restartBtn = document.getElementById('restartBtn');
const undoBtn = document.getElementById('undoBtn');
const shuffleBtn = document.getElementById('shuffleBtn');
const homeBtns = document.querySelectorAll('.btn-home, #homeBtn, #homeBtn2');

// ==================== 尺寸 ====================
const COLS = 6;
const ROWS = 6;
const MAX_LAYER = 2; // 0,1,2 三层
let W, H, SIZE, offX, offY;

function resizeCanvas() {
  const rect = canvas.parentElement.getBoundingClientRect();
  W = canvas.width = rect.width;
  H = canvas.height = rect.height;
  canvas.style.width = '100%';
  canvas.style.height = '100%';
  SIZE = Math.min(W / COLS, H / ROWS);
  offX = (W - SIZE * COLS) / 2;
  offY = (H - SIZE * ROWS) / 2;
}
resizeCanvas();
window.addEventListener('resize', resizeCanvas);

// ==================== 图案 ====================
const EMOJIS = ['🐑', '🐄', '🐖', '🐓', '🐴', '🐕', '🐈', '🐇', '🦊', '🐻', '🐼', '🐨'];

// ==================== 游戏状态 ====================
let board = [];
let layers = [];
let selected = null;
let score = 0;
let gameOver = false;
let playing = false;
let history = [];

// ==================== 生成棋盘（多层堆叠） ====================
function generateBoard() {
  const total = COLS * ROWS;
  const pairs = total / 2;
  let pool = [];
  for (let i = 0; i < pairs; i++) {
    pool.push(EMOJIS[i % EMOJIS.length]);
    pool.push(EMOJIS[i % EMOJIS.length]);
  }
  for (let i = pool.length - 1; i > 0; i--) {
    const j = Math.floor(Math.random() * (i + 1));
    [pool[i], pool[j]] = [pool[j], pool[i]];
  }

  board = [];
  layers = [];
  let idx = 0;
  for (let r = 0; r < ROWS; r++) {
    board.push([]);
    layers.push([]);
    for (let c = 0; c < COLS; c++) {
      board[r].push(pool[idx++]);
      const distFromCenter = Math.abs(r - ROWS/2) + Math.abs(c - COLS/2);
      let layer = 0;
      if (distFromCenter <= 2.5) layer = Math.floor(Math.random() * 2) + 1;
      if (distFromCenter <= 1.5) layer = 2;
      layers[r].push(layer);
    }
  }
}

// ==================== 检查卡片是否被遮挡 ====================
function isCovered(row, col) {
  const layer = layers[row][col];
  for (let dr = -1; dr <= 1; dr++) {
    for (let dc = -1; dc <= 1; dc++) {
      if (dr === 0 && dc === 0) continue;
      const nr = row + dr;
      const nc = col + dc;
      if (nr >= 0 && nr < ROWS && nc >= 0 && nc < COLS) {
        if (board[nr][nc] !== null && layers[nr][nc] > layer) {
          return true;
        }
      }
    }
  }
  return false;
}

// ==================== 更新UI ====================
function updateUI() {
  scoreSpan.textContent = score;
}

// ==================== 检查胜利 ====================
function checkWin() {
  for (let r = 0; r < ROWS; r++) {
    for (let c = 0; c < COLS; c++) {
      if (board[r][c] !== null) return false;
    }
  }
  return true;
}

// ==================== 核心：点击处理 ====================
function handleClick(row, col) {
  if (!playing || gameOver) return;
  if (row < 0 || row >= ROWS || col < 0 || col >= COLS) return;
  if (board[row][col] === null) return;

  if (isCovered(row, col)) {
    return;
  }

  if (selected === null) {
    selected = { row, col };
    return;
  }

  if (selected.row === row && selected.col === col) {
    selected = null;
    return;
  }

  const firstVal = board[selected.row][selected.col];
  const secondVal = board[row][col];

  if (firstVal === secondVal) {
    history.push({
      r1: selected.row, c1: selected.col,
      r2: row, c2: col,
      v1: firstVal, v2: secondVal
    });

    board[selected.row][selected.col] = null;
    board[row][col] = null;
    score += 10;
    updateUI();
    selected = null;

    if (checkWin()) {
      gameOver = true;
      playing = false;
      resultIcon.textContent = '🎉';
      resultTitle.textContent = '通关成功！';
      finalScoreSpan.textContent = score;
      gameOverOverlay.classList.add('show');
    }
  } else {
    selected = { row, col };
  }
}

// ==================== 撤回功能 ====================
function undo() {
  if (!playing || gameOver || history.length === 0) return;
  const last = history.pop();
  board[last.r1][last.c1] = last.v1;
  board[last.r2][last.c2] = last.v2;
  score -= 10;
  updateUI();
  selected = null;
}

// ==================== 洗牌功能 ====================
function shuffleBoard() {
  if (!playing || gameOver) return;
  let cards = [];
  for (let r = 0; r < ROWS; r++) {
    for (let c = 0; c < COLS; c++) {
      if (board[r][c] !== null) {
        cards.push({ val: board[r][c], layer: layers[r][c] });
      }
    }
  }
  let vals = cards.map(c => c.val);
  for (let i = vals.length - 1; i > 0; i--) {
    const j = Math.floor(Math.random() * (i + 1));
    [vals[i], vals[j]] = [vals[j], vals[i]];
  }
  let idx = 0;
  for (let r = 0; r < ROWS; r++) {
    for (let c = 0; c < COLS; c++) {
      if (board[r][c] !== null) {
        board[r][c] = vals[idx++];
      }
    }
  }
  selected = null;
}

// ==================== 获取点击坐标 ====================
function getPos(clientX, clientY) {
  const rect = canvas.getBoundingClientRect();
  const scaleX = canvas.width / rect.width;
  const scaleY = canvas.height / rect.height;
  const x = (clientX - rect.left) * scaleX;
  const y = (clientY - rect.top) * scaleY;
  const col = Math.floor((x - offX) / SIZE);
  const row = Math.floor((y - offY) / SIZE);
  if (col >= 0 && col < COLS && row >= 0 && row < ROWS) {
    return { row, col };
  }
  return null;
}

// ==================== 绘制（白色背景适配） ====================
function draw() {
  ctx.clearRect(0, 0, W, H);
  
  // 白色背景
  ctx.fillStyle = '#ffffff';
  ctx.fillRect(0, 0, W, H);

  let cards = [];
  for (let r = 0; r < ROWS; r++) {
    for (let c = 0; c < COLS; c++) {
      if (board[r][c] !== null) {
        cards.push({ r, c, layer: layers[r][c] });
      }
    }
  }
  cards.sort((a, b) => a.layer - b.layer);

  for (let card of cards) {
    const r = card.r;
    const c = card.c;
    const val = board[r][c];
    const x = offX + c * SIZE;
    const y = offY + r * SIZE;
    const pad = 3;
    const radius = 10;
    const isSelected = selected && selected.row === r && selected.col === c;
    const covered = isCovered(r, c);

    // 阴影 - 适配白色背景
    ctx.shadowColor = isSelected ? 'rgba(33,110,57,0.25)' : 'rgba(0,0,0,0.04)';
    ctx.shadowBlur = isSelected ? 25 : 6;
    ctx.shadowOffsetY = isSelected ? 0 : 1;

    const hue = (val.charCodeAt(0) * 37 + val.charCodeAt(1) * 13) % 360;
    const g = ctx.createLinearGradient(x, y, x + SIZE, y + SIZE);
    
    if (isSelected) {
      g.addColorStop(0, 'rgba(33,110,57,0.15)');
      g.addColorStop(1, 'rgba(33,110,57,0.08)');
    } else if (covered) {
      g.addColorStop(0, `hsla(${hue}, 30%, 85%, 0.5)`);
      g.addColorStop(1, `hsla(${hue + 30}, 20%, 90%, 0.3)`);
    } else {
      g.addColorStop(0, `hsla(${hue}, 60%, 88%, 0.8)`);
      g.addColorStop(1, `hsla(${hue + 30}, 50%, 82%, 0.6)`);
    }
    ctx.fillStyle = g;
    ctx.beginPath();
    ctx.roundRect(x + pad, y + pad, SIZE - pad*2, SIZE - pad*2, radius);
    ctx.fill();

    ctx.shadowBlur = 0;
    ctx.shadowOffsetY = 0;

    // 边框
    if (covered) {
      ctx.strokeStyle = 'rgba(0,0,0,0.04)';
    } else {
      ctx.strokeStyle = isSelected ? 'rgba(33,110,57,0.4)' : 'rgba(0,0,0,0.06)';
    }
    ctx.lineWidth = isSelected ? 2.5 : 1;
    ctx.beginPath();
    ctx.roundRect(x + pad, y + pad, SIZE - pad*2, SIZE - pad*2, radius);
    ctx.stroke();

    // 内容
    if (covered) {
      ctx.fillStyle = 'rgba(0,0,0,0.08)';
      ctx.font = `${SIZE * 0.25}px Arial`;
      ctx.textAlign = 'center';
      ctx.textBaseline = 'middle';
      ctx.fillText('🔒', x + SIZE/2, y + SIZE/2 + 2);
    } else {
      ctx.shadowBlur = 0;
      ctx.font = `${SIZE * 0.48}px Arial`;
      ctx.textAlign = 'center';
      ctx.textBaseline = 'middle';
      ctx.fillStyle = '#1a1a1a';
      ctx.shadowColor = 'rgba(0,0,0,0.05)';
      ctx.shadowBlur = 4;
      ctx.shadowOffsetY = 1;
      ctx.fillText(val, x + SIZE/2, y + SIZE/2 + 2);
      ctx.shadowBlur = 0;
      ctx.shadowOffsetY = 0;
    }
  }
}

if (!CanvasRenderingContext2D.prototype.roundRect) {
  CanvasRenderingContext2D.prototype.roundRect = function(x, y, w, h, radii) {
    const r = typeof radii === 'number' ? radii : (radii || 0);
    this.moveTo(x + r, y);
    this.arcTo(x + w, y, x + w, y + h, r);
    this.arcTo(x + w, y + h, x, y + h, r);
    this.arcTo(x, y + h, x, y, r);
    this.arcTo(x, y, x + w, y, r);
    return this;
  };
}

// ==================== 游戏循环 ====================
function loop() {
  draw();
  requestAnimationFrame(loop);
}

// ==================== 游戏控制 ====================
function resetGame() {
  generateBoard();
  selected = null;
  score = 0;
  gameOver = false;
  playing = false;
  history = [];
  updateUI();
  startOverlay.classList.add('show');
  gameOverOverlay.classList.remove('show');
}

function startGame() {
  generateBoard();
  selected = null;
  score = 0;
  gameOver = false;
  playing = true;
  history = [];
  updateUI();
  startOverlay.classList.remove('show');
  gameOverOverlay.classList.remove('show');
}

// ==================== 事件绑定 ====================
canvas.addEventListener('click', function(e) {
  const pos = getPos(e.clientX, e.clientY);
  if (pos) handleClick(pos.row, pos.col);
});

canvas.addEventListener('touchstart', function(e) {
  e.preventDefault();
  const touch = e.touches[0];
  const pos = getPos(touch.clientX, touch.clientY);
  if (pos) handleClick(pos.row, pos.col);
}, { passive: false });

startBtn.addEventListener('click', startGame);
restartBtn.addEventListener('click', startGame);
undoBtn.addEventListener('click', undo);
shuffleBtn.addEventListener('click', shuffleBoard);
homeBtns.forEach(function(btn) {
  btn.addEventListener('click', function() {
    window.location.href = 'https://lab.lruriawa.top/release/home.html';
  });
});

// ==================== 启动 ====================
resetGame();
loop();
</script>
